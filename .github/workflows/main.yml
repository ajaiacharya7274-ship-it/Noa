name: Deploy NOA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build NOA
        run: npm run build

      - name: Copy NOA engine into Pages output
        run: cp noa-state-engine-48-1.html out/noa.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload NOA build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy NOA
        id: deployment
        uses: actions/deploy-pages@v4
