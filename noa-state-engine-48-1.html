<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta
  name="theme-color"
  content="#000000">

<title>NOA</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

body{
  font-family:Inter,Arial,sans-serif;
  color:#4fa3ff;
  touch-action:manipulation;
}

button,
input{
  font-family:inherit;
}


/* =========================================================
   APP
========================================================= */

#app{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}


/* =========================================================
   ORB
========================================================= */

#orb{
  position:relative;

  width:280px;
  height:280px;

  flex:0 0 280px;

  transform:scale(1);
  transform-origin:center center;

  user-select:none;
  -webkit-user-select:none;

  cursor:default;

  will-change:transform;

  touch-action:none;
}

#orbGlow{
  position:absolute;

  inset:-55px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(30,110,255,.34),
      rgba(20,80,220,.10) 42%,
      transparent 72%
    );

  filter:blur(18px);

  animation:breathe 4.5s ease-in-out infinite;

  pointer-events:none;
}

@keyframes breathe{

  0%,100%{
    opacity:.70;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.05);
  }
}


/* =========================================================
   ORB SVG
========================================================= */

#orb svg{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  overflow:visible;

  pointer-events:none;
}

.r1{
  animation:r1 22s linear infinite;
  transform-origin:140px 140px;
}

.r2{
  animation:r2 17s linear infinite;
  transform-origin:140px 140px;
}

.r3{
  animation:r3 13s linear infinite;
  transform-origin:140px 140px;
}

.r4{
  animation:r1 27s linear infinite;
  transform-origin:140px 140px;
}

@keyframes r1{

  to{
    transform:rotate(360deg);
  }
}

@keyframes r2{

  from{
    transform:rotate(360deg);
  }

  to{
    transform:rotate(0deg);
  }
}

@keyframes r3{

  to{
    transform:rotate(-360deg);
  }
}


/* =========================================================
   ORB CENTER
========================================================= */

#center{
  position:absolute;

  inset:0;

  z-index:5;

  pointer-events:none;
}

#wave{
  position:absolute;

  left:50%;
  top:50%;

  width:150px;
  height:30px;

  transform:translate(-50%,-50%);

  display:flex;

  align-items:center;
  justify-content:center;

  gap:3px;

  opacity:1;
}

#wave i{
  display:block;

  width:2px;

  border-radius:4px;

  background:#4fa3ff;

  box-shadow:
    0 0 7px rgba(79,163,255,.75),
    0 0 14px rgba(79,163,255,.25);

  animation:
    wave 1s ease-in-out infinite alternate;

  transform-origin:center;
}

@keyframes wave{

  from{
    transform:scaleY(.28);
    opacity:.35;
  }

  to{
    transform:scaleY(1);
    opacity:1;
  }
}


/* =========================================================
   STATE
========================================================= */

#state{
  position:absolute;

  left:50%;
  top:calc(50% + 27px);

  transform:translateX(-50%);

  font-size:10px;

  line-height:1;

  letter-spacing:3px;

  text-transform:uppercase;

  white-space:nowrap;

  color:#4fa3ff;

  text-shadow:
    0 0 8px rgba(79,163,255,.75),
    0 0 18px rgba(79,163,255,.25);
}


/* =========================================================
   SPOKEN TEXT
========================================================= */

#spokenText{
  position:absolute;

  left:50%;
  top:calc(50% + 47px);

  transform:translateX(-50%);

  width:190px;

  text-align:center;

  color:#4fa3ff;

  font-size:10px;

  line-height:1.45;

  letter-spacing:.4px;

  text-shadow:
    0 0 7px rgba(79,163,255,.85),
    0 0 14px rgba(79,163,255,.45);

  opacity:0;

  transition:opacity .15s ease;

  z-index:10;

  pointer-events:none;
}

body[data-state="speaking"] #state{
  opacity:0;
}

body[data-state="speaking"] #spokenText{
  opacity:1;
}


/* =========================================================
   STATE ANIMATIONS
========================================================= */

body[data-state="listening"] #orbGlow{
  animation:breathe 1.15s ease-in-out infinite;
}

body[data-state="thinking"] #orbGlow{
  animation:breathe 1.6s ease-in-out infinite;
}

body[data-state="executing"] #orbGlow{
  animation:breathe .7s ease-in-out infinite;
}

body[data-state="speaking"] #orbGlow{
  animation:breathe .8s ease-in-out infinite;
}

body[data-state="complete"] #orbGlow{
  animation:pulse .7s ease-out 1;
}

@keyframes pulse{

  50%{
    transform:scale(1.2);
    opacity:1;
  }
}

body[data-state="listening"] #wave i{
  animation-duration:.28s;
}

body[data-state="thinking"] #wave i{
  animation-duration:.50s;
}

body[data-state="speaking"] #wave i{
  animation-duration:.42s;
}

body[data-state="executing"] #wave i{
  animation-duration:.22s;
}


/* =========================================================
   MIC
========================================================= */

#mic{
  position:fixed;

  right:28px;
  bottom:28px;

  left:auto;
  top:auto;

  width:48px;
  height:48px;

  margin:0;
  padding:0;

  border-radius:50%;

  z-index:30;

  display:flex;

  align-items:center;
  justify-content:center;

  border:2px solid #4fa3ff;

  background:
    rgba(79,163,255,.12);

  color:#4fa3ff;

  box-shadow:
    0 0 22px rgba(79,163,255,.25),
    inset 0 0 10px rgba(79,163,255,.08);

  font-size:18px;

  line-height:1;

  user-select:none;
  -webkit-user-select:none;

  touch-action:none;

  cursor:grab;

  transition:
    border-color .2s ease,
    color .2s ease,
    background .2s ease,
    box-shadow .2s ease;

  transform:none;
}

#mic.dragging{
  cursor:grabbing;
}

#mic.on{
  border-color:#35e887;

  color:#35e887;

  background:
    rgba(53,232,135,.16);

  box-shadow:
    0 0 30px rgba(53,232,135,.48),
    0 0 55px rgba(53,232,135,.16),
    inset 0 0 12px rgba(53,232,135,.12);
}


/* =========================================================
   CHAT OVERLAY
========================================================= */

#chatOverlay{
  position:fixed;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,.58);

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  opacity:0;

  pointer-events:none;

  transition:opacity .2s ease;
}

#chatOverlay.open{
  opacity:1;

  pointer-events:auto;
}


/* =========================================================
   CHAT BOX
   DRAG + RESIZE READY
========================================================= */

#chatBox{
  position:relative;

  width:min(430px,92vw);

  height:min(650px,80vh);

  min-width:280px;
  min-height:280px;

  max-width:92vw;
  max-height:90vh;

  display:flex;

  flex-direction:column;

  border:
    1px solid rgba(79,163,255,.45);

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      rgba(5,13,28,.98),
      rgba(1,5,12,.98)
    );

  box-shadow:
    0 0 45px rgba(25,105,220,.22),
    inset 0 0 30px rgba(79,163,255,.035);

  overflow:hidden;

  transform:
    translate3d(0,0,0)
    scale(1);

  transform-origin:center center;

  transition:
    transform .2s ease;

  touch-action:none;

  resize:both;
}


/* =========================================================
   CHAT HEADER
   HEADER IS THE DRAG HANDLE
========================================================= */

#chatHeader{
  height:54px;

  min-height:54px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:space-between;

  padding:
    0 12px 0 18px;

  border-bottom:
    1px solid rgba(120,180,255,.13);

  cursor:grab;

  user-select:none;
  -webkit-user-select:none;

  touch-action:none;
}

#chatHeader.dragging{
  cursor:grabbing;
}

#chatTitle{
  color:#7dbdff;

  font-size:11px;

  letter-spacing:3px;

  text-transform:uppercase;

  pointer-events:none;
}

#chatActions{
  display:flex;

  gap:7px;

  cursor:default;
}

.chatAction{
  width:34px;
  height:34px;

  flex:0 0 34px;

  border:
    1px solid rgba(79,163,255,.25);

  border-radius:9px;

  background:
    rgba(79,163,255,.07);

  color:#9dccff;

  cursor:pointer;

  font-size:15px;

  padding:0;

  font-weight:700;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;
}


/* =========================================================
   CHAT HISTORY
========================================================= */

#chatHistory{
  flex:1;

  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:14px;

  display:flex;

  flex-direction:column;

  gap:10px;

  scrollbar-width:thin;

  touch-action:pan-y;
}

.message{
  max-width:88%;

  padding:10px 12px;

  border-radius:13px;

  font-size:13px;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;
}

.message.user{
  align-self:flex-end;

  color:#dff0ff;

  background:
    rgba(79,163,255,.12);

  border:
    1px solid rgba(79,163,255,.22);

  border-bottom-right-radius:4px;
}

.message.noa{
  align-self:flex-start;

  color:#dcecff;

  background:
    rgba(8,18,35,.9);

  border:
    1px solid rgba(79,163,255,.17);

  border-bottom-left-radius:4px;

  box-shadow:
    0 0 15px rgba(25,105,220,.08);
}

.messageLabel{
  display:block;

  margin-bottom:4px;

  font-size:8px;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#6dafff;

  opacity:.7;
}


/* =========================================================
   CHAT HINT
========================================================= */

#chatHint{
  padding:
    0 12px 9px;

  color:#50708f;

  font-size:9px;

  text-align:center;

  flex-shrink:0;
}


/* =========================================================
   CHAT INPUT
========================================================= */

#chatInputArea{
  display:flex;

  gap:7px;

  padding:10px;

  border-top:
    1px solid rgba(120,180,255,.13);

  flex-shrink:0;
}

#chatInput{
  flex:1;

  min-width:0;

  height:42px;

  border:
    1px solid rgba(79,163,255,.22);

  border-radius:11px;

  outline:none;

  background:
    rgba(79,163,255,.05);

  color:#dcecff;

  padding:
    0 12px;

  font-size:13px;

  touch-action:auto;
}

#chatInput::placeholder{
  color:#6684a5;
}

#sendChat{
  width:44px;
  height:42px;

  flex:0 0 44px;

  border:
    1px solid rgba(79,163,255,.35);

  border-radius:11px;

  background:
    rgba(79,163,255,.10);

  color:#8fc8ff;

  cursor:pointer;

  font-size:17px;

  padding:0;
}


/* =========================================================
   CHAT ZOOM CONTROLS
========================================================= */

#chatZoomControls{
  position:absolute;

  right:12px;
  top:64px;

  z-index:10;

  display:flex;

  flex-direction:column;

  gap:5px;

  opacity:.8;
}

.chatZoomButton{
  width:30px;
  height:30px;

  border:
    1px solid rgba(79,163,255,.25);

  border-radius:8px;

  background:
    rgba(5,18,38,.75);

  color:#8fc8ff;

  cursor:pointer;

  font-size:16px;

  line-height:1;

  padding:0;

  touch-action:manipulation;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

  #orb{
    width:280px;
    height:280px;

    flex-basis:280px;
  }

  #mic{
    right:20px;
    bottom:20px;
  }

  #chatBox{
    width:92vw;
    height:78vh;

    min-width:260px;
    min-height:260px;

    border-radius:18px;
  }

}


/* =========================================================
   SMALL HEIGHT
========================================================= */

@media(max-height:600px){

  #orb{
    width:240px;
    height:240px;

    flex-basis:240px;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  #orbGlow,
  .r1,
  .r2,
  .r3,
  .r4,
  #wave i{

    animation-duration:.001ms !important;

    animation-iteration-count:1 !important;

  }

}

"use strict";


/* =========================================================
   NOA // PART 2
   JAVASCRIPT CORE
========================================================= */


/* =========================================================
   ELEMENT REFERENCES
========================================================= */

const body =
  document.body;

const app =
  document.getElementById("app");

const orb =
  document.getElementById("orb");

const orbGlow =
  document.getElementById("orbGlow");

const wave =
  document.getElementById("wave");

const state =
  document.getElementById("state");

const spokenText =
  document.getElementById("spokenText");

const mic =
  document.getElementById("mic");

const chatOverlay =
  document.getElementById("chatOverlay");

const chatBox =
  document.getElementById("chatBox");

const chatHeader =
  document.getElementById("chatHeader");

const chatHistory =
  document.getElementById("chatHistory");

const chatHint =
  document.getElementById("chatHint");

const chatInput =
  document.getElementById("chatInput");

const sendChat =
  document.getElementById("sendChat");

const closeChat =
  document.getElementById("closeChat");

const clearChat =
  document.getElementById("clearChat");

const chatZoomIn =
  document.getElementById("chatZoomIn");

const chatZoomOut =
  document.getElementById("chatZoomOut");

const chatZoomReset =
  document.getElementById("chatZoomReset");


/* =========================================================
   NOA WORKER
========================================================= */

const NOA_WORKER =
  "https://noa-brain-a78d.ajaiacharya7274.workers.dev/api/chat";


/* =========================================================
   GENERAL STATE
========================================================= */

let currentState =
  "idle";

let listening =
  false;


/* =========================================================
   STATE CONTROLLER
========================================================= */

function setState(value){

  const next =
    String(value || "idle")
      .trim()
      .toLowerCase();

  currentState =
    next;

  body.dataset.state =
    next;

  state.textContent =
    next.toUpperCase();

}


window.NOA = {

  setState,

  getState(){

    return state.textContent;

  },

  ask

};


/* =========================================================
   WAVEFORM
========================================================= */

const waveformHeights = [

  5,8,12,18,11,23,16,29,19,
  24,14,9,6,10,16,22,15,20,
  27,17,10,14,20,25,15,9,5

];


waveformHeights.forEach(
  (height,index)=>{

    const bar =
      document.createElement("i");

    bar.style.height =
      height + "px";

    bar.style.animationDelay =
      (index * 0.04) + "s";

    wave.appendChild(
      bar
    );

  }
);


/* =========================================================
   ORB ZOOM
========================================================= */

let zoom =
  1;

const MIN_ZOOM =
  0.5;

const MAX_ZOOM =
  2.5;


function clamp(
  value,
  minimum,
  maximum
){

  return Math.max(
    minimum,
    Math.min(
      maximum,
      value
    )
  );

}


function applyOrbZoom(){

  orb.style.transform =
    "scale(" +
    zoom +
    ")";

}


/* =========================================================
   DESKTOP WHEEL ZOOM
========================================================= */

orb.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    const direction =
      event.deltaY < 0
        ? 0.1
        : -0.1;

    zoom =
      clamp(
        zoom + direction,
        MIN_ZOOM,
        MAX_ZOOM
      );

    applyOrbZoom();

  },
  {
    passive:false
  }
);


/* =========================================================
   MOBILE PINCH ZOOM
========================================================= */

let pinchStartDistance =
  0;

let pinchStartZoom =
  1;


function getTouchDistance(
  touches
){

  if(
    !touches ||
    touches.length < 2
  ){

    return 0;

  }

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.hypot(
    dx,
    dy
  );

}


orb.addEventListener(
  "touchstart",
  event=>{

    if(
      event.touches.length !== 2
    ){

      return;

    }

    pinchStartDistance =
      getTouchDistance(
        event.touches
      );

    pinchStartZoom =
      zoom;

  },
  {
    passive:true
  }
);


orb.addEventListener(
  "touchmove",
  event=>{

    if(
      event.touches.length !== 2 ||
      pinchStartDistance <= 0
    ){

      return;

    }

    event.preventDefault();

    const distance =
      getTouchDistance(
        event.touches
      );

    if(!distance){

      return;

    }

    zoom =
      pinchStartZoom *
      (
        distance /
        pinchStartDistance
      );

    zoom =
      clamp(
        zoom,
        MIN_ZOOM,
        MAX_ZOOM
      );

    applyOrbZoom();

  },
  {
    passive:false
  }
);


orb.addEventListener(
  "touchend",
  event=>{

    if(
      event.touches.length < 2
    ){

      pinchStartDistance =
        0;

    }

  },
  {
    passive:true
  }
);


orb.addEventListener(
  "touchcancel",
  ()=>{

    pinchStartDistance =
      0;

  },
  {
    passive:true
  }
);

/* =========================================================
   MIC DRAG
   TAP AND DRAG ARE KEPT SEPARATE
========================================================= */

let micPointer =
  null;

let micMoved =
  false;


mic.addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();

    micPointer = {

      id:
        event.pointerId,

      startX:
        event.clientX,

      startY:
        event.clientY,

      startRight:
        parseFloat(
          getComputedStyle(
            mic
          ).right
        ) || 28,

      startBottom:
        parseFloat(
          getComputedStyle(
            mic
          ).bottom
        ) || 28

    };

    micMoved =
      false;

    try{

      mic.setPointerCapture(
        event.pointerId
      );

    }catch(error){}

  }
);


mic.addEventListener(
  "pointermove",
  event=>{

    if(
      !micPointer ||
      event.pointerId !==
      micPointer.id
    ){

      return;

    }

    const dx =
      event.clientX -
      micPointer.startX;

    const dy =
      event.clientY -
      micPointer.startY;

    if(
      Math.hypot(dx,dy) <= 8
    ){

      return;

    }

    micMoved =
      true;

    mic.classList.add(
      "dragging"
    );


    const maxRight =
      Math.max(
        8,
        window.innerWidth -
        mic.offsetWidth -
        8
      );


    const maxBottom =
      Math.max(
        8,
        window.innerHeight -
        mic.offsetHeight -
        8
      );


    const newRight =
      clamp(
        micPointer.startRight -
        dx,
        8,
        maxRight
      );


    const newBottom =
      clamp(
        micPointer.startBottom -
        dy,
        8,
        maxBottom
      );


    mic.style.right =
      newRight + "px";

    mic.style.bottom =
      newBottom + "px";

  }
);


mic.addEventListener(
  "pointerup",
  event=>{

    if(
      !micPointer ||
      event.pointerId !==
      micPointer.id
    ){

      return;

    }

    try{

      mic.releasePointerCapture(
        event.pointerId
      );

    }catch(error){}


    mic.classList.remove(
      "dragging"
    );


    const wasMoved =
      micMoved;


    micPointer =
      null;

    micMoved =
      false;


    if(
      wasMoved
    ){

      return;

    }


    toggleListening();

  }
);


mic.addEventListener(
  "pointercancel",
  event=>{

    if(
      micPointer &&
      event.pointerId ===
      micPointer.id
    ){

      try{

        mic.releasePointerCapture(
          event.pointerId
        );

      }catch(error){}

    }


    micPointer =
      null;

    micMoved =
      false;

    mic.classList.remove(
      "dragging"
    );

  }
);

  0.65;

  1.5;

  0.1;


function applyChatZoom(){

  chatZoom =
    clamp(
      chatZoom,
      CHAT_MIN_ZOOM,
      CHAT_MAX_ZOOM
    );

  applyChatPosition();

}


function changeChatZoom(
  amount
){

  chatZoom =
    clamp(
      chatZoom + amount,
      CHAT_MIN_ZOOM,
      CHAT_MAX_ZOOM
    );

  applyChatZoom();

}

    );

   DOUBLE TAP ORB
========================================================= */

let lastOrbTap =
  0;

let orbTapTimer =
  null;


orb.addEventListener(
  "click",
  event=>{

    const now =
      Date.now();


    if(
      now - lastOrbTap < 380
    ){

      if(
        orbTapTimer
      ){

        clearTimeout(
          orbTapTimer
        );

        orbTapTimer =
          null;

      }


      lastOrbTap =
        0;

      openChat();

      return;

    }


    lastOrbTap =
      now;


    if(
      orbTapTimer
    ){

      clearTimeout(
        orbTapTimer
      );

    }


    orbTapTimer =
      setTimeout(
        ()=>{

          lastOrbTap =
            0;

          orbTapTimer =
            null;

        },
        400
      );

  }
);

/* =========================================================
   CHAT STORAGE
========================================================= */

const STORAGE_KEY =
  "NOA_CHAT_HISTORY_V1";

let history =
  [];


try{

  const stored =
    localStorage.getItem(
      STORAGE_KEY
    );


  if(stored){

    const parsed =
      JSON.parse(
        stored
      );


    if(
      Array.isArray(parsed)
    ){

      history =
        parsed;

    }

  }

}catch(error){

  console.warn(
    "NOA history load failed:",
    error
  );

  history =
    [];

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        history
      )
    );

  }catch(error){

    console.warn(
      "NOA history save failed:",
      error
    );

  }

}


/* =========================================================
   RENDER HISTORY
========================================================= */

function renderHistory(){

  chatHistory.innerHTML =
    "";


  history.forEach(
    item=>{

      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message " +
        (
          item.role === "user"
            ? "user"
            : "noa"
        );


      const label =
        document.createElement(
          "span"
        );


      label.className =
        "messageLabel";


      label.textContent =
        item.role === "user"
          ? "YOU"
          : "NOA";


      const content =
        document.createElement(
          "span"
        );


      content.textContent =
        String(
          item.text || ""
        );


      bubble.appendChild(
        label
      );


      bubble.appendChild(
        content
      );


      chatHistory.appendChild(
        bubble
      );

    }
  );


  chatHistory.scrollTop =
    chatHistory.scrollHeight;

}


/* =========================================================
   ADD HISTORY
========================================================= */

function addHistory(
  role,
  text
){

  history.push({

    role:
      role === "user"
        ? "user"
        : "noa",

    text:
      String(text)

  });


  if(
    history.length > 100
  ){

    history =
      history.slice(
        -100
      );

  }


  saveHistory();

  renderHistory();

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

clearChat.addEventListener(
  "click",
  event=>{

    event.preventDefault();

    event.stopPropagation();


    if(
      !history.length
    ){

      return;

    }


    const confirmed =
      window.confirm(
        "Clear NOA chat history?"
      );


    if(!confirmed){

      return;

    }


    history =
      [];

    saveHistory();

    renderHistory();

  }
);


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition =
  null;


if(
  SpeechRecognition
){

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    ()=>{

      listening =
        true;

      setMicVisual(
        true
      );

      setState(
        "listening"
      );

    };


  recognition.onresult =
    event=>{

      let finalText =
        "";

      let interimText =
        "";


      for(
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ){

        const transcript =
          event.results[i][0]
            .transcript;


        if(
          event.results[i].isFinal
        ){

          finalText +=
            transcript;

        }else{

          interimText +=
            transcript;

        }

      }


      const visibleText =
        (
          finalText ||
          interimText
        ).trim();


      if(
        visibleText
      ){

        spokenText.textContent =
          visibleText;

      }


      if(
        finalText.trim()
      ){

        const message =
          finalText.trim();


        spokenText.textContent =
          "";


        ask(
          message
        );

      }

    };


  recognition.onerror =
    event=>{

      console.warn(
        "NOA speech error:",
        event.error
      );


      listening =
        false;


      setMicVisual(
        false
      );


      spokenText.textContent =
        "";


      setState(
        "idle"
      );

    };


  recognition.onend =
    ()=>{

      listening =
        false;


      setMicVisual(
        false
      );


      if(
        body.dataset.state ===
        "listening"
      ){

        setState(
          "idle"
        );

      }

    };

}


/* =========================================================
   MIC TOGGLE
========================================================= */

function toggleListening(){

  if(
    !recognition
  ){

    window.alert(
      "Speech recognition is not supported in this browser."
    );

    return;

  }


  if(
    listening
  ){

    try{

      recognition.stop();

    }catch(error){}


    listening =
      false;


    setMicVisual(
      false
    );


    setState(
      "idle"
    );


    return;

  }


  spokenText.textContent =
    "";


  try{

    recognition.start();

  }catch(error){

    console.warn(
      "NOA recognition start failed:",
      error
    );

  }

}

        )
      ){

        resizeHandle.releasePointerCapture(
          dragPointerId
        );

      }

    }catch(_){}

    dragPointerId = null;

  }


  resizeHandle.addEventListener(
    "pointerup",
    stopChatResize
  );

  resizeHandle.addEventListener(
    "pointercancel",
    stopChatResize
  );


  /* ----------------------------------------------------------
     CHAT ZOOM — CTRL/WHEEL
  ---------------------------------------------------------- */

  chatBox.addEventListener(
    "wheel",
    event=>{

      if(!event.ctrlKey){
        return;
      }

      event.preventDefault();

      chatScale +=
        event.deltaY < 0
          ? 0.05
          : -0.05;

      chatScale =
        Math.max(
          MIN_CHAT_SCALE,
          Math.min(
            MAX_CHAT_SCALE,
            chatScale
          )
        );

      applyChatScale();

    },
    {
      passive:false
    }
  );


  /* ----------------------------------------------------------
     CHAT DOUBLE-TAP ZOOM
  ---------------------------------------------------------- */

  let lastChatTap = 0;

  chatBox.addEventListener(
    "pointerup",
    event=>{

      if(
        event.target.closest(
          "button,input"
        )
      ){
        return;
      }

      const now =
        Date.now();

      if(
        now - lastChatTap <
        300
      ){

        chatScale =
          chatScale >= 1.15
            ? 1
            : 1.25;

        applyChatScale();

      }

      lastChatTap = now;

    }
  );


  /* ----------------------------------------------------------
     RESET CHAT WINDOW WHEN OPENED
  ---------------------------------------------------------- */

  const originalOpenChat =
    window.NOA &&
    window.NOA.openChat
      ? window.NOA.openChat
      : null;


  window.NOA =
    window.NOA || {};


  window.NOA.openChat =
    function(){

      chatOverlay.classList.add(
        "open"
      );

      if(
        typeof renderHistory ===
        "function"
      ){

        renderHistory();

      }

      setTimeout(
        ()=>{

          if(chatInput){
            chatInput.focus();
          }

        },
        120
      );

    };


})();


/* ============================================================
   POPUP MANAGER
   Allows multiple independent NOA popups.
============================================================ */

const NOAPopupManager =
(function(){

  const popups =
    new Set();

  let popupSequence = 0;


  function bringToFront(
    popup
  ){

    if(!popup){
      return;
    }

    popupSequence++;

    popup.style.zIndex =
      String(
        200 + popupSequence
      );

  }


  function makeDraggable(
    popup,
    handle
  ){

    if(
      !popup ||
      !handle
    ){
      return;
    }

    let active = false;
    let pointerId = null;

    let offsetX = 0;
    let offsetY = 0;


    handle.addEventListener(
      "pointerdown",
      event=>{

        if(
          event.target.closest(
            "button,input,textarea"
          )
        ){
          return;
        }

        active = true;
        pointerId =
          event.pointerId;

        const rect =
          popup.getBoundingClientRect();

        offsetX =
          event.clientX -
          rect.left;

        offsetY =
          event.clientY -
          rect.top;


        popup.classList.add(
          "dragging"
        );

        bringToFront(
          popup
        );

        handle.setPointerCapture(
          pointerId
        );

        event.preventDefault();

      }
    );


    handle.addEventListener(
      "pointermove",
      event=>{

        if(
          !active ||
          event.pointerId !==
          pointerId
        ){
          return;
        }

        const rect =
          popup.getBoundingClientRect();

        let left =
          event.clientX -
          offsetX;

        let top =
          event.clientY -
          offsetY;


        left =
          Math.max(
            4,
            Math.min(
              window.innerWidth -
              rect.width -
              4,
              left
            )
          );


        top =
          Math.max(
            4,
            Math.min(
              window.innerHeight -
              rect.height -
              4,
              top
            )
          );


        popup.style.left =
          left + "px";

        popup.style.top =
          top + "px";

        popup.style.transform =
          "none";

      }
    );


    function stop(event){

      if(
        !active ||
        (
          event &&
          event.pointerId !==
          pointerId
        )
      ){
        return;
      }

      active = false;

      popup.classList.remove(
        "dragging"
      );

      try{

        if(
          handle.hasPointerCapture(
            pointerId
          )
        ){

          handle.releasePointerCapture(
            pointerId
          );

        }

      }catch(_){}

      pointerId = null;

    }


    handle.addEventListener(
      "pointerup",
      stop
    );

    handle.addEventListener(
      "pointercancel",
      stop
    );

  }


  function create(
    title,
    message
  ){

    const layer =
      document.getElementById(
        "popupLayer"
      );

    if(!layer){
      return null;
    }


    const popup =
      document.createElement(
        "div"
      );

    popup.className =
      "noa-popup";


    popup.innerHTML = `
      <div class="noa-popup-head">
        <div class="noa-popup-title"></div>

        <div class="noa-popup-actions">
          <button
            type="button"
            data-close
            aria-label="Close">
            ×
          </button>
        </div>
      </div>

      <div class="noa-popup-body"></div>

      <div class="noa-popup-tools">
        <button
          type="button"
          data-minus>
          −
        </button>

        <button
          type="button"
          data-plus>
          +
        </button>
      </div>
    `;


    popup.querySelector(
      ".noa-popup-title"
    ).textContent =
      String(
        title || "NOA"
      );


    popup.querySelector(
      ".noa-popup-body"
    ).textContent =
      String(
        message || ""
      );


    const head =
      popup.querySelector(
        ".noa-popup-head"
      );


    const close =
      popup.querySelector(
        "[data-close]"
      );


    const minus =
      popup.querySelector(
        "[data-minus]"
      );


    const plus =
      popup.querySelector(
        "[data-plus]"
      );


    let scale = 1;


    function applyScale(){

      popup.style.transform =
        "scale(" +
        scale +
        ")";

    }


    close.addEventListener(
      "click",
      ()=>{
        popups.delete(popup);
        popup.remove();
      }
    );


    minus.addEventListener(
      "click",
      ()=>{
        scale =
          Math.max(
            .7,
            scale - .1
          );

        applyScale();
      }
    );


    plus.addEventListener(
      "click",
      ()=>{
        scale =
          Math.min(
            1.6,
            scale + .1
          );

        applyScale();
      }
    );


    popup.addEventListener(
      "pointerdown",
      ()=>{
        bringToFront(
          popup
        );
      }
    );


    layer.appendChild(
      popup
    );


    const existing =
      popups.size;


    const offset =
      Math.min(
        existing * 24,
        120
      );


    popup.style.left =
      `calc(50% + ${offset}px)`;


    popup.style.top =
      `calc(50% + ${offset}px)`;


    makeDraggable(
      popup,
      head
    );


    popups.add(
      popup
    );


    bringToFront(
      popup
    );


    return popup;

  }


  function closeAll(){

    popups.forEach(
      popup=>{
        popup.remove();
      }
    );

    popups.clear();

  }


  function list(){

    return [
      ...popups
    ];

  }


  return {
    create,
    closeAll,
    list,
    bringToFront
  };

})();


window.NOA =
  window.NOA || {};

window.NOA.popups =
  NOAPopupManager;


/* ============================================================
   TEMPORARY RESULT POPUP
============================================================ */

window.NOA.showTemporaryResult =
function(
  title,
  message,
  ms = 5000
){

  const popup =
    NOAPopupManager.create(
      title,
      message
    );

  if(!popup){
    return null;
  }


  const duration =
    Math.max(
      1000,
      Math.min(
        30000,
        Number(ms) || 5000
      )
    );


  const timer =
    setTimeout(
      ()=>{

        if(
          popup &&
          popup.isConnected
        ){

          popup.remove();

        }

      },
      duration
    );


  popup.addEventListener(
    "DOMNodeRemoved",
    ()=>{
      clearTimeout(timer);
    },
    {
      once:true
    }
  );


  return popup;

};


/* ============================================================
   NOA TASK ENGINE
============================================================ */

const NOATaskEngine =
(function(){

  const tasks =
    new Map();

  let sequence = 0;


  function createTask(
    input
  ){

    const id =
      "task_" +
      (++sequence);


    const task = {

      id,

      input:
        String(
          input || ""
        ).trim(),

      status:
        "received",

      risk:
        "LOW",

      plan:
        null,

      result:
        null,

      response:
        null,

      createdAt:
        Date.now()

    };


    tasks.set(
      id,
      task
    );


    return task;

  }


  function update(
    task,
    patch
  ){

    Object.assign(
      task,
      patch
    );

    tasks.set(
      task.id,
      task
    );

    return task;

  }


  function perceive(
    task
  ){

    return update(
      task,
      {
        status:"perceived",

        context:{
          screen:"NOA orb",

          state:
            document.body
              .dataset
              .state ||
            "idle",

          time:
            new Date()
              .toISOString()
        }

      }
    );

  }


  function understand(
    task
  ){

    if(
      window.NOA &&
      typeof window.NOA
        .parseCommand ===
        "function"
    ){

      const parsed =
        window.NOA.parseCommand(
          task.input
        );


      return update(
        task,
        {
          status:
            "understood",

          parsed,

          intent:
            parsed &&
            parsed.type
              ? parsed.type
              : "unknown"
        }
      );

    }


    return update(
      task,
      {
        status:
          "understood",

        parsed:null,

        intent:"unknown"

      }
    );

  }


  function plan(
    task
  ){

    const parsed =
      task.parsed;


    let plan = {

      type:
        "unknown",

      action:
        null,

      args:
        {}

    };


    if(
      parsed &&
      parsed.type ===
      "safe"
    ){

      plan = {

        type:
          "action",

        action:
          parsed.action,

        args:
                  parsed.args || {},
        risk: actions[parsed.intent].risk
      };
    }

    if (parsed.intent === "confirmation_required") {
      return {
        type: "confirmation",
        reason: "This action can have a real-world consequence."
      };
    }

    // Device commands are intentionally not faked in the browser.
    return {
      type: "device_agent_required",
      command: parsed.text
    };
  }

  function execute(planResult) {
    if (planResult.type === "noop") {
      return {
        ok: true,
        message: ""
      };
    }

    if (planResult.type === "confirmation") {
      return {
        ok: false,
        requiresConfirmation: true,
        message: "Confirmation is required before I execute that."
      };
    }

    if (planResult.type === "device_agent_required") {
      return {
        ok: false,
        requiresAgent: true,
        message: "That requires the NOA Device Agent."
      };
    }

    const action = actions[planResult.action];

    if (!action) {
      return {
        ok: false,
        message: "I don't have an action for that yet."
      };
    }

    setState("THINKING");

    const args = planResult.args || {};
    const result = action.run(...Object.values(args));

    setState("SPEAKING");

    setTimeout(() => {
      setState("IDLE");
    }, 900);

    return {
      ok: true,
      message: result
    };
  }

  function command(input) {
    const parsed = understand(input);

    remember({
      input,
      intent: parsed.intent
    });

    const planResult = plan(parsed);
    const result = execute(planResult);

    return {
      parsed,
      plan: planResult,
      result
    };
  }

  return {
    command,
    understand,
    getMemory: () => [...memory.session],
    setGoal: goal => {
      memory.activeGoal = goal;
    },
    getGoal: () => memory.activeGoal,
    permissions
  };
})();

window.NOA = window.NOA || {};
window.NOA.command = input => NOACore.command(input);
window.NOA.brain = NOACore;


// ============================================================
// NOA TASK ENGINE v1
// Headless agent lifecycle:
// perceive -> understand -> plan ->
// permission -> execute -> verify -> respond.
// ============================================================

const NOATaskEngine = (() => {

  const tasks = new Map();
  let sequence = 0;

  const risk = {
    LOW: "LOW",
    MEDIUM: "MEDIUM",
    HIGH: "HIGH"
  };

  function create(input) {

    const id = `task_${++sequence}`;

    const task = {
      id,
      input: String(input || ""),
      status: "received",
      risk: risk.LOW,
      plan: [],
      result: null,
      createdAt: Date.now()
    };

    tasks.set(id, task);

    return task;
  }

  function update(task, patch) {

    Object.assign(task, patch);

    tasks.set(task.id, task);

    return task;
  }

  function perceive(task) {

    return update(task, {

      status: "perceived",

      context: {
        screen: "NOA orb",
        state: document.body.dataset.state || "idle",
        time: new Date().toISOString()
      }

    });
  }

  function understand(task) {

    const parsed = NOACore.understand(task.input);

    return update(task, {

      status: "understood",
      intent: parsed.intent,
      parsed

    });
  }

  function plan(task) {

    const plan = NOACore.command(task.input).plan;

    let taskRisk = risk.LOW;

    if (plan.type === "confirmation") {
      taskRisk = risk.HIGH;
    }

    else if (plan.type === "device_agent_required") {
      taskRisk = risk.MEDIUM;
    }

    else if (plan.action === "open_url") {
      taskRisk = risk.MEDIUM;
    }

    return update(task, {

      status: "planned",
      plan,
      risk: taskRisk

    });
  }

  function permission(task) {

    if (task.risk === risk.HIGH) {

      return update(task, {

        status: "waiting_for_confirmation",
        permission: "confirmation_required"

      });
    }

    if (
      task.risk === risk.MEDIUM &&
      task.plan.type === "device_agent_required"
    ) {

      return update(task, {

        status: "waiting_for_agent",
        permission: "device_agent_required"

      });
    }

    return update(task, {

      status: "authorized",
      permission: "allowed"

    });
  }

  function execute(task) {

    if (task.status !== "authorized") {
      return task;
    }

    setState("EXECUTING");

    let result;

    if (task.plan.type === "action") {

      const action = task.plan.action;
      const args = task.plan.args || {};

      const actionMap = {

        zoom_in: () => {

          zoom = Math.min(
            MAX_ZOOM,
            zoom + 0.15
          );

          applyOrbZoom();

          return "Zoomed in.";
        },

        zoom_out: () => {

          zoom = Math.max(
            MIN_ZOOM,
            zoom - 0.15
          );

          applyOrbZoom();

          return "Zoomed out.";
        },

        reset_zoom: () => {

          zoom = 1;

          applyOrbZoom();

          return "Zoom reset.";
        },

        status: () => {
          return `NOA is ${state.textContent.toLowerCase()}.`;
        },

        open_url: () => {

          const w = window.open(
            args.url,
            "_blank",
            "noopener,noreferrer"
          );

          return w
            ? `Opened ${args.url}`
            : "The browser blocked the new tab.";
        }

      };

      result = actionMap[action]
        ? actionMap[action]()
        : "Action is not implemented yet.";

    }

    else {

      result = "No executable action is available.";

    }

    return update(task, {

      status: "executed",
      result

    });
  }

  function verify(task) {

    let verified = false;

    if (task.status === "executed") {

      if (
        task.plan.action === "zoom_in" ||
        task.plan.action === "zoom_out" ||
        task.plan.action === "reset_zoom"
      ) {

        verified = true;

      }

      else if (task.plan.action === "status") {

        verified = true;

      }

      else if (task.plan.action === "open_url") {

        // Browser APIs don't expose reliable
        // cross-window verification.
        verified =
          task.result !==
          "The browser blocked the new tab.";

      }

    }

    return update(task, {

      status:
        verified
          ? "verified"
          : "completed_with_limit",

      verified

    });
  }

  function respond(task) {

    const message =
      task.status === "waiting_for_confirmation"
        ? "Confirmation required."
        : task.status === "waiting_for_agent"
        ? "The NOA Device Agent is required for this action."
        : task.result || "Task completed.";

    setState("SPEAKING");

    if (
      "speechSynthesis" in window &&
      message
    ) {

      window.speechSynthesis.cancel();

      window.speechSynthesis.speak(
        new SpeechSynthesisUtterance(message)
      );

    }

    setTimeout(() => {
      setState("IDLE");
    }, 900);

    return update(task, {

      status:
        task.status === "verified"
          ? "responded"
          : task.status,

      response: message

    });
  }

  function run(input) {

    const task = create(input);

    perceive(task);
    understand(task);
    plan(task);
    permission(task);

    if (task.status === "authorized") {

      execute(task);
      verify(task);

    }

    return respond(task);
  }

  return {

    run,

    get: id =>
      tasks.get(id) || null,

    list: () =>
      [...tasks.values()]

  };

})();

window.NOA = window.NOA || {};

window.NOA.runTask =
  input => NOATaskEngine.run(input);

window.NOA.tasks =
  NOATaskEngine;
