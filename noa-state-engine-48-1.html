<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#000000">

<title>NOA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

body{
  font-family:Inter,Arial,sans-serif;
  color:#4fa3ff;
  touch-action:manipulation;
}

button,input{
  font-family:inherit;
}

#app{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ================================
   ORB
================================ */

#orb{
  position:relative;
  width:280px;
  height:280px;
  flex:0 0 280px;

  transform:none !important;
  transform-origin:center center;

  user-select:none;
  -webkit-user-select:none;
  will-change:auto;

  cursor:default;
}

#orbGlow{
  position:absolute;
  inset:-55px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(30,110,255,.34),
      rgba(20,80,220,.10) 42%,
      transparent 72%
    );

  filter:blur(18px);

  animation:breathe 4.5s ease-in-out infinite;

  pointer-events:none;
}

@keyframes breathe{
  0%,100%{
    opacity:.68;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.05);
  }
}

/* ================================
   SVG
================================ */

#orb svg{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  overflow:visible;
  pointer-events:none;
}

.r1{
  animation:r1 22s linear infinite;
  transform-origin:140px 140px;
}

.r2{
  animation:r2 17s linear infinite;
  transform-origin:140px 140px;
}

.r3{
  animation:r3 13s linear infinite;
  transform-origin:140px 140px;
}

.r4{
  animation:r1 27s linear infinite;
  transform-origin:140px 140px;
}

@keyframes r1{
  to{
    transform:rotate(360deg);
  }
}

@keyframes r2{
  from{
    transform:rotate(360deg);
  }

  to{
    transform:rotate(0deg);
  }
}

@keyframes r3{
  to{
    transform:rotate(-360deg);
  }
}

/* ================================
   CENTER
================================ */

#center{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

#wave{
  position:absolute;

  left:50%;
  top:50%;

  width:150px;
  height:34px;

  transform:translate(-50%,-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:3px;

  opacity:0;
  transition:opacity .15s ease;
}

#wave i{
  display:block;

  width:2px;

  border-radius:4px;

  background:#4fa3ff;

  box-shadow:
    0 0 6px rgba(79,163,255,.75),
    0 0 12px rgba(79,163,255,.25);

  animation:
    wave 1s ease-in-out infinite alternate;

  transform-origin:center;
}

@keyframes wave{
  from{
    transform:scaleY(.25);
    opacity:.32;
  }

  to{
    transform:scaleY(1);
    opacity:1;
  }
}

#state{
  position:absolute;

  left:50%;
  top:calc(50% + 27px);

  transform:translateX(-50%);

  font-size:10px;
  line-height:1;

  letter-spacing:3px;

  text-transform:uppercase;
  white-space:nowrap;

  color:#4fa3ff;

  text-shadow:
    0 0 8px rgba(79,163,255,.75),
    0 0 18px rgba(79,163,255,.25);
}

#spokenText{
  position:absolute;

  left:50%;
  top:calc(50% + 48px);

  transform:translateX(-50%);

  width:205px;

  text-align:center;

  color:#4fa3ff;

  font-size:11px;
  line-height:1.45;
  letter-spacing:.4px;

  text-shadow:
    0 0 7px rgba(79,163,255,.85),
    0 0 14px rgba(79,163,255,.45);

  opacity:0;

  transition:opacity .15s ease;

  z-index:10;
}

body[data-state="speaking"] #state{
  opacity:0;
}

body[data-state="speaking"] #spokenText{
  opacity:1;
}

body[data-state="listening"] #wave,
body[data-state="thinking"] #wave,
body[data-state="executing"] #wave,
body[data-state="speaking"] #wave{
  opacity:1;
}

body[data-state="listening"] #orbGlow{
  animation:breathe 1.15s ease-in-out infinite;
}

body[data-state="thinking"] #orbGlow{
  animation:breathe 1.6s ease-in-out infinite;
}

body[data-state="executing"] #orbGlow{
  animation:breathe .7s ease-in-out infinite;
}

body[data-state="listening"] #wave i{
  animation-duration:.28s;
}

body[data-state="thinking"] #wave i{
  animation-duration:.5s;
}

body[data-state="speaking"] #wave i{
  animation-duration:.42s;
}

body[data-state="executing"] #wave i{
  animation-duration:.22s;
}

body[data-state="complete"] #orbGlow{
  animation:pulse .7s ease-out 1;
}

@keyframes pulse{
  50%{
    transform:scale(1.2);
    opacity:1;
  }
}

/* ================================
   MIC
================================ */

#mic{
  position:fixed;

  right:28px;
  bottom:28px;

  width:48px;
  height:48px;

  border-radius:50%;

  z-index:30;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #4fa3ff;

  background:rgba(79,163,255,.12);

  color:#4fa3ff;

  box-shadow:
    0 0 22px rgba(79,163,255,.25),
    inset 0 0 10px rgba(79,163,255,.08);

  font-size:18px;

  user-select:none;
  touch-action:none;

  cursor:grab;

  padding:0;

  transition:
    border-color .2s ease,
    color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

#mic.dragging{
  cursor:grabbing;
}

#mic.on{
  border-color:#35e887;

  color:#35e887;

  background:rgba(53,232,135,.16);

  box-shadow:
    0 0 30px rgba(53,232,135,.48),
    0 0 55px rgba(53,232,135,.16),
    inset 0 0 12px rgba(53,232,135,.12);
}

/* ================================
   CHAT
================================ */

#chatOverlay{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.58);

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  opacity:0;
  pointer-events:none;

  transition:opacity .2s ease;
}

#chatOverlay.open{
  opacity:1;
  pointer-events:auto;
}

#chatBox{
  width:min(430px,92vw);
  height:min(650px,80vh);

  display:flex;
  flex-direction:column;

  border:1px solid rgba(79,163,255,.45);

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      rgba(5,13,28,.98),
      rgba(1,5,12,.98)
    );

  box-shadow:
    0 0 45px rgba(25,105,220,.22),
    inset 0 0 30px rgba(79,163,255,.035);

  overflow:hidden;

  transform:scale(.94);

  transition:transform .2s ease;
}

#chatOverlay.open #chatBox{
  transform:scale(1);
}

#chatHeader{
  height:54px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px 0 18px;

  border-bottom:
    1px solid rgba(120,180,255,.13);
}

#chatTitle{
  color:#7dbdff;

  font-size:11px;

  letter-spacing:3px;

  text-transform:uppercase;
}

#chatActions{
  display:flex;
  gap:7px;
}

.chatAction{
  width:34px;
  height:34px;

  border:1px solid rgba(79,163,255,.25);

  border-radius:9px;

  background:rgba(79,163,255,.07);

  color:#9dccff;

  cursor:pointer;

  font-size:15px;

  padding:0;
}

#chatHistory{
  flex:1;

  overflow-y:auto;
  overflow-x:hidden;

  padding:14px;

  display:flex;
  flex-direction:column;

  gap:10px;

  scrollbar-width:thin;
}

.message{
  max-width:88%;

  padding:10px 12px;

  border-radius:13px;

  font-size:13px;
  line-height:1.5;

  white-space:pre-wrap;
  word-break:break-word;
}

.message.user{
  align-self:flex-end;

  color:#dff0ff;

  background:rgba(79,163,255,.12);

  border:1px solid rgba(79,163,255,.22);

  border-bottom-right-radius:4px;
}

.message.noa{
  align-self:flex-start;

  color:#dcecff;

  background:rgba(8,18,35,.9);

  border:1px solid rgba(79,163,255,.17);

  border-bottom-left-radius:4px;

  box-shadow:
    0 0 15px rgba(25,105,220,.08);
}

.messageLabel{
  display:block;

  margin-bottom:4px;

  font-size:8px;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#6dafff;

  opacity:.7;
}

#chatHint{
  padding:0 12px 9px;

  color:#50708f;

  font-size:9px;

  text-align:center;
}

#chatInputArea{
  display:flex;

  gap:7px;

  padding:10px;

  border-top:
    1px solid rgba(120,180,255,.13);
}

#chatInput{
  flex:1;
  min-width:0;

  height:42px;

  border:1px solid rgba(79,163,255,.22);

  border-radius:11px;

  outline:none;

  background:rgba(79,163,255,.05);

  color:#dcecff;

  padding:0 12px;

  font-size:13px;
}

#chatInput::placeholder{
  color:#6684a5;
}

#sendChat{
  width:44px;
  height:42px;

  border:1px solid rgba(79,163,255,.35);

  border-radius:11px;

  background:rgba(79,163,255,.10);

  color:#8fc8ff;

  cursor:pointer;

  font-size:17px;

  padding:0;
}

/* ================================
   MOBILE
================================ */

@media(max-width:500px){

  #orb{
    width:280px;
    height:280px;
    flex-basis:280px;
  }

  #mic{
    right:20px;
    bottom:20px;
  }

  #spokenText{
    width:185px;
  }

  #chatBox{
    width:92vw;
    height:78vh;
    border-radius:18px;
  }
}

/*
   IMPORTANT:
   Do NOT shrink orb based on viewport height.
   The old small-height rule was one reason
   the visual reference kept changing.
*/

@media(max-height:600px){

  #orb{
    width:250px;
    height:250px;
    flex-basis:250px;
  }
}
</style>
</head>

<body data-state="idle">

<div id="app">

  <div id="orb">

    <div id="orbGlow"></div>

    <svg viewBox="0 0 280 280" aria-hidden="true">

      <defs>

        <filter
          id="glow"
          x="-80%"
          y="-80%"
          width="260%"
          height="260%">

          <feGaussianBlur
            stdDeviation="5"
            result="blur"/>

          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>

        </filter>

          <stop offset="0" stop-color="#020409"/>

        <linearGradient id="a">
          <stop
            stop-color="#bfe0ff"
            stop-opacity="0"/>

          <stop
            offset=".5"
            stop-color="#4fa3ff"/>

          <stop
            offset="1"
            stop-color="#bfe0ff"
            stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="b">
          <stop
            stop-color="#dff0ff"
            stop-opacity="0"/>

          <stop
            offset=".5"

            stop-color="#dff0ff"

            stroke-linecap="round"/>
        </g>

        <!-- DOTTED HORIZONTAL -->

        <g class="r3">

          <ellipse
            cx="140"

          <ellipse
            cx="140"

      <g filter="url(#soft)">

        <circle

        <circle

          r="1.6"
          fill="#cfe8ff"/>

        <circle
          cx="253"

          r="1.8"
          fill="#eaf6ff"/>

        <circle
          cx="136"
          cy="249"
          r="2"
          fill="#cfe8ff"/>

        <circle
          cx="32"
          cy="175"
          r="1.6"

        <circle
          cx="35"

          r="1.8"

      </g>

    </svg>

    <div id="center">

</div>


<button
  id="mic"
  aria-label="Microphone"
  aria-pressed="false">
  🎙
</button>


<!-- ================================
     CHAT
================================ -->

<div id="chatOverlay">

  <div id="chatBox">

    <div id="chatHeader">

      <div id="chatTitle">
        NOA // CHAT
      </div>

      <div id="chatActions">

        <button
          class="chatAction"
          id="clearChat"
          title="Clear history">
          ⌫
        </button>

        <button
          class="chatAction"
          id="closeChat"
          title="Close">
          ×
        </button>

      Double-tap the orb to open chat
    </div>

      <input
        id="chatInput"
        type="text"
        autocomplete="off"
        placeholder="Talk to NOA..."/>

        ➤
      </button>

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const body =
  document.body;

const orb =
  document.getElementById("orb");

const wave =
  document.getElementById("wave");

const state =
  document.getElementById("state");

const spokenText =
  document.getElementById("spokenText");

const mic =
  document.getElementById("mic");

const chatOverlay =
  document.getElementById("chatOverlay");

const chatHistory =
  document.getElementById("chatHistory");

const chatInput =
  document.getElementById("chatInput");

const sendChat =
  document.getElementById("sendChat");

const closeChat =
  document.getElementById("closeChat");

const clearChat =
  document.getElementById("clearChat");


/* =========================================================
   WORKER
========================================================= */

const NOA_WORKER =
  "https://noa-brain-a78d.ajaiacharya7274.workers.dev/api/chat";


/* =========================================================
   STATE
========================================================= */

function setState(value){

  const next =
    String(value || "IDLE")
      .toUpperCase();

  body.dataset.state =
    next.toLowerCase();

  state.textContent =
    next;
}

window.NOA = {

  setState,

  getState(){
    return state.textContent;
  },

  ask
};


/* =========================================================
   WAVEFORM
========================================================= */

[
  5,8,12,18,11,23,16,29,19,
  24,14,9,6,10,16,22,15,20,
  27,17,10,14,20,25,15,9,5
].forEach(
  (height,index)=>{

    const bar =
      document.createElement("i");

    bar.style.height =
      height + "px";

    bar.style.animationDelay =
      (index * .04) + "s";

    wave.appendChild(bar);

  }
);


/* =========================================================
   CHAT STORAGE
========================================================= */

const STORAGE_KEY =
  "NOA_CHAT_HISTORY_V1";

let history = [];

try{

  const stored =
    localStorage.getItem(
      STORAGE_KEY
    );

  history =
    stored
      ? JSON.parse(stored)
      : [];

  if(!Array.isArray(history)){
    history = [];
  }

}catch(error){

  console.warn(
    "History load failed",
    error
  );

  history = [];
}


function saveHistory(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );

  }catch(error){

    console.warn(
      "History save failed",
      error
    );

  }
}


function renderHistory(){

  chatHistory.innerHTML = "";

  history.forEach(item=>{

    const bubble =
      document.createElement("div");

    bubble.className =
      "message " +
      (
        item.role === "user"
          ? "user"
          : "noa"
      );

    const label =
      document.createElement("span");

    label.className =
      "messageLabel";

    label.textContent =
      item.role === "user"
        ? "YOU"
        : "NOA";

    const content =
      document.createElement("span");

    content.textContent =
      item.text;

    bubble.appendChild(label);
    bubble.appendChild(content);

    chatHistory.appendChild(bubble);

  });

  chatHistory.scrollTop =
    chatHistory.scrollHeight;
}


function addHistory(role,text){

  history.push({

    role,

    text:String(text)

  });

  if(history.length > 100){

    history =
      history.slice(
        -100
      );

  }

  saveHistory();

  renderHistory();
}


function addMessage(role,text){

  addHistory(
    role,
    text
  );
}


/* =========================================================
   CHAT OPEN / CLOSE
========================================================= */

function openChat(){

  chatOverlay.classList.add("open");

  renderHistory();

  setTimeout(
    ()=>{
      chatInput.focus();
    },
    150
  );
}


function closeChatPopup(){

  chatOverlay.classList.remove("open");

}


closeChat.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    closeChatPopup();

  }
);


chatOverlay.addEventListener(
  "click",
  event=>{

    if(event.target === chatOverlay){

      closeChatPopup();

    }

  }
);


clearChat.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    if(!history.length){
      return;
    }

    if(
      !confirm(
        "Clear NOA chat history?"
      )
    ){
      return;
    }

    history = [];

    saveHistory();

    renderHistory();

  }
);


/* =========================================================
   DOUBLE TAP ORB
========================================================= */

let lastOrbTap =
  0;

orb.addEventListener(
  "click",
  ()=>{

    const now =
      Date.now();

    if(
      now - lastOrbTap <
      380
    ){

      openChat();

    }

    lastOrbTap =
      now;

  }
);


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition =
  null;

let listening =
  false;

let manualStop =
  false;


function setMicVisual(on){

  mic.classList.toggle(
    "on",
    Boolean(on)
  );

  mic.setAttribute(
    "aria-pressed",
    String(Boolean(on))
  );

}


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    ()=>{

      listening = true;

      setMicVisual(true);

      setState(
        "LISTENING"
      );

    };


  recognition.onresult =
    event=>{

      let finalText =
        "";

      let interimText =
        "";

      for(
        let i =
          event.resultIndex;

        i <
        event.results.length;

        i++
      ){

        const transcript =
          event.results[i][0]
            .transcript;

        if(
          event.results[i].isFinal
        ){

          finalText +=
            transcript;

        }else{

          interimText +=
            transcript;

        }

      }

      const visibleText =
        (
          finalText ||
          interimText
        ).trim();

      if(visibleText){

        spokenText.textContent =
          visibleText;

      }

      if(finalText.trim()){

        const text =
          finalText.trim();

        setState(
          "THINKING"
        );

        spokenText.textContent =
          "";

        ask(text);

      }

    };


  recognition.onerror =
    event=>{

      console.warn(
        "Speech recognition:",
        event.error
      );

      listening = false;

      setMicVisual(false);

      spokenText.textContent =
        "";

      if(
        event.error ===
        "not-allowed"
      ){

        setState(
          "IDLE"
        );

      }else{

        setState(
          "IDLE"
        );

      }

    };


  recognition.onend =
    ()=>{

      listening = false;

      setMicVisual(false);

      if(
        body.dataset.state ===
        "listening"
      ){

        setState(
          "IDLE"
        );

      }

    };

}else{

  console.warn(
    "SpeechRecognition is not supported."
  );

}


/* =========================================================
   MIC CLICK + DRAG
========================================================= */

let micPointer =
  null;

let micMoved =
  false;


mic.addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();

    mic.setPointerCapture(
      event.pointerId
    );

    micPointer = {

      id:event.pointerId,

      startX:event.clientX,
      startY:event.clientY,

      lastX:event.clientX,
      lastY:event.clientY,

      right:
        parseFloat(
          getComputedStyle(
            mic
          ).right
        ) || 28,

      bottom:
        parseFloat(
          getComputedStyle(
            mic
          ).bottom
        ) || 28

    };

    micMoved = false;

  }
);


mic.addEventListener(
  "pointermove",
  event=>{

    if(
      !micPointer ||
      event.pointerId !==
      micPointer.id
    ){
      return;
    }

    const dx =
      event.clientX -
      micPointer.startX;

    const dy =
      event.clientY -
      micPointer.startY;

    if(
      Math.hypot(dx,dy) >
      8
    ){

      micMoved = true;

      mic.classList.add(
        "dragging"
      );

      const newRight =
        Math.max(
          8,
          Math.min(
            window.innerWidth -
            mic.offsetWidth -
            8,

            micPointer.right -
            dx
          )
        );

      const newBottom =
        Math.max(
          8,
          Math.min(
            window.innerHeight -
            mic.offsetHeight -
            8,

            micPointer.bottom -
            dy
          )
        );

      mic.style.right =
        newRight + "px";

      mic.style.bottom =
        newBottom + "px";

    }

  }
);


mic.addEventListener(
  "pointerup",
  event=>{

    if(
      !micPointer ||
      event.pointerId !==
      micPointer.id
    ){
      return;
    }

    mic.releasePointerCapture(
      event.pointerId
    );

    mic.classList.remove(
      "dragging"
    );

    const wasMoved =
      micMoved;

    micPointer =
      null;

    micMoved =
      false;

    if(wasMoved){
      return;
    }

    toggleListening();

  }
);


mic.addEventListener(
  "pointercancel",
  ()=>{
    micPointer =
      null;

    micMoved =
      false;

    mic.classList.remove(
      "dragging"
    );
  }
);


/* =========================================================
   MIC TOGGLE
========================================================= */

function toggleListening(){

  if(!recognition){

    alert(
      "Speech recognition is not supported in this browser."
    );

    return;

  }

  if(listening){

    manualStop = true;

    try{
      recognition.stop();
    }catch(error){}

    listening = false;

    setMicVisual(false);

    setState(
      "IDLE"
    );

    return;

  }

  manualStop = false;

  spokenText.textContent =
    "";

  try{

    recognition.start();

  }catch(error){

    console.warn(
      "Recognition start failed:",
      error
    );

  }

}


/* =========================================================
   CHAT REQUEST
========================================================= */

async function ask(text){

  const message =
    String(text || "")
      .trim();

  if(!message){
    return;
  }

  addHistory(
    "user",
    message
  );

  setState(
    "THINKING"
  );

  try{

    const response =
      await fetch(
        NOA_WORKER,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:message,

            history:
              history.slice(
                -20
              ).map(
                item=>({
                  role:
                    item.role === "user"
                      ? "user"
                      : "assistant",

                  content:
                    item.text
                })
              )

          })
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    const reply =
      extractReply(data);

    if(!reply){

      throw new Error(
        "Empty NOA response"
      );

    }

    addHistory(
      "noa",
      reply
    );

    speakReply(
      reply
    );

  }catch(error){

    console.error(
      "NOA request failed:",
      error
    );

    const fallback =
      "NOA connection error. Please try again.";

    addHistory(
      "noa",
      fallback
    );

    setState(
      "IDLE"
    );

  }

}


/* =========================================================
   RESPONSE PARSER
========================================================= */

function extractReply(data){

  if(!data){
    return "";
  }

  if(typeof data === "string"){
    return data.trim();
  }

  const candidates = [

    data.reply,

    data.response,

    data.message,

    data.text,

    data.content,

    data.answer,

    data.output,

    data.result

  ];

  for(
    const value of candidates
  ){

    if(
      typeof value ===
      "string" &&
      value.trim()
    ){

      return value.trim();

    }

  }

  if(
    data.choices &&
    Array.isArray(data.choices) &&
    data.choices[0]
  ){

    const choice =
      data.choices[0];

    if(
      choice.message &&
      typeof choice.message.content ===
      "string"
    ){

      return choice.message.content.trim();

    }

    if(
      typeof choice.text ===
      "string"
    ){

      return choice.text.trim();

    }

  }

  return "";

}


/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

function speakReply(text){

  if(
    !("speechSynthesis" in window)
  ){

    setState(
      "COMPLETE"
    );

    setTimeout(
      ()=>{
        setState("IDLE");
      },
      700
    );

    return;

  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  utterance.lang =
    "en-IN";

  utterance.rate =
    .96;

  utterance.pitch =
    1;

  utterance.volume =
    1;

  utterance.onstart =
    ()=>{

      setState(
        "SPEAKING"
      );

      spokenText.textContent =
        text;

    };

  utterance.onend =
    ()=>{

      spokenText.textContent =
        "";

      setState(
        "COMPLETE"
      );

      setTimeout(
        ()=>{
          setState("IDLE");
        },
        650
      );

    };

  utterance.onerror =
    ()=>{

      spokenText.textContent =
        "";

      setState(
        "IDLE"
      );

    };

  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   CHAT SEND
========================================================= */

async function sendCurrentMessage(){

  const text =
    chatInput.value.trim();

  if(!text){
    return;
  }

  chatInput.value =
    "";

  await ask(text);

}


sendChat.addEventListener(
  "click",
  sendCurrentMessage
);


chatInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      sendCurrentMessage();

    }

  }
);


/* =========================================================
   INITIAL
========================================================= */

renderHistory();

setState(
  "IDLE"
);

console.log(
  "NOA loaded successfully"
);
