<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#000000">

<title>NOA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

body{
  font-family:Inter,Arial,sans-serif;
  color:#4fa3ff;
  touch-action:none;
}

button,
input{
  font-family:inherit;
}

/* =========================================================
   APP
========================================================= */

#app{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* =========================================================
   ORB
========================================================= */

#orb{
  position:relative;

  width:280px;
  height:280px;

  transform-origin:center center;

  user-select:none;
  -webkit-user-select:none;

  cursor:grab;

  will-change:transform;
}

#orb:active{
  cursor:grabbing;
}

#orbGlow{
  position:absolute;

  inset:-65px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(30,110,255,.36),
      rgba(20,80,220,.12) 42%,
      transparent 72%
    );

  filter:blur(20px);

  animation:breathe 4.5s ease-in-out infinite;

  pointer-events:none;
}

@keyframes breathe{
  0%,100%{
    opacity:.68;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.06);
  }
}

/* =========================================================
   SVG ORB
========================================================= */

#orb svg{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  overflow:visible;

  pointer-events:none;
}

.r1{
  animation:r1 22s linear infinite;
  transform-origin:140px 140px;
}

.r2{
  animation:r2 17s linear infinite;
  transform-origin:140px 140px;
}

.r3{
  animation:r3 13s linear infinite;
  transform-origin:140px 140px;
}

.r4{
  animation:r1 27s linear infinite;
  transform-origin:140px 140px;
}

@keyframes r1{
  to{
    transform:rotate(360deg);
  }
}

@keyframes r2{
  from{
    transform:rotate(360deg);
  }

  to{
    transform:rotate(0deg);
  }
}

@keyframes r3{
  to{
    transform:rotate(-360deg);
  }
}

/* =========================================================
   CENTER
========================================================= */

#center{
  position:absolute;

  inset:0;

  z-index:5;

  pointer-events:none;
}

/* =========================================================
   WAVE
========================================================= */

#wave{
  position:absolute;

  left:50%;
  top:50%;

  width:150px;
  height:34px;

  transform:translate(-50%,-50%);

  display:flex;

  align-items:center;
  justify-content:center;

  gap:3px;
}

#wave i{
  display:block;

  width:2px;

  border-radius:4px;

  background:#4fa3ff;

  box-shadow:
    0 0 6px rgba(79,163,255,.75),
    0 0 12px rgba(79,163,255,.25);

  animation:
    wave 1s ease-in-out infinite alternate;

  transform-origin:center;
}

@keyframes wave{
  from{
    transform:scaleY(.25);
    opacity:.32;
  }

  to{
    transform:scaleY(1);
    opacity:1;
  }
}

/* =========================================================
   STATE
========================================================= */

#state{
  position:absolute;

  left:50%;
  top:calc(50% + 27px);

  transform:translateX(-50%);

  font-size:10px;

  line-height:1;

  letter-spacing:3px;

  text-transform:uppercase;

  white-space:nowrap;

  color:#4fa3ff;

  text-shadow:
    0 0 8px rgba(79,163,255,.75),
    0 0 18px rgba(79,163,255,.25);

  transition:
    opacity .15s ease,
    color .2s ease;
}

/* =========================================================
   SPOKEN TEXT
========================================================= */

#spokenText{
  position:absolute;

  left:50%;
  top:calc(50% + 48px);

  transform:translateX(-50%);

  width:205px;

  text-align:center;

  color:#4fa3ff;

  font-size:11px;

  line-height:1.45;

  letter-spacing:.4px;

  text-shadow:
    0 0 7px rgba(79,163,255,.85),
    0 0 14px rgba(79,163,255,.45);

  opacity:0;

  transition:opacity .15s ease;

  z-index:10;
}

body[data-state="speaking"] #state{
  opacity:0;
}

body[data-state="speaking"] #spokenText{
  opacity:1;
}

/* =========================================================
   STATE ANIMATIONS
========================================================= */

body[data-state="thinking"] #orbGlow{
  animation:breathe 1.6s ease-in-out infinite;
}

body[data-state="listening"] #orbGlow{
  animation:breathe 1.15s ease-in-out infinite;
}

body[data-state="executing"] #orbGlow{
  animation:breathe .7s ease-in-out infinite;
}

body[data-state="speaking"] #wave i{
  animation-duration:.42s;
}

body[data-state="listening"] #wave i{
  animation-duration:.28s;
}

body[data-state="executing"] #wave i{
  animation-duration:.22s;
}

body[data-state="complete"] #orbGlow{
  animation:pulse .7s ease-out 1;
}

@keyframes pulse{
  50%{
    transform:scale(1.22);
    opacity:1;
  }
}

/* =========================================================
   MIC
========================================================= */

#mic{
  position:fixed;

  right:28px;
  bottom:28px;

  width:48px;
  height:48px;

  border-radius:50%;

  z-index:30;

  display:flex;

  align-items:center;
  justify-content:center;

  border:2px solid #4fa3ff;

  background:rgba(79,163,255,.12);

  color:#4fa3ff;

  box-shadow:
    0 0 22px rgba(79,163,255,.25),
    inset 0 0 10px rgba(79,163,255,.08);

  font-size:18px;

  user-select:none;

  touch-action:none;

  cursor:grab;

  transition:
    border-color .2s ease,
    color .2s ease,
    background .2s ease,
    box-shadow .2s ease;

  padding:0;
}

#mic.dragging{
  cursor:grabbing;
}

#mic.on{
  border-color:#35e887;

  color:#35e887;

  background:rgba(53,232,135,.16);

  box-shadow:
    0 0 30px rgba(53,232,135,.48),
    0 0 55px rgba(53,232,135,.16),
    inset 0 0 12px rgba(53,232,135,.12);
}

/* =========================================================
   CHAT OVERLAY
========================================================= */

#chatOverlay{
  position:fixed;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.58);

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  opacity:0;

  pointer-events:none;

  transition:opacity .2s ease;
}

#chatOverlay.open{
  opacity:1;

  pointer-events:auto;
}

/* =========================================================
   CHAT BOX
========================================================= */

#chatBox{
  width:min(430px,92vw);

  height:min(650px,80vh);

  display:flex;

  flex-direction:column;

  border:
    1px solid rgba(79,163,255,.45);

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      rgba(5,13,28,.98),
      rgba(1,5,12,.98)
    );

  box-shadow:
    0 0 45px rgba(25,105,220,.22),
    inset 0 0 30px rgba(79,163,255,.035);

  overflow:hidden;

  transform:scale(.94);

  transition:transform .2s ease;
}

#chatOverlay.open #chatBox{
  transform:scale(1);
}

/* =========================================================
   CHAT HEADER
========================================================= */

#chatHeader{
  height:54px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    0 12px 0 18px;

  border-bottom:
    1px solid rgba(120,180,255,.13);
}

#chatTitle{
  color:#7dbdff;

  font-size:11px;

  letter-spacing:3px;

  text-transform:uppercase;
}

#chatActions{
  display:flex;

  gap:7px;
}

.chatAction{
  width:34px;
  height:34px;

  border:
    1px solid rgba(79,163,255,.25);

  border-radius:9px;

  background:
    rgba(79,163,255,.07);

  color:#9dccff;

  cursor:pointer;

  font-size:15px;

  padding:0;

  font-weight:700;
}

/* =========================================================
   CHAT HISTORY
========================================================= */

#chatHistory{
  flex:1;

  overflow-y:auto;

  overflow-x:hidden;

  padding:14px;

  display:flex;

  flex-direction:column;

  gap:10px;

  scrollbar-width:thin;

  scrollbar-color:
    rgba(79,163,255,.35)
    transparent;
}

.message{
  max-width:88%;

  padding:10px 12px;

  border-radius:13px;

  font-size:13px;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;
}

.message.user{
  align-self:flex-end;

  color:#dff0ff;

  background:
    rgba(79,163,255,.12);

  border:
    1px solid rgba(79,163,255,.22);

  border-bottom-right-radius:4px;
}

.message.noa{
  align-self:flex-start;

  color:#dcecff;

  background:
    rgba(8,18,35,.9);

  border:
    1px solid rgba(79,163,255,.17);

  border-bottom-left-radius:4px;

  box-shadow:
    0 0 15px rgba(25,105,220,.08);
}

.messageLabel{
  display:block;

  margin-bottom:4px;

  font-size:8px;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#6dafff;

  opacity:.7;
}

/* =========================================================
   CHAT INPUT
========================================================= */

#chatInputArea{
  display:flex;

  gap:7px;

  padding:10px;

  border-top:
    1px solid rgba(120,180,255,.13);
}

#chatInput{
  flex:1;

  min-width:0;

  height:42px;

  border:
    1px solid rgba(79,163,255,.22);

  border-radius:11px;

  outline:none;

  background:
    rgba(79,163,255,.05);

  color:#dcecff;

  padding:
    0 12px;

  font-size:13px;
}

#chatInput::placeholder{
  color:#6684a5;
}

#sendChat{
  width:44px;
  height:42px;

  border:
    1px solid rgba(79,163,255,.35);

  border-radius:11px;

  background:
    rgba(79,163,255,.10);

  color:#8fc8ff;

  cursor:pointer;

  font-size:17px;

  padding:0;
}

/* =========================================================
   CHAT HINT
========================================================= */

#chatHint{
  padding:
    0 12px 9px;

  color:#50708f;

  font-size:9px;

  text-align:center;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

  #orb{
    width:280px;
    height:280px;
  }

  #mic{
    right:20px;
    bottom:20px;
  }

  #spokenText{
    width:185px;
  }

  #chatBox{
    width:92vw;
    height:78vh;
    border-radius:18px;
  }
}

/* =========================================================
   SMALL HEIGHT DEVICES
========================================================= */

@media(max-height:700px){

  #orb{
    width:250px;
    height:250px;
  }

  #mic{
    bottom:18px;
  }
}

    passive:false
  }
);
