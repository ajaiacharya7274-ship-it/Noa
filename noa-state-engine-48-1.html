<script>
const orb=document.getElementById('orb');
const mic=document.getElementById('mic');
const chatOverlay=document.getElementById('chatOverlay');
const chatInput=document.getElementById('chatInput');
const wave=document.getElementById('wave');
const state=document.getElementById('state');

let zoom=1;
const MIN_ZOOM=0.5;
const MAX_ZOOM=2.5;

[
  5,8,12,18,11,23,16,29,19,24,14,9,6,
  10,16,22,15,20,27,17,10,14,20,25,15,9,5
].forEach((h,i)=>{
  const bar=document.createElement('i');
  bar.style.height=h+'px';
  bar.style.animationDelay=(i*0.04)+'s';
  wave.appendChild(bar);
});

/* =========================
   ORB ZOOM
========================= */

orb.addEventListener('wheel',(e)=>{
  e.preventDefault();

  zoom += e.deltaY < 0 ? 0.1 : -0.1;

  zoom=Math.max(
    MIN_ZOOM,
    Math.min(MAX_ZOOM,zoom)
  );

  orb.style.transform=`scale(${zoom})`;
},{passive:false});


/* =========================
   MOBILE PINCH ZOOM
========================= */

let pinchStart=0;
let pinchZoom=1;

orb.addEventListener('touchstart',(e)=>{
  if(e.touches.length!==2)return;

  const dx=
    e.touches[0].clientX-
    e.touches[1].clientX;

  const dy=
    e.touches[0].clientY-
    e.touches[1].clientY;

  pinchStart=Math.hypot(dx,dy);
  pinchZoom=zoom;
},{passive:true});


orb.addEventListener('touchmove',(e)=>{
  if(e.touches.length!==2||!pinchStart)return;

  e.preventDefault();

  const dx=
    e.touches[0].clientX-
    e.touches[1].clientX;

  const dy=
    e.touches[0].clientY-
    e.touches[1].clientY;

  const dist=Math.hypot(dx,dy);

  zoom=
    pinchZoom*(dist/pinchStart);

  zoom=Math.max(
    MIN_ZOOM,
    Math.min(MAX_ZOOM,zoom)
  );

  orb.style.transform=`scale(${zoom})`;
},{passive:false});


orb.addEventListener('touchend',()=>{
  if(!event.touches || event.touches.length<2){
    pinchStart=0;
  }
});


/* =========================
   MIC BUTTON
   FIXED — NO DRAG
========================= */

let listening=false;

mic.addEventListener('click',()=>{
  listening=!listening;

  mic.classList.toggle(
    'on',
    listening
  );

  if(listening){
    state.textContent='LISTENING';
  }else{
    state.textContent='IDLE';
  }
});


/* =========================
   DOUBLE TAP ORB = CHAT
========================= */

let lastTap=0;

orb.addEventListener('click',()=>{
  const now=Date.now();

  if(now-lastTap<350){
    chatOverlay.classList.add('open');

    setTimeout(()=>{
      chatInput.focus();
    },100);
  }

  lastTap=now;
});


/* =========================
   CHAT
========================= */

const closeChat=
  document.getElementById('closeChat');

const clearChat=
  document.getElementById('clearChat');

const sendChat=
  document.getElementById('sendChat');

const chatHistory=
  document.getElementById('chatHistory');


closeChat.addEventListener('click',()=>{
  chatOverlay.classList.remove('open');
});


clearChat.addEventListener('click',()=>{
  chatHistory.innerHTML='';
});


sendChat.addEventListener('click',()=>{
  const msg=chatInput.value.trim();

  if(!msg)return;

  addMessage('user',msg);

  chatInput.value='';
});


chatInput.addEventListener('keydown',(e)=>{
  if(e.key==='Enter'){
    e.preventDefault();
    sendChat.click();
  }
});


function addMessage(role,text){

  const bubble=
    document.createElement('div');

  bubble.className=
    'message '+role;

  bubble.textContent=text;

  chatHistory.appendChild(
    bubble
  );

  chatHistory.scrollTop=
    chatHistory.scrollHeight;
}


console.log('NOA Loaded');
    </script>
