<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NOA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,Arial,sans-serif;color:#4fa3ff;touch-action:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#orbContainer{position:relative;width:280px;height:280px;perspective:1000px}
#orb{position:absolute;inset:0;width:100%;height:100%;user-select:none;cursor:grab;transform:scale(1)!important}
#orbGlow{position:absolute;inset:-55px;border-radius:50%;background:radial-gradient(circle,rgba(30,110,255,.34),rgba(20,80,220,.10) 42%,transparent 72%);filter:blur(18px);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
#orb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r1{animation:r1 22s linear infinite;transform-origin:140px 140px}
.r2{animation:r2 17s linear infinite;transform-origin:140px 140px}
.r3{animation:r3 13s linear infinite;transform-origin:140px 140px}
.r4{animation:r1 27s linear infinite;transform-origin:140px 140px}
@keyframes r1{to{transform:rotate(360deg)}}
@keyframes r2{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes r3{to{transform:rotate(-360deg)}}
#center{position:absolute;inset:0;z-index:5;pointer-events:none}
#wave{position:absolute;left:50%;top:50%;width:150px;height:30px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:3px}
#wave i{display:block;width:2px;border-radius:3px;background:#4fa3ff;box-shadow:0 0 7px rgba(79,163,255,.7);animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{from{transform:scaleY(.28);opacity:.38}to{transform:scaleY(1);opacity:1}}
#state{position:absolute;left:50%;top:calc(50% + 27px);transform:translateX(-50%);font-size:10px;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 10px rgba(79,163,255,.75)}
#mic{position:fixed;right:28px;bottom:28px;width:48px;height:48px;border-radius:50%;z-index:30;display:flex;align-items:center;justify-content:center;border:3px solid #4fa3ff;background:rgba(79,163,255,.12);color:#4fa3ff;font-size:18px;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;transition:all .3s ease}
#mic:active{cursor:grabbing}
#mic.on{border-color:#22ff00!important;color:#22ff00!important;background:rgba(34,255,0,.18)!important;box-shadow:0 0 40px rgba(34,255,0,.6)!important}
#chatOverlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.58);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}
#chatOverlay.open{opacity:1;pointer-events:auto}
#chatBox{width:min(430px,92vw);height:min(650px,80vh);display:flex;flex-direction:column;border:1px solid rgba(79,163,255,.45);border-radius:20px;background:linear-gradient(180deg,rgba(5,13,28,.98),rgba(1,5,12,.98));overflow:hidden;transform:scale(.94);transition:transform .2s}
#chatOverlay.open #chatBox{transform:scale(1)}
#chatHeader{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;border-bottom:1px solid rgba(120,180,255,.13)}
#chatTitle{color:#7dbdff;font-size:11px;letter-spacing:3px;text-transform:uppercase}
#chatActions{display:flex;gap:7px}
.chatAction{width:34px;height:34px;border:1px solid rgba(79,163,255,.25);border-radius:9px;background:rgba(79,163,255,.07);color:#9dccff;cursor:pointer;font-size:15px;-webkit-tap-highlight-color:transparent;padding:0;font-weight:700}
#chatHistory{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.message{max-width:88%;padding:10px 12px;border-radius:13px;font-size:13px;line-height:1.5;word-break:break-word}
.message.user{align-self:flex-end;color:#dff0ff;background:rgba(79,163,255,.12);border:1px solid rgba(79,163,255,.22)}
.message.noa{align-self:flex-start;color:#dcecff;background:rgba(8,18,35,.9);border:1px solid rgba(79,163,255,.17)}
#chatInputArea{display:flex;gap:7px;padding:10px;border-top:1px solid rgba(120,180,255,.13)}
#chatInput{flex:1;height:42px;border:1px solid rgba(79,163,255,.22);border-radius:11px;background:rgba(79,163,255,.05);color:#dcecff;padding:0 12px;font-size:13px;outline:0}
#sendChat{width:44px;height:42px;border:1px solid rgba(79,163,255,.35);border-radius:11px;background:rgba(79,163,255,.10);color:#8fc8ff;cursor:pointer;font-size:17px;padding:0}
</style>
</head>
<body>
<div id="app"><div id="orbContainer"><div id="orb"><div id="orbGlow"></div><svg viewBox="0 0 280 280"><defs><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="core"><stop offset="0" stop-color="#020409"/><stop offset="1" stop-color="#000"/></radialGradient><linearGradient id="a"><stop stop-color="#bfe0ff" stop-opacity="0"/><stop offset=".5" stop-color="#4fa3ff"/><stop offset="1" stop-color="#bfe0ff" stop-opacity="0"/></linearGradient><linearGradient id="b"><stop stop-color="#dff0ff" stop-opacity="0"/><stop offset=".5" stop-color="#7cc4ff"/><stop offset="1" stop-color="#dff0ff" stop-opacity="0"/></linearGradient></defs><circle cx="140" cy="140" r="110" fill="url(#core)"/><g filter="url(#glow)"><g class="r1"><path d="M140 45 C210 50 250 100 245 160 C240 220 190 260 130 260" fill="none" stroke="url(#a)" stroke-width="2" stroke-linecap="round"/></g><g class="r2"><path d="M130 265 C60 262 20 210 25 150 C30 90 80 40 145 35" fill="none" stroke="url(#b)" stroke-width="1.8" stroke-linecap="round"/></g><g class="r3"><ellipse cx="140" cy="140" rx="105" ry="90" fill="none" stroke="#3d8fff" stroke-opacity=".55" stroke-width="1.2"/></g><g class="r4"><ellipse cx="140" cy="140" rx="90" ry="105" fill="none" stroke="#8fd0ff" stroke-opacity=".4" stroke-width=".9"/></g></g></svg><div id="center"><div id="wave"></div><div id="state">IDLE</div></div></div></div></div>
<button id="mic">🎙</button>
<div id="chatOverlay"><div id="chatBox"><div id="chatHeader"><div id="chatTitle">NOA // CHAT</div><div id="chatActions"><button class="chatAction" id="clearChat">⌫</button><button class="chatAction" id="closeChat">×</button></div></div><div id="chatHistory"></div><div id="chatInputArea"><input id="chatInput" type="text" placeholder="Talk to NOA..."/><button id="sendChat">➤</button></div></div></div>
<script>
const orb=document.getElementById('orb');
const orbContainer=document.getElementById('orbContainer');
const mic=document.getElementById('mic');
const chatOverlay=document.getElementById('chatOverlay');
const chatInput=document.getElementById('chatInput');
const wave=document.getElementById('wave');
let zoom=1;
const MIN_ZOOM=0.5;
const MAX_ZOOM=2.5;
[5,8,12,18,11,23,16,29,19,24,14,9,6,10,16,22,15,20,27,17,10,14,20,25,15,9,5].forEach((h,i)=>{
  const bar=document.createElement('i');
  bar.style.height=h+'px';
  bar.style.animationDelay=(i*0.04)+'s';
  wave.appendChild(bar);
});
orbContainer.addEventListener('wheel',(e)=>{
  e.preventDefault();
  zoom+=e.deltaY<0?0.1:-0.1;
  zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,zoom));
  orbContainer.style.transform='scale('+zoom+')';
},{passive:false});
let pinchStart=0;let pinchZoom=1;
orb.addEventListener('touchstart',(e)=>{
  if(e.touches.length!==2)return;
  const dx=e.touches[0].clientX-e.touches[1].clientX;
  const dy=e.touches[0].clientY-e.touches[1].clientY;
  pinchStart=Math.hypot(dx,dy);
  pinchZoom=zoom;
});
orb.addEventListener('touchmove',(e)=>{
  if(e.touches.length!==2||!pinchStart)return;
  e.preventDefault();
  const dx=e.touches[0].clientX-e.touches[1].clientX;
  const dy=e.touches[0].clientY-e.touches[1].clientY;
  const dist=Math.hypot(dx,dy);
  zoom=pinchZoom*(dist/pinchStart);
  zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,zoom));
  orbContainer.style.transform='scale('+zoom+')';
},{passive:false});
let micStart=null;
mic.addEventListener('pointerdown',(e)=>{
  micStart={x:e.clientX,y:e.clientY};
  mic.classList.add('on');
});
document.addEventListener('pointermove',(e)=>{
  if(!micStart)return;
  const dx=e.clientX-micStart.x;
  const dy=e.clientY-micStart.y;
  if(Math.hypot(dx,dy)>10){
    mic.style.position='fixed';
    mic.style.right=(window.innerWidth-e.clientX)+'px';
    mic.style.bottom=(window.innerHeight-e.clientY)+'px';
  }
});
document.addEventListener('pointerup',()=>{
  micStart=null;
  mic.classList.remove('on');
});
let tapCount=0;let lastTap=0;
orb.addEventListener('click',()=>{
  const now=Date.now();
  if(now-lastTap<300){
    tapCount++;
    if(tapCount===2){
      chatOverlay.classList.add('open');
      chatInput.focus();
      tapCount=0;
    }
  }else{tapCount=1}
  lastTap=now;
});
document.getElementById('closeChat').addEventListener('click',()=>{
  chatOverlay.classList.remove('open');
});
document.getElementById('clearChat').addEventListener('click',()=>{
  document.getElementById('chatHistory').innerHTML='';
});
document.getElementById('sendChat').addEventListener('click',()=>{
  const msg=chatInput.value.trim();
  if(!msg)return;
  addMessage('user',msg);
  chatInput.value='';
});
chatInput.addEventListener('keypress',(e)=>{
  if(e.key==='Enter'){document.getElementById('sendChat').click()}
});
function addMessage(role,text){
  const bubble=document.createElement('div');
  bubble.className='message '+role;
  bubble.textContent=text;
  document.getElementById('chatHistory').appendChild(bubble);
  document.getElementById('chatHistory').scrollTop=document.getElementById('chatHistory').scrollHeight;
}
</script>
</body>
</html>
