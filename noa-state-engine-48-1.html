<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>NOA</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

body{
  font-family:Inter,Arial,sans-serif;
  color:#4fa3ff;
  touch-action:none;
}

button,
input{
  font-family:inherit;
}

#app{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}


/* =========================================================
   ORB
========================================================= */

#orb{
  position:relative;
  width:280px;
  height:280px;

  transform-origin:center;
  will-change:transform;

  user-select:none;
  -webkit-user-select:none;

  cursor:default;
}

#orbGlow{
  position:absolute;
  inset:-55px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(30,110,255,.34),
      rgba(20,80,220,.10) 42%,
      transparent 72%
    );

  filter:blur(18px);

  animation:breathe 4.5s ease-in-out infinite;

  pointer-events:none;
}

@keyframes breathe{
  0%,100%{
    opacity:.7;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.05);
  }
}

#orb svg{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  overflow:visible;

  pointer-events:none;
}

.r1{
  animation:r1 22s linear infinite;
  transform-origin:210px 210px;
}

.r2{
  animation:r2 17s linear infinite;
  transform-origin:210px 210px;
}

.r3{
  animation:r3 13s linear infinite;
  transform-origin:210px 210px;
}

.r4{
  animation:r1 27s linear infinite;
  transform-origin:210px 210px;
}

@keyframes r1{
  to{
    transform:rotate(360deg);
  }
}

@keyframes r2{
  from{
    transform:rotate(360deg);
  }

  to{
    transform:rotate(0);
  }
}

@keyframes r3{
  to{
    transform:rotate(-360deg);
  }
}


/* =========================================================
   CENTER
========================================================= */

#center{
  position:absolute;
  inset:0;

  z-index:5;

  pointer-events:none;
}

#wave{
  position:absolute;

  left:50%;
  top:50%;

  width:150px;
  height:30px;

  transform:translate(-50%,-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:3px;
}

#wave i{
  display:block;

  width:2px;

  border-radius:3px;

  background:#4fa3ff;

  box-shadow:
    0 0 7px rgba(79,163,255,.7);

  animation:
    wave 1s ease-in-out infinite alternate;
}

@keyframes wave{
  from{
    transform:scaleY(.28);
    opacity:.38;
  }

  to{
    transform:scaleY(1);
    opacity:1;
  }
}

#state{
  position:absolute;

  left:50%;
  top:calc(50% + 27px);

  transform:translateX(-50%);

  font-size:10px;
  line-height:1;

  letter-spacing:3px;

  text-transform:uppercase;

  text-shadow:
    0 0 10px rgba(79,163,255,.75);

  white-space:nowrap;
}


/* =========================================================
   SPOKEN WORDS
========================================================= */

#spokenText{
  position:absolute;

  left:50%;
  top:calc(50% + 48px);

  transform:translateX(-50%);

  width:205px;

  text-align:center;

  color:#4fa3ff;

  font-size:11px;
  line-height:1.45;

  letter-spacing:.45px;

  text-shadow:
    0 0 7px rgba(79,163,255,.85),
    0 0 14px rgba(79,163,255,.45);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .15s ease;

  z-index:10;
}

body[data-state="speaking"] #state{
  opacity:0;
}

body[data-state="speaking"] #spokenText{
  opacity:1;
}

body[data-state="idle"] #spokenText,
body[data-state="listening"] #spokenText,
body[data-state="thinking"] #spokenText,
body[data-state="complete"] #spokenText,
body[data-state="executing"] #spokenText{
  opacity:0;
}


/* =========================================================
   MIC
========================================================= */

#mic{
  position:fixed;

  right:28px;
  bottom:28px;

  width:48px;
  height:48px;

  border-radius:50%;

  z-index:30;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #4fa3ff;

  background:
    rgba(79,163,255,.12);

  color:#4fa3ff;

  box-shadow:
    0 0 22px rgba(79,163,255,.25),
    inset 0 0 10px rgba(79,163,255,.08);

  font-size:18px;

  user-select:none;
  -webkit-user-select:none;

  touch-action:none;

  cursor:grab;

  -webkit-tap-highlight-color:transparent;

  padding:0;
}

#mic.dragging{
  cursor:grabbing;
}

#mic.on{
  border-color:#35e887;

  color:#35e887;

  background:
    rgba(53,232,135,.16);

  box-shadow:
    0 0 30px rgba(53,232,135,.42),
    inset 0 0 12px rgba(53,232,135,.12);
}


/* =========================================================
   CHAT
========================================================= */

#chatOverlay{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .2s ease;
}

#chatOverlay.open{
  opacity:1;
  pointer-events:auto;
}

#chatBox{
  width:min(420px,88vw);
  height:min(620px,78vh);

  display:flex;
  flex-direction:column;

  border:
    1px solid rgba(79,163,255,.45);

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      rgba(5,13,28,.97),
      rgba(1,5,12,.97)
    );

  box-shadow:
    0 0 45px rgba(25,105,220,.22),
    inset 0 0 30px rgba(79,163,255,.035);

  overflow:hidden;

  transform:scale(.94);

  transition:
    transform .2s ease;
}

#chatOverlay.open #chatBox{
  transform:scale(1);
}

#chatHeader{
  height:52px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 12px 0 18px;

  border-bottom:
    1px solid rgba(120,180,255,.13);
}

#chatTitle{
  color:#7dbdff;

  font-size:11px;

  letter-spacing:3px;

  text-transform:uppercase;
}

#chatActions{
  display:flex;
  gap:7px;
}

.chatAction{
  width:32px;
  height:32px;

  border:
    1px solid rgba(79,163,255,.2);

  border-radius:9px;

  background:
    rgba(79,163,255,.07);

  color:#9dccff;

  cursor:pointer;

  font-size:14px;

  padding:0;
}

.chatAction:active{
  transform:scale(.94);
}

#chatHistory{
  flex:1;

  overflow-y:auto;

  padding:14px;

  display:flex;
  flex-direction:column;

  gap:10px;

  scrollbar-width:thin;
}

.message{
  max-width:86%;

  padding:10px 12px;

  border-radius:13px;

  font-size:13px;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;
}

.message.user{
  align-self:flex-end;

  color:#dff0ff;

  background:
    rgba(79,163,255,.12);

  border:
    1px solid rgba(79,163,255,.22);

  border-bottom-right-radius:4px;
}

.message.noa{
  align-self:flex-start;

  color:#dcecff;

  background:
    rgba(8,18,35,.9);

  border:
    1px solid rgba(79,163,255,.17);

  border-bottom-left-radius:4px;

  box-shadow:
    0 0 15px rgba(25,105,220,.08);
}

.messageLabel{
  display:block;

  margin-bottom:4px;

  font-size:8px;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#6dafff;

  opacity:.7;
}

.typing{
  opacity:.65;
  font-style:italic;
}

#chatInputArea{
  display:flex;

  gap:7px;

  padding:10px;

  border-top:
    1px solid rgba(120,180,255,.13);
}

#chatInput{
  flex:1;

  min-width:0;

  height:42px;

  border:
    1px solid rgba(79,163,255,.22);

  border-radius:11px;

  outline:none;

  background:
    rgba(79,163,255,.05);

  color:#dcecff;

  padding:
    0 12px;

  font-size:13px;
}

#chatInput::placeholder{
  color:#6684a5;
}

#chatInput:focus{
  border-color:
    rgba(79,163,255,.55);

  box-shadow:
    0 0 15px rgba(79,163,255,.08);
}

#sendChat{
  width:44px;
  height:42px;

  border:
    1px solid rgba(79,163,255,.35);

  border-radius:11px;

  background:
    rgba(79,163,255,.10);

  color:#8fc8ff;

  cursor:pointer;

  font-size:17px;

  padding:0;
}

#sendChat:active{
  transform:scale(.94);
}

#chatHint{
  padding:
    0 12px 9px;

  color:#50708f;

  font-size:9px;

  text-align:center;
}


/* =========================================================
   POPUP RESULT
========================================================= */

#popupLayer{
  position:fixed;
  inset:0;

  z-index:80;

  pointer-events:none;

  overflow:hidden;
}

.noa-popup{
  position:absolute;

  left:50%;
  top:50%;

  width:min(360px,78vw);

  min-height:130px;

  transform:
    translate(-50%,-50%)
    scale(.96);

  pointer-events:auto;

  border:
    1px solid rgba(79,163,255,.42);

  border-radius:18px;

  background:
    rgba(3,8,18,.95);

  box-shadow:
    0 0 35px rgba(25,105,220,.18);

  color:#dcecff;

  overflow:hidden;

  opacity:0;

  animation:
    popupIn .18s ease forwards;
}

@keyframes popupIn{
  to{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

.noa-popup-head{
  height:42px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 12px 0 16px;

  border-bottom:
    1px solid rgba(120,180,255,.12);
}

.noa-popup-title{
  font-size:10px;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#7dbdff;
}

.noa-popup-close{
  width:30px;
  height:30px;

  border:0;

  border-radius:8px;

  background:
    rgba(79,163,255,.08);

  color:#8fc8ff;

  cursor:pointer;
}

.noa-popup-body{
  padding:16px;

  font-size:13px;

  line-height:1.55;

  white-space:pre-wrap;

  max-height:280px;

  overflow:auto;

  user-select:text;
}


/* =========================================================
   STATES
========================================================= */

body[data-state="thinking"] #orbGlow{
  animation:
    breathe 1.6s ease-in-out infinite;
}

body[data-state="executing"] #orbGlow{
  animation:
    breathe .75s ease-in-out infinite;
}

body[data-state="speaking"] #wave i{
  animation-duration:.45s;
}

body[data-state="executing"] #wave i{
  animation-duration:.3s;
}

body[data-state="complete"] #orbGlow{
  animation:
    pulse .7s ease-out 1;
}

@keyframes pulse{
  50%{
    transform:scale(1.2);
    opacity:1;
  }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

  #orb{
    width:250px;
    height:250px;
  }

  #mic{
    right:20px;
    bottom:20px;
  }

  #spokenText{
    width:185px;
    font-size:11px;
  }

  #chatBox{
    width:92vw;
    height:78vh;
    border-radius:18px;
  }
}
</style>
</head>

<div id="app">

<script>
"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const body =
  document.body;

const orb =
  document.getElementById("orb");

const wave =
  document.getElementById("wave");

const state =
  document.getElementById("state");

const spokenText =
  document.getElementById("spokenText");

const mic =
  document.getElementById("mic");

const chatOverlay =
  document.getElementById("chatOverlay");

const chatHistory =
  document.getElementById("chatHistory");

const chatInput =
  document.getElementById("chatInput");

const sendChat =
  document.getElementById("sendChat");

const closeChat =
  document.getElementById("closeChat");

const clearChat =
  document.getElementById("clearChat");

const popupLayer =
  document.getElementById("popupLayer");


/* =========================================================
   WORKER
========================================================= */

const NOA_WORKER =
  "https://noa-brain-a78d.ajaiacharya7274.workers.dev/api/chat";


/* =========================================================
   STATE
========================================================= */

function setState(value){

  const next =
    String(value || "IDLE")
      .toUpperCase();

  body.dataset.state =
    next.toLowerCase();

  state.textContent =
    next;
}


function getState(){

  return state.textContent;

}


/* =========================================================
   WAVE
========================================================= */

[
  5,8,12,18,11,23,16,29,19,
  24,14,9,6,10,16,22,15,20,
  27,17,10,14,20,25,15,9,5
].forEach(
  (height,index)=>{

    const bar =
      document.createElement("i");

    bar.style.height =
      height + "px";

    bar.style.animationDelay =
      (index * .04) + "s";

    wave.appendChild(bar);

  }
);


/* =========================================================
   ORB ZOOM
========================================================= */

let zoom = 1;

const MIN_ZOOM = .55;
const MAX_ZOOM = 2.4;


function applyOrbZoom(){

  orb.style.transform =
    `scale(${zoom})`;

}


orb.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    zoom +=
      event.deltaY < 0
        ? .08
        : -.08;

    zoom =
      Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          zoom
        )
      );

    applyOrbZoom();

  },
  {passive:false}
);


/* =========================================================
   PINCH ZOOM
========================================================= */

let pinchStartDistance = 0;
let pinchStartZoom = 1;


orb.addEventListener(
  "touchstart",
  event=>{

    if(event.touches.length !== 2){
      return;
    }

    pinchStartDistance =
      Math.hypot(
        event.touches[0].clientX -
        event.touches[1].clientX,

        event.touches[0].clientY -
        event.touches[1].clientY
      );

    pinchStartZoom =
      zoom;

  },
  {passive:true}
);


orb.addEventListener(
  "touchmove",
  event=>{

    if(
      event.touches.length !== 2 ||
      !pinchStartDistance
    ){
      return;
    }

    event.preventDefault();

    const distance =
      Math.hypot(
        event.touches[0].clientX -
        event.touches[1].clientX,

        event.touches[0].clientY -
        event.touches[1].clientY
      );

    zoom =
      pinchStartZoom *
      (distance / pinchStartDistance);

    zoom =
      Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          zoom
        )
      );

    applyOrbZoom();

  },
  {passive:false}
);


orb.addEventListener(
  "touchend",
  ()=>{
    pinchStartDistance = 0;
  },
  {passive:true}
);


/* =========================================================
   CHAT HISTORY
========================================================= */

const STORAGE_KEY =
  "NOA_CHAT_HISTORY_V2";

let history = [];


try{

  history =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "[]"
    );

  if(!Array.isArray(history)){
    history = [];
  }

}catch{

  history = [];

}


function saveHistory(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );

  }catch(error){

    console.warn(
      "NOA history save failed",
      error
    );

  }

}


function renderHistory(){

  chatHistory.innerHTML = "";

  history.forEach(
    item=>{

      const
