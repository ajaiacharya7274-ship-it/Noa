<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NOA</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

body{
  font-family:Inter,Arial,sans-serif;
  color:#4fa3ff;
  touch-action:none;
}

#app{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   ORB
========================= */

#orb{
  position:relative;
  width:280px;
  height:280px;
  transform-origin:center;
  will-change:transform;
}

#orbGlow{
  position:absolute;
  inset:-55px;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(30,110,255,.34),
      rgba(20,80,220,.10) 42%,
      transparent 72%
    );

  filter:blur(18px);

  animation:breathe 4.5s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{
    opacity:.7;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.05);
  }
}

#orb svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

.r1{
  animation:r1 22s linear infinite;
  transform-origin:210px 210px;
}

.r2{
  animation:r2 17s linear infinite;
  transform-origin:210px 210px;
}

.r3{
  animation:r3 13s linear infinite;
  transform-origin:210px 210px;
}

.r4{
  animation:r1 27s linear infinite;
  transform-origin:210px 210px;
}

@keyframes r1{
  to{
    transform:rotate(360deg);
  }
}

@keyframes r2{
  from{
    transform:rotate(360deg);
  }

  to{
    transform:rotate(0);
  }
}

@keyframes r3{
  to{
    transform:rotate(-360deg);
  }
}

/* =========================
   CENTER
========================= */

#center{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

#wave{
  position:absolute;
  left:50%;
  top:50%;

  width:150px;
  height:30px;

  transform:translate(-50%,-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:3px;
}

#wave i{
  display:block;
  width:2px;

  border-radius:3px;

  background:#4fa3ff;

  box-shadow:
    0 0 7px rgba(79,163,255,.7);

  animation:
    wave 1s ease-in-out infinite alternate;
}

@keyframes wave{
  from{
    transform:scaleY(.28);
    opacity:.38;
  }

  to{
    transform:scaleY(1);
    opacity:1;
  }
}

#state{
  position:absolute;
  left:50%;
  top:calc(50% + 27px);

  transform:translateX(-50%);

  font-size:10px;
  line-height:1;

  letter-spacing:3px;

  text-transform:uppercase;

  text-shadow:
    0 0 10px rgba(79,163,255,.75);
}

/* =========================
   SPOKEN TEXT
========================= */

#spokenText{
  position:absolute;

  left:50%;
  top:calc(50% + 48px);

  transform:translateX(-50%);

  width:190px;

  text-align:center;

  color:#4fa3ff;

  font-size:11px;
  line-height:1.45;

  letter-spacing:.45px;

  text-shadow:
    0 0 7px rgba(79,163,255,.85),
    0 0 14px rgba(79,163,255,.45);

  opacity:0;

  pointer-events:none;

  transition:opacity .15s ease;

  z-index:10;
}

body[data-state="speaking"] #state{
  opacity:0;
}

body[data-state="speaking"] #spokenText{
  opacity:1;
}

body[data-state="idle"] #spokenText,
body[data-state="listening"] #spokenText,
body[data-state="thinking"] #spokenText,
body[data-state="executing"] #spokenText,
body[data-state="complete"] #spokenText{
  opacity:0;
}

/* =========================
   MIC
========================= */

#mic{
  position:fixed;

  right:28px;
  bottom:28px;

  width:48px;
  height:48px;

  border-radius:50%;

  z-index:20;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(79,163,255,.65);

  background:rgba(79,163,255,.10);

  color:#4fa3ff;

  box-shadow:
    0 0 20px rgba(79,163,255,.16);

  font-size:18px;

  user-select:none;

  touch-action:none;

  cursor:grab;

  -webkit-tap-highlight-color:transparent;
}

#mic.dragging{
  cursor:grabbing;
}

#mic.on{
  border:2px solid #35e887;

  color:#35e887;

  background:rgba(53,232,135,.16);

  box-shadow:
    0 0 30px rgba(53,232,135,.42),
    inset 0 0 12px rgba(53,232,135,.12);
}

#mic.off{
  border:2px solid #4fa3ff;

  color:#4fa3ff;

  background:rgba(79,163,255,.12);

  box-shadow:
    0 0 22px rgba(79,163,255,.25),
    inset 0 0 10px rgba(79,163,255,.08);
}

/* =========================
   STATE ANIMATION
========================= */

body[data-state="thinking"] #orbGlow{
  animation:
    breathe 1.6s ease-in-out infinite;
}

body[data-state="executing"] #orbGlow{
  animation:
    breathe .75s ease-in-out infinite;
}

body[data-state="speaking"] #wave i{
  animation-duration:.45s;
}

body[data-state="executing"] #wave i{
  animation-duration:.3s;
}

body[data-state="complete"] #orbGlow{
  animation:
    pulse .7s ease-out 1;
}

@keyframes pulse{
  50%{
    transform:scale(1.2);
    opacity:1;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  #orb{
    width:250px;
    height:250px;
  }

  #mic{
    right:20px;
    bottom:20px;
  }

  #spokenText{
    width:180px;
    font-size:11px;
  }
}
</style>
</head>

<body data-state="idle">

<div id="app">

  <div id="orb">

    <div id="orbGlow"></div>

    <svg
      viewBox="0 0 420 420"
      aria-hidden="true"
    >

      <defs>

        <filter
          id="glow"
          x="-80%"
          y="-80%"
          width="260%"
          height="260%"
        >
          <feGaussianBlur
            stdDeviation="6"
            result="b"
          />

          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="soft">
          <feGaussianBlur
            stdDeviation="2"
          />
        </filter>

        <radialGradient id="core">

          <stop
            offset="0"
            stop-color="#020409"
          />

          <stop
            offset="1"
            stop-color="#000"
          />

        </radialGradient>

        <linearGradient id="a">

          <stop
            stop-color="#bfe0ff"
            stop-opacity="0"
          />

          <stop
            offset=".5"
            stop-color="#4fa3ff"
          />

          <stop
            offset="1"
            stop-color="#bfe0ff"
            stop-opacity="0"
          />

        </linearGradient>

        <linearGradient id="b">

          <stop
            stop-color="#dff0ff"
            stop-opacity="0"
          />

          <stop
            offset=".5"
            stop-color="#7cc4ff"
          />

          <stop
            offset="1"
            stop-color="#dff0ff"
            stop-opacity="0"
          />

        </linearGradient>

      </defs>

      <circle
        cx="210"
        cy="210"
        r="150"
        fill="url(#core)"
      />

      <g filter="url(#glow)">

        <g class="r1">

          <path
            d="M210 65 C300 70 355 140 350 215 C345 290 280 350 205 350"
            fill="none"
            stroke="url(#a)"
            stroke-width="2.6"
            stroke-linecap="round"
          />

        </g>

        <g class="r2">

          <path
            d="M205 355 C120 352 65 285 68 210 C71 135 130 72 208 68"
            fill="none"
            stroke="url(#b)"
            stroke-width="2.4"
            stroke-linecap="round"
          />

        </g>

        <g class="r3">

          <ellipse
            cx="210"
            cy="210"
            rx="142"
            ry="128"
            fill="none"
            stroke="#3d8fff"
            stroke-opacity=".55"
            stroke-width="1.4"
            stroke-dasharray="1 9"
          />

        </g>

        <g class="r4">

          <ellipse
            cx="210"
            cy="210"
            rx="128"
            ry="144"
            fill="none"
            stroke="#8fd0ff"
            stroke-opacity=".4"
            stroke-width="1.1"
            stroke-dasharray="1 7"
          />

        </g>

        <g class="r2">

          <circle
            cx="210"
            cy="210"
            r="150"
            fill="none"
            stroke="#2f6fe0"
            stroke-opacity=".5"
          />

        </g>

      </g>

      <g filter="url(#soft)">

        <circle
          cx="210"
          cy="61"
          r="2"
          fill="#eaf6ff"
        />

        <circle
          cx="358"
          cy="150"
          r="1.6"
          fill="#cfe8ff"
        />

        <circle
          cx="360"
          cy="270"
          r="1.8"
          fill="#eaf6ff"
        />

        <circle
          cx="205"
          cy="359"
          r="2"
          fill="#cfe8ff"
        />

        <circle
          cx="62"
          cy="255"
          r="1.6"
          fill="#eaf6ff"
        />

        <circle
          cx="65"
          cy="145"
          r="1.8"
          fill="#cfe8ff"
        />

      </g>

    </svg>

    <div id="center">

      <div id="wave"></div>

      <div id="state">
        IDLE
      </div>

      <div id="spokenText"></div>

    </div>

  </div>

</div>

<button
  id="mic"
  aria-label="Microphone"
  aria-pressed="false"
  class="off"
>
  🎙
</button>

<script>
"use strict";

/* ==========================================
   CORE ELEMENTS
========================================== */

const body =
  document.body;

const wave =
  document.getElementById("wave");

const state =
  document.getElementById("state");

const spokenText =
  document.getElementById("spokenText");

const mic =
  document.getElementById("mic");

const orb =
  document.getElementById("orb");


/* ==========================================
   WAVEFORM
========================================== */

[
  5,8,12,18,11,23,16,29,19,
  24,14,9,6,10,16,22,15,20,
  27,17,10,14,20,25,15,9,5
].forEach((height,index)=>{

  const bar =
    document.createElement("i");

  bar.style.height =
    height + "px";

  bar.style.animationDelay =
    (index * 0.04) + "s";

  wave.appendChild(bar);

});


/* ==========================================
   STATE SYSTEM
========================================== */

function setState(newState){

  const value =
    String(newState || "IDLE")
      .toUpperCase();

  body.dataset.state =
    value.toLowerCase();

  state.textContent =
    value;
}

window.NOA = {
  setState,
  getState(){
    return state.textContent;
  }
};


/* ==========================================
   ORB ZOOM
========================================== */

let zoom = 1;

const MIN_ZOOM = 0.55;
const MAX_ZOOM = 2.4;

function applyOrbZoom(){

  orb.style.transform =
    "scale(" + zoom + ")";

}

orb.addEventListener(
  "wheel",
  event => {

    event.preventDefault();

    zoom +=
      event.deltaY < 0
        ? 0.08
        : -0.08;

    zoom =
      Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          zoom
        )
      );

    applyOrbZoom();

  },
  {
    passive:false
  }
);


/* ==========================================
   TOUCH PINCH
========================================== */

let pinchStartDistance = 0;
let pinchStartZoom = 1;

orb.addEventListener(
  "touchstart",
  event => {

    if (
      event.touches.length !== 2
    ){
      return;
    }

    pinchStartDistance =
      Math.hypot(
        event.touches[0].clientX -
        event.touches[1].clientX,

        event.touches[0].clientY -
        event.touches[1].clientY
      );

    pinchStartZoom =
      zoom;

  },
  {
    passive:true
  }
);

orb.addEventListener(
  "touchmove",
  event => {

    if (
      event.touches.length !== 2 ||
      !pinchStartDistance
    ){
      return;
    }

    event.preventDefault();

    const distance =
      Math.hypot(
        event.touches[0].clientX -
        event.touches[1].clientX,

        event.touches[0].clientY -
        event.touches[1].clientY
      );

    zoom =
      pinchStartZoom *
      (distance / pinchStartDistance);

    zoom =
      Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          zoom
        )
      );

    applyOrbZoom();

  },
  {
    passive:false
  }
);

orb.addEventListener(
  "touchend",
  () => {

    pinchStartDistance =
      0;

  },
  {
    passive:true
  }
);


/* ==========================================
   MIC DRAG
========================================== */

let pointerId = null;
let grabX = 0;
let grabY = 0;
let wasDragged = false;

mic.addEventListener(
  "pointerdown",
  event => {

    if (
      event.button !== undefined &&
      event.button !== 0
    ){
      return;
    }

    const rect =
      mic.getBoundingClientRect();

    pointerId =
      event.pointerId;

    grabX =
      event.clientX -
      rect.left;

    grabY =
      event.clientY -
      rect.top;

    wasDragged =
      false;

    mic.classList.add(
      "dragging"
    );

    mic.setPointerCapture(
      pointerId
    );

    event.preventDefault();

  }
);

mic.addEventListener(
  "pointermove",
  event => {

    if (
      event.pointerId !==
      pointerId
    ){
      return;
    }

    const rect =
      mic.getBoundingClientRect();

    const newLeft =
      event.clientX -
      grabX;

    const newTop =
      event.clientY -
      grabY;

    if (
      Math.abs(
        newLeft - rect.left
      ) > 3 ||
      Math.abs(
        newTop - rect.top
      ) > 3
    ){
      wasDragged =
        true;
    }

    const left =
      Math.max(
        0,
        Math.min(
          innerWidth -
          rect.width,
          newLeft
        )
      );

    const top =
      Math.max(
        0,
        Math.min(
          innerHeight -
          rect.height,
          newTop
        )
      );

    mic.style.left =
      left + "px";

    mic.style.top =
      top + "px";

    mic.style.right =
      "auto";

    mic.style.bottom =
      "auto";

  }
);

function endMicDrag(event){

  if (
    event.pointerId !==
    pointerId
  ){
    return;
  }

  mic.classList.remove(
    "dragging"
  );

  if (
    mic.hasPointerCapture(
      pointerId
    )
  ){
    mic.releasePointerCapture(
      pointerId
    );
  }

  if (wasDragged){

    mic.dataset.dragged =
      "1";

    setTimeout(
      () => {
        delete mic.dataset.dragged;
      },
      120
    );

  }

  pointerId =
    null;
}

mic.addEventListener(
  "pointerup",
  endMicDrag
);

mic.addEventListener(
  "pointercancel",
  endMicDrag
);


/* ==========================================
   SPEECH RECOGNITION
========================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let listening =
  false;

let visualMicOn =
  false;


function setMicVisual(on){

  visualMicOn =
    Boolean(on);

  mic.classList.toggle(
    "on",
    visualMicOn
  );

  mic.classList.toggle(
    "off",
    !visualMicOn
  );

  mic.setAttribute(
    "aria-pressed",
    String(visualMicOn)
  );

  if (visualMicOn){

    setState(
      "LISTENING"
    );

  }else{

    setState(
      "IDLE"
    );

  }
}


if (SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-US";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;


  recognition.onstart =
    () => {

      listening =
        true;

      setMicVisual(
        true
      );

    };


  recognition.onresult =
    event => {

      let text = "";

      for (
        let i =
          event.resultIndex;

        i <
        event.results.length;

        i++
      ){

        text +=
          event.results[i][0]
            .transcript;

      }

      text =
        text.trim();

      if (!text){
        return;
      }

      setState(
        "THINKING"
      );

      /*
       * IMPORTANT:
       * Brain connection will call
       * window.NOA.ask(text)
       * later.
       */
      if (
        event.results[
          event.results.length - 1
        ].isFinal
      ){

        if (
          typeof window.NOA.ask ===
          "function"
        ){

          window.NOA.ask(
            text
          );

        }

      }

    };


  recognition.onerror =
    () => {

      listening =
        false;

      setMicVisual(
        false
      );

    };


  recognition.onend =
    () => {

      listening =
        false;

      if (
        visualMicOn &&
        state.textContent ===
        "LISTENING"
      ){

        setState(
          "IDLE"
        );

      }

    };

}


/* ==========================================
   MIC CLICK
========================================== */

mic.addEventListener(
  "click",
  event => {

    if (
      mic.dataset.dragged ===
      "1"
    ){

      delete mic.dataset.dragged;

      event.preventDefault();

      return;

    }

    const next =
      !visualMicOn;

    setMicVisual(
      next
    );


    if (!recognition){
      return;
    }


    if (next){

      try{

        recognition.start();

      }catch(error){

        console.warn(
          "Recognition start:",
          error
        );

      }

    }else{

      if (listening){

        try{

          recognition.stop();

        }catch(error){

          console.warn(
            "Recognition stop:",
            error
          );

        }

      }

    }

  }
);


/* ==========================================
   SPEECH OUTPUT
========================================== */

function speak(text){

  const value =
    String(text || "")
      .trim();

  if (!value){
    return;
  }

  if (
    !("speechSynthesis" in window)
  ){

    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      value
    );

  utterance.rate =
    1.02;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  utterance.onstart =
    () => {

      setState(
        "SPEAKING"
      );

    };


  utterance.onend =
    () => {

      spokenText.textContent =
        "";

      setState(
        "IDLE"
      );

    };


  utterance.onerror =
    () => {

      spokenText.textContent =
        "";

      setState(
        "IDLE"
      );

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==========================================
   WORD-BY-WORD DISPLAY
========================================== */

function showWordsWhileSpeaking(
  text,
  duration
){

  const words =
    String(text || "")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if (!words.length){
    return;
  }

  spokenText.textContent =
    "";

  let index =
    0;

  const interval =
    Math.max(
      90,
      duration /
      words.length
    );

  const timer =
    setInterval(
      () => {

        if (
          index >=
          words.length
        ){

          clearInterval(
            timer
          );

          return;

        }

        index++;

        spokenText.textContent =
          words
            .slice(
              0,
              index
            )
            .join(" ");

      },
      interval
    );

}


/* ==========================================
   NOA SPEAK API
========================================== */

window.NOA.speak =
  function(text){

    const value =
      String(text || "")
        .trim();

    if (!value){
      return;
    }

    setState(
      "SPEAKING"
    );

    const wordCount =
      value
        .split(/\s+/)
        .filter(Boolean)
        .length;

    const estimatedDuration =
      Math.max(
        1000,
        wordCount * 190
      );

    showWordsWhileSpeaking(
      value,
      estimatedDuration
    );

    speak(
      value
    );

  };


/* ==========================================
   NOA ASK HOOK
========================================== */

window.NOA.ask =
  async function(text){

    const value =
      String(text || "")
        .trim();

    if (!value){
      return;
    }

    setState(
      "THINKING"
    );

    /*
     * Brain is NOT connected yet.
     *
     * This hook is intentionally ready
     * for the real AI backend.
     */

    console.log(
      "NOA heard:",
      value
    );

  };


/* ==========================================
   INITIAL STATE
========================================== */

setMicVisual(
  false
);

setState(
  "IDLE"
);

</script>

</body>
</html>
