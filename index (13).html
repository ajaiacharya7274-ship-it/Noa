function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function q(r,s){return r.querySelector(s)}
function tz(){return new Date().getTimezoneOffset()}
function toUtcMin(hhmm){var p=String(hhmm||"09:00").split(":"),m=(+p[0]||0)*60+(+p[1]||0);return((m+tz())%1440+1440)%1440}
function toLocalHHMM(u){var m=(((u-tz())%1440)+1440)%1440;return("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2)}
function when(ms){return ms?new Date(ms).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—"}
function logText(r){if(!r)return"No runs yet.";return(r.ok?"Last run OK":"Last run had an error")+" · "+when(r.at)+" · "+(r.ms/1000).toFixed(1)+"s\n"+r.log.map(function(l,i){return(i+1)+". "+(l.type||"step")+": "+(l.error?"ERROR "+l.error:String(l.value||"").slice(0,160))}).join("\n")}
auto.mount=function(task,body){
  origMount.call(auto,task,body);
  var w=body.querySelector(".rt-wrap");if(!w||!task.__getFlow)return;
  var box=document.createElement("div");box.className="cl-box";
  box.innerHTML='<div class="au-sec">☁ CLOUD · RUNS WITHOUT YOUR PHONE</div>'
   +'<div class="cl-row"><select class="rt-select" data-sch><option value="none">Manual or webhook only</option><option value="e5">Every 5 minutes</option><option value="e15">Every 15 minutes</option><option value="e60">Every hour</option><option value="e360">Every 6 hours</option><option value="daily">Every day at…</option></select><input class="npm-field" data-time type="time" value="09:00" hidden></div>'
   +'<div class="cl-row"><label><input type="checkbox" data-en checked> Active</label><button class="npm-btn" data-c="save" style="flex:1">☁ Save</button><button class="npm-btn" data-c="run" style="flex:1">☁ Run now</button></div>'
   +'<div class="cl-row"><select class="rt-select" data-cl><option value="">My cloud automations…</option></select><button class="npm-btn" data-c="del">Delete</button></div>'
   +'<div class="cl-info" data-info>Not saved to the cloud yet.</div><div class="cl-hook" data-hook hidden></div><button class="npm-btn" data-c="copy" hidden>Copy webhook URL</button>';
  w.appendChild(box);
  var sch=q(box,"[data-sch]"),tm=q(box,"[data-time]"),en=q(box,"[data-en]"),cl=q(box,"[data-cl]"),info=q(box,"[data-info]"),hook=q(box,"[data-hook]"),cp=q(box,"[data-c=copy]"),st=q(w,"[data-status]");
  var flows=[],busy=false;
  sch.addEventListener("change",function(){tm.hidden=sch.value!=="daily"});
  function say(t){st.textContent=t}
  function schedule(){var v=sch.value;if(v==="daily")return{mode:"daily",utcMin:toUtcMin(tm.value)};if(v[0]==="e")return{mode:"every",minutes:+v.slice(1)};return{mode:"none"}}
  function showSch(f){var s=f.schedule||{mode:"none"};if(s.mode==="daily"){sch.value="daily";tm.hidden=false;tm.value=toLocalHHMM(s.utcMin)}else if(s.mode==="every"){var v="e"+s.minutes;if(!q(sch,'option[value="'+v+'"]'))sch.insertAdjacentHTML("beforeend",'<option value="'+v+'">Every '+s.minutes+' min</option>');sch.value=v;tm.hidden=true}else{sch.value="none";tm.hidden=true}en.checked=f.enabled!==false}
  function showInfo(f){
    task.__cloudId=f.id;var nx=f.enabled&&f.schedule&&f.schedule.mode!=="none"?"Next run: "+when(f.next):"Not scheduled";
    info.textContent=nx+"\n"+logText(f.last);info.style.whiteSpace="pre-wrap";hook.hidden=false;hook.textContent=f.hook;cp.hidden=false;task.__hook=f.hook;
  }
  function fillList(sel){cl.innerHTML='<option value="">My cloud automations…</option>'+flows.map(function(f){return'<option value="'+f.id+'">'+esc(f.name)+(f.enabled&&f.schedule.mode!=="none"?" ⏱":"")+'</option>'}).join("");if(sel)cl.value=sel}
  async function refresh(sel){try{var d=await call("/api/flows");flows=d.flows||[];fillList(sel)}catch(e){info.textContent=e.message.indexOf("KV")>=0?e.message:"Cloud: "+e.message}}
  refresh();
  cl.addEventListener("change",function(){var f=flows.filter(function(x){return x.id===cl.value})[0];if(!f)return;task.__load({name:f.name,input:f.input,steps:JSON.parse(JSON.stringify(f.steps))});showSch(f);showInfo(f)});
  box.addEventListener("click",async function(e){
    var b=e.target.closest("[data-c]");if(!b||busy)return;var a=b.dataset.c;
    if(a==="copy"){try{await navigator.clipboard.writeText(task.__hook||"");say("Webhook URL copied. POST any text to it to run this automation.")}catch(_){say("Copy failed: "+(task.__hook||""))}return}
    var wf=task.__getFlow();
    if(a==="del"){if(!cl.value){say("Pick a cloud automation first");return}busy=true;try{await call("/api/flows/delete",{id:cl.value});task.__cloudId=null;hook.hidden=true;cp.hidden=true;info.textContent="Deleted.";await refresh();say("Deleted from the cloud")}catch(err){say(err.message)}busy=false;return}
    if(!wf.steps.length){say("Add a step first");return}
    busy=true;
    try{
      if(a==="save"||a==="run"){
        say("Saving to the cloud…");
        var d=await call("/api/flows/save",{flow:{id:task.__cloudId||undefined,name:wf.name,input:wf.input,steps:wf.steps,schedule:schedule(),enabled:en.checked}});
        showInfo(d.flow);await refresh(d.flow.id);
        if(a==="save")say("Saved. "+(d.flow.schedule.mode==="none"?"Run it any time, or use the webhook.":"It will run on schedule."));
        else{say("Running in the cloud… (can take up to a minute)");var r=await call("/api/flows/run",{id:d.flow.id});showInfo(r.flow);say(r.result.ok?"Cloud run finished":"Cloud run stopped on an error")}
      }
    }catch(err){say("Cloud: "+String(err.message).slice(0,160))}
    busy=false;
  });
};
/* settings: key backup */
var set=document.querySelector("#noaSet .ns-card");
if(set){
  set.insertAdjacentHTML("beforeend",'<div class="ns-l">CLOUD KEY</div><div class="ns-brain" style="flex-direction:column;align-items:stretch"><span id="nsKeyMsg">Your cloud automations are tied to a key stored on this device. Copy it somewhere safe to use them on another device.</span><div class="ns-key"><button type="button" data-k="copy">Copy key</button><button type="button" data-k="paste">Use a key</button></div></div>');
  set.addEventListener("click",function(e){
    var b=e.target.closest("[data-k]");if(!b)return;var m=document.getElementById("nsKeyMsg");
    if(b.dataset.k==="copy"){try{navigator.clipboard.writeText(key());m.textContent="Key copied. Keep it private: anyone with it can use your automations."}catch(_){m.textContent="Copy failed."}}
    else{var v=prompt("Paste your cloud key");if(v&&v.trim().length>=24){ls("noa_key",v.trim());m.textContent="Key updated. Reopen Automation to see its cloud automations."}}
  });
}
})();
</script>
