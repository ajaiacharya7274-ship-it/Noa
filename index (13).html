<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>NOA — V48</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,Arial,sans-serif;color:#4fa3ff;touch-action:none}
button,input{font:inherit}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

#orb{position:relative;width:280px;height:280px;flex:0 0 280px;transform-origin:center;will-change:transform}
#orbGlow{position:absolute;inset:-55px;border-radius:50%;background:radial-gradient(circle,rgba(30,110,255,.34),rgba(20,80,220,.10) 42%,transparent 72%);filter:blur(18px);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
#orb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.r1{animation:r1 22s linear infinite;transform-origin:210px 210px}
.r2{animation:r2 17s linear infinite;transform-origin:210px 210px}
.r3{animation:r3 13s linear infinite;transform-origin:210px 210px}
.r4{animation:r1 27s linear infinite;transform-origin:210px 210px}
@keyframes r1{to{transform:rotate(360deg)}}
@keyframes r2{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes r3{to{transform:rotate(-360deg)}}

#center{position:absolute;inset:0;z-index:5;pointer-events:none}
#wave{position:absolute;left:50%;top:50%;width:150px;height:30px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:3px}
#wave i{display:block;width:2px;border-radius:3px;background:#4fa3ff;box-shadow:0 0 7px rgba(79,163,255,.7);animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{from{transform:scaleY(.28);opacity:.38}to{transform:scaleY(1);opacity:1}}
#state{position:absolute;left:50%;top:calc(50% + 27px);transform:translateX(-50%);font-size:10px;line-height:1;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 10px rgba(79,163,255,.75)}
#spokenText{position:absolute;left:50%;top:calc(50% + 48px);transform:translateX(-50%);width:205px;text-align:center;color:#4fa3ff;font-size:11px;line-height:1.45;letter-spacing:.4px;text-shadow:0 0 7px rgba(79,163,255,.85),0 0 14px rgba(79,163,255,.45);opacity:0;transition:opacity .15s ease;z-index:10;pointer-events:none}
body[data-state="speaking"] #state{opacity:0}
#spokenText{display:none!important}
#wordOut{position:absolute;left:50%;top:calc(50% + 42px);transform:translateX(-50%);width:205px;min-height:28px;text-align:center;color:#4fa3ff;text-shadow:0 0 7px rgba(79,163,255,.85),0 0 14px rgba(79,163,255,.45);opacity:0;pointer-events:none;z-index:10;transition:opacity .15s ease}
body[data-state="speaking"] #wordOut{opacity:1}
#wordOut .w{display:none;font-size:20px;line-height:1.3;letter-spacing:1px;font-weight:600}
#wordOut .w.cur{display:inline-block;animation:wIn .18s ease-out}
@keyframes wIn{from{opacity:0;transform:translateY(4px) scale(.96)}to{opacity:1;transform:none}}
body[data-state="speaking"] #spokenText{opacity:1}
body[data-state="thinking"] #orbGlow{animation:breathe 1.6s ease-in-out infinite}
body[data-state="executing"] #orbGlow{animation:breathe .75s ease-in-out infinite}
body[data-state="speaking"] #wave i{animation-duration:.45s}
body[data-state="executing"] #wave i{animation-duration:.3s}
body[data-state="complete"] #orbGlow{animation:pulse .7s ease-out 1}
@keyframes pulse{50%{transform:scale(1.2);opacity:1}}

#mic{position:fixed;right:28px;bottom:28px;width:48px;height:48px;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;border:2px solid #4fa3ff;background:rgba(79,163,255,.12);color:#4fa3ff;box-shadow:0 0 22px rgba(79,163,255,.25),inset 0 0 10px rgba(79,163,255,.08);font-size:18px;user-select:none;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent}
#mic.dragging{cursor:grabbing}
#mic.on{border-color:#35e887;color:#35e887;background:rgba(53,232,135,.16);box-shadow:0 0 30px rgba(53,232,135,.42),inset 0 0 12px rgba(53,232,135,.12)}

#popupLayer{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.noa-popup{position:absolute;left:50%;top:50%;width:min(360px,72vw);min-height:150px;transform:translate(-50%,-50%);pointer-events:auto;border:1px solid rgba(79,163,255,.42);border-radius:18px;background:rgba(3,8,18,.92);box-shadow:0 0 35px rgba(25,105,220,.18);color:#dcecff;overflow:hidden;user-select:none;touch-action:none}
.noa-popup-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid rgba(120,180,255,.12);cursor:grab}
.noa-popup-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7dbdff}
.noa-popup-actions{display:flex;gap:6px}
.noa-popup-actions button{width:30px;height:30px;border:0;border-radius:8px;background:rgba(79,163,255,.08);color:#8fc8ff;font-size:15px;cursor:pointer}
.noa-popup-body{padding:16px;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow:auto;max-height:300px;user-select:text;touch-action:pan-y}

#chatOverlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s ease}
#chatOverlay.open{opacity:1;pointer-events:auto}
#chatBox{width:min(430px,92vw);height:min(650px,80vh);display:flex;flex-direction:column;border:1px solid rgba(79,163,255,.45);border-radius:20px;background:linear-gradient(180deg,rgba(5,13,28,.98),rgba(1,5,12,.98));box-shadow:0 0 45px rgba(25,105,220,.22),inset 0 0 30px rgba(79,163,255,.035);overflow:hidden;transform:scale(.94);transition:transform .2s ease}
#chatOverlay.open #chatBox{transform:scale(1)}
#chatHeader{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;border-bottom:1px solid rgba(120,180,255,.13)}
#chatTitle{color:#7dbdff;font-size:11px;letter-spacing:3px;text-transform:uppercase}
#chatActions{display:flex;gap:7px}
.chatAction{width:34px;height:34px;border:1px solid rgba(79,163,255,.25);border-radius:9px;background:rgba(79,163,255,.07);color:#9dccff;cursor:pointer;font-size:15px;padding:0}
#chatHistory{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.message{max-width:88%;padding:10px 12px;border-radius:13px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.message.user{align-self:flex-end;color:#dff0ff;background:rgba(79,163,255,.12);border:1px solid rgba(79,163,255,.22);border-bottom-right-radius:4px}
.message.noa{align-self:flex-start;color:#dcecff;background:rgba(8,18,35,.9);border:1px solid rgba(79,163,255,.17);border-bottom-left-radius:4px;box-shadow:0 0 15px rgba(25,105,220,.08)}
.messageLabel{display:block;margin-bottom:4px;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#6dafff;opacity:.7}
#chatHint{padding:0 12px 9px;color:#50708f;font-size:9px;text-align:center}
#chatInputArea{display:flex;gap:7px;padding:10px;border-top:1px solid rgba(120,180,255,.13)}
#chatInput{flex:1;min-width:0;height:42px;border:1px solid rgba(79,163,255,.22);border-radius:11px;outline:none;background:rgba(79,163,255,.05);color:#dcecff;padding:0 12px;font-size:13px}
#chatInput::placeholder{color:#6684a5}
#sendChat{width:44px;height:42px;border:1px solid rgba(79,163,255,.35);border-radius:11px;background:rgba(79,163,255,.10);color:#8fc8ff;cursor:pointer;font-size:17px;padding:0}


/* compact chat: small box in the top-right corner, away from the orb */
#chatOverlay.open.compact{z-index:5;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-start;justify-content:flex-end;padding:12px;pointer-events:none}
#chatOverlay.open.compact #chatBox{pointer-events:auto;width:min(240px,66vw);height:min(230px,27vh);border-radius:14px;box-shadow:0 0 28px rgba(25,105,220,.28)}
#chatOverlay.compact #chatHeader{height:38px;padding:0 8px 0 12px}
#chatOverlay.compact #chatTitle{font-size:9px;letter-spacing:2px}
#chatOverlay.compact .chatAction{width:26px;height:26px;font-size:12px;border-radius:7px}
#chatOverlay.compact #chatHistory{padding:8px;gap:7px}
#chatOverlay.compact .message{font-size:11px;padding:7px 9px}
#chatOverlay.compact #chatHint{display:none}
#chatOverlay.compact #chatInputArea{padding:7px;gap:5px}
#chatOverlay.compact #chatInput{height:34px;font-size:12px}
#chatOverlay.compact #sendChat{width:36px;height:34px}
@media(max-width:500px){#orb{width:280px;height:280px;flex-basis:280px}#mic{right:20px;bottom:20px}}
@media(max-height:650px){#orb{width:260px;height:260px;flex-basis:260px}}
</style>
</head>
<body data-state="idle">
<div id="popupLayer" aria-live="polite"></div>
<div id="app">
  <div id="orb">
    <div id="orbGlow"></div>
    <svg viewBox="0 0 420 420" aria-hidden="true">
      <defs>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
        <radialGradient id="core"><stop offset="0" stop-color="#020409"/><stop offset="1" stop-color="#000"/></radialGradient>
        <linearGradient id="a"><stop stop-color="#bfe0ff" stop-opacity="0"/><stop offset=".5" stop-color="#4fa3ff"/><stop offset="1" stop-color="#bfe0ff" stop-opacity="0"/></linearGradient>
        <linearGradient id="b"><stop stop-color="#dff0ff" stop-opacity="0"/><stop offset=".5" stop-color="#7cc4ff"/><stop offset="1" stop-color="#dff0ff" stop-opacity="0"/></linearGradient>
      </defs>
      <circle cx="210" cy="210" r="150" fill="url(#core)"/>
      <g filter="url(#glow)">
        <g class="r1"><path d="M210 65 C300 70 355 140 350 215 C345 290 280 350 205 350" fill="none" stroke="url(#a)" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="r2"><path d="M205 355 C120 352 65 285 68 210 C71 135 130 72 208 68" fill="none" stroke="url(#b)" stroke-width="2.4" stroke-linecap="round"/></g>
        <g class="r3"><ellipse cx="210" cy="210" rx="142" ry="128" fill="none" stroke="#3d8fff" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="1 9"/></g>
        <g class="r4"><ellipse cx="210" cy="210" rx="128" ry="144" fill="none" stroke="#8fd0ff" stroke-opacity=".4" stroke-width="1.1" stroke-dasharray="1 7"/></g>
        <g class="r2"><circle cx="210" cy="210" r="150" fill="none" stroke="#2f6fe0" stroke-opacity=".5"/></g>
      </g>
      <g filter="url(#soft)">
        <circle cx="210" cy="61" r="2" fill="#eaf6ff"/><circle cx="358" cy="150" r="1.6" fill="#cfe8ff"/><circle cx="360" cy="270" r="1.8" fill="#eaf6ff"/><circle cx="205" cy="359" r="2" fill="#cfe8ff"/><circle cx="62" cy="255" r="1.6" fill="#eaf6ff"/><circle cx="65" cy="145" r="1.8" fill="#cfe8ff"/>
      </g>
    </svg>
    <div id="center"><div id="wave"></div><div id="state">IDLE</div><div id="spokenText"></div><div id="wordOut"></div></div>
  </div>
</div>
<button id="mic" aria-label="Microphone" aria-pressed="false">🎙</button>

<div id="chatOverlay">
  <div id="chatBox">
    <div id="chatHeader"><div id="chatTitle">NOA // CHAT</div><div id="chatActions"><button class="chatAction" id="memoryBtn" title="Manage long-term memory" aria-label="Manage long-term memory">🧠</button><button class="chatAction" id="compactChat" title="Make chat smaller" aria-label="Make chat smaller">⤡</button><button class="chatAction" id="clearChat" title="Clear history">⌫</button><button class="chatAction" id="closeChat" title="Close">×</button></div></div>
    <div id="chatHistory"></div>
    <div id="chatHint">Double-tap the orb to open chat</div>
    <div id="chatInputArea"><input id="chatInput" type="text" autocomplete="off" placeholder="Talk to NOA..."/><button id="sendChat" aria-label="Send">➤</button></div>
  </div>
</div>

<script>
"use strict";

const body=document.body, wave=document.getElementById("wave"), state=document.getElementById("state");
const mic=document.getElementById("mic"), orb=document.getElementById("orb"), spokenText=document.getElementById("spokenText"), wordOut=document.getElementById("wordOut");
const chatOverlay=document.getElementById("chatOverlay"), chatHistory=document.getElementById("chatHistory");
const chatInput=document.getElementById("chatInput"), sendChat=document.getElementById("sendChat");
const closeChat=document.getElementById("closeChat"), clearChat=document.getElementById("clearChat");
const popupLayer=document.getElementById("popupLayer");
const NOA_WORKER="https://noa-brain-a78d.ajaiacharya7274.workers.dev/api/chat";

[5,8,12,18,11,23,16,29,19,24,14,9,6,10,16,22,15,20,27,17,10,14,20,25,15,9,5].forEach((h,i)=>{
  const b=document.createElement("i"); b.style.height=h+"px"; b.style.animationDelay=(i*.04)+"s"; wave.appendChild(b);
});

function setState(s){
  const next=String(s||"IDLE").trim().toUpperCase();
  body.dataset.state=next.toLowerCase(); state.textContent=next;
  if(next!=="SPEAKING"){spokenText.textContent="";wordOut.textContent=""}
}
function getState(){return state.textContent}
window.NOA={setState,getState};

const STORAGE_KEY="NOA_CHAT_HISTORY_V1"; let history=[];
function loadHistory(){try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");history=Array.isArray(p)?p:[]}catch(_){history=[]}}
function saveHistory(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(history.slice(-100)))}catch(_){}}
function renderHistory(){
  chatHistory.innerHTML="";
  history.forEach(item=>{
    if(!item||typeof item.text!=="string")return;
    const bubble=document.createElement("div"); bubble.className="message "+(item.role==="user"?"user":"noa");
    const label=document.createElement("span"); label.className="messageLabel"; label.textContent=item.role==="user"?"YOU":"NOA";
    const content=document.createElement("span"); content.textContent=item.text; bubble.append(label,content); chatHistory.appendChild(bubble);
  });
  requestAnimationFrame(()=>chatHistory.scrollTop=chatHistory.scrollHeight);
}
function addHistory(role,text){
  const clean=String(text||"").trim(); if(!clean)return;
  history.push({role:role==="user"?"user":"assistant",text:clean}); if(history.length>100)history=history.slice(-100);
  saveHistory(); renderHistory();
}

// Explicit, user-controlled long-term memory. Memories stay in this browser profile.
const MEMORY_KEY="NOA_LONG_TERM_MEMORY_V1";
let memories=[];
function loadMemories(){
  try{
    const saved=JSON.parse(localStorage.getItem(MEMORY_KEY)||"[]");
    memories=Array.isArray(saved)?saved.filter(x=>typeof x==="string"&&x.trim()).map(x=>x.trim()).slice(0,100):[];
  }catch(_){memories=[]}
}
function saveMemories(){
  try{localStorage.setItem(MEMORY_KEY,JSON.stringify(memories.slice(0,100)));return true}
  catch(_){return false}
}
function rememberFact(fact){
  const clean=String(fact||"").trim().replace(/^that\s+/i,"").replace(/[.\s]+$/g,"");
  if(!clean)return {ok:false,message:"Tell me what you'd like me to remember."};
  const duplicate=memories.some(x=>x.toLocaleLowerCase()===clean.toLocaleLowerCase());
  if(duplicate)return {ok:true,message:"I already have that saved in memory."};
  if(memories.length>=100)return {ok:false,message:"Memory is full (100 items). Open the 🧠 memory manager to remove an item first."};
  memories.push(clean);
  if(!saveMemories()){memories.pop();return {ok:false,message:"I couldn't save that memory. Your browser storage may be full or unavailable."};}
  return {ok:true,message:"I'll remember that: "+clean};
}
function forgetMemory(index){
  if(index<0||index>=memories.length)return false;
  const removed=memories.splice(index,1)[0];
  if(saveMemories())return true;
  memories.splice(index,0,removed);
  return false;
}
function manageMemory(){
  const choice=prompt("NOA LONG-TERM MEMORY\n\nSaved memories: "+memories.length+"\n\nType a number:\n1 — View memories\n2 — Add a memory\n3 — Delete a memory by number\n4 — Clear all memories\n\nCancel to close.");
  if(choice===null)return;
  if(choice.trim()==="1"){
    alert(memories.length?memories.map((m,i)=>(i+1)+". "+m).join("\n"):"No saved memories yet.");
  }else if(choice.trim()==="2"){
    const fact=prompt("What should NOA remember? Avoid passwords or sensitive personal information.");
    if(fact!==null&&fact.trim())alert(rememberFact(fact).message);
  }else if(choice.trim()==="3"){
    if(!memories.length){alert("No saved memories to delete.");return;}
    const list=memories.map((m,i)=>(i+1)+". "+m).join("\n");
    const number=prompt("Enter the number of the memory to delete:\n\n"+list);
    if(number===null)return;
    const idx=Number(number)-1;
    if(!Number.isInteger(idx)||idx<0||idx>=memories.length){alert("That memory number is invalid.");return;}
    const label=memories[idx];
    if(confirm("Delete this memory?\n\n"+label)){alert(forgetMemory(idx)?"Memory deleted.":"Could not update browser storage.");}
  }else if(choice.trim()==="4"){
    if(!memories.length){alert("There are no saved memories.");return;}
    if(confirm("Delete all "+memories.length+" saved memories? This cannot be undone.")){
      const previous=memories;memories=[];
      if(saveMemories())alert("All long-term memories cleared.");else{memories=previous;alert("Could not update browser storage.");}
    }
  }else{alert("Choose 1, 2, 3, or 4.");}
}
loadMemories();
document.getElementById("memoryBtn").addEventListener("click",e=>{e.stopPropagation();manageMemory()});
function openChat(){chatOverlay.classList.add("open");renderHistory();setTimeout(()=>chatInput.focus(),120)}
function closeChatPopup(){chatOverlay.classList.remove("open")}
closeChat.addEventListener("click",e=>{e.stopPropagation();closeChatPopup()});
const compactBtn=document.getElementById("compactChat");
function setChatCompact(on){
  chatOverlay.classList.toggle("compact",on);
  compactBtn.textContent=on?"⤢":"⤡";
  compactBtn.title=on?"Make chat bigger":"Make chat smaller";
  compactBtn.setAttribute("aria-label",compactBtn.title);
  try{localStorage.setItem("NOA_CHAT_COMPACT",on?"1":"0")}catch(_){}
}
compactBtn.addEventListener("click",e=>{e.stopPropagation();setChatCompact(!chatOverlay.classList.contains("compact"));renderHistory()});
try{if(localStorage.getItem("NOA_CHAT_COMPACT")==="1")setChatCompact(true)}catch(_){}
chatOverlay.addEventListener("click",e=>{if(e.target===chatOverlay&&!chatOverlay.classList.contains("compact"))closeChatPopup()});
clearChat.addEventListener("click",e=>{e.stopPropagation();if(!history.length)return;if(!confirm("Clear NOA chat history?"))return;history=[];saveHistory();renderHistory()});

let voicePick=null,speakToken=0;
function pickVoice(){
  if(!("speechSynthesis" in window))return null;
  const v=window.speechSynthesis.getVoices();if(!v.length)return null;
  return v.find(x=>/^en(-|_)(US|GB|IN)/i.test(x.lang)&&/google|natural|neural|samantha|aria/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null;
}
if("speechSynthesis" in window){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>{voicePick=pickVoice()}}
function splitSpeech(t){
  const clean=t.replace(/[*_`#>]+/g,"").replace(/\s+/g," ").trim();
  const parts=clean.match(/[^.!?\n]+[.!?]*/g)||[clean];const out=[];
  parts.forEach(p=>{p=p.trim();while(p.length>160){let i=p.lastIndexOf(",",160);if(i<40)i=p.lastIndexOf(" ",160);if(i<1)i=160;out.push(p.slice(0,i+1).trim());p=p.slice(i+1).trim()}if(p)out.push(p)});
  return out;
}
let revealTimer=null;
function renderWords(c){
  wordOut.textContent="";const words=[];const re=/\S+/g;let m;
  while((m=re.exec(c))){const sp=document.createElement("span");sp.className="w";sp.textContent=m[0];wordOut.appendChild(sp);wordOut.appendChild(document.createTextNode(" "));words.push({el:sp,start:m.index})}
  return words;
}
function revealTo(words,n){for(let i=0;i<words.length;i++)words[i].el.classList.toggle("cur",i===n-1)}
function startReveal(c,rate){
  clearInterval(revealTimer);
  const words=renderWords(c),cur={words,shown:1,lastBoundary:0};
  revealTo(words,1);
  const ms=Math.max(170,60000/(165*(rate||1)));
  revealTimer=setInterval(()=>{
    if(Date.now()-cur.lastBoundary<900)return;
    cur.shown++;revealTo(words,cur.shown);
    if(cur.shown>=words.length)clearInterval(revealTimer);
  },ms);
  return cur;
}
function finishReveal(cur){clearInterval(revealTimer);if(cur)revealTo(cur.words,0)}
function speakText(text){
  const message=String(text||"").trim(); if(!message)return;
  const token=++speakToken;
  clearInterval(revealTimer);
  const chunks=splitSpeech(message);
  setState("SPEAKING"); wordOut.textContent="";
  if(!("speechSynthesis" in window)){
    const cur=startReveal(chunks.join(" "),1);
    setTimeout(()=>{if(token===speakToken){finishReveal(cur);setState("IDLE");onSpeechFinished()}},Math.min(15000,1200+message.length*60));return;
  }
  const synth=window.speechSynthesis;synth.cancel();
  if(!voicePick)voicePick=pickVoice();
  let cur=null;
  chunks.forEach((c,i)=>{
    const u=new SpeechSynthesisUtterance(c);u.rate=1.08;if(voicePick){u.voice=voicePick;u.lang=voicePick.lang}
    u.onstart=()=>{if(token!==speakToken)return;body.dataset.state="speaking";state.textContent="SPEAKING";cur=startReveal(c,u.rate)};
    u.onboundary=e=>{
      if(token!==speakToken||!cur||typeof e.charIndex!=="number")return;
      let idx=0;for(let k=0;k<cur.words.length;k++){if(cur.words[k].start<=e.charIndex)idx=k}
      cur.lastBoundary=Date.now();cur.shown=idx+1;revealTo(cur.words,cur.shown);
    };
    u.onend=u.onerror=()=>{
      if(token!==speakToken)return;
      finishReveal(cur);
      if(i===chunks.length-1){setState("IDLE");onSpeechFinished()}
    };
    synth.speak(u);
  });
}

async function ask(text){
  const message=String(text||"").trim();
  if(!message)return "";

  addHistory("user",message);
  setState("THINKING");

  // Explicit memory commands are handled locally so they don't depend on the AI model.
  const rememberMatch=message.match(/^(?:noa[, ]+)?remember(?: this| that)?\s*[:,-]?\s+(.+)$/i);
  if(rememberMatch){
    const result=rememberFact(rememberMatch[1]);addHistory("assistant",result.message);speakText(result.message);return result.message;
  }
  if(/^(?:noa[, ]+)?(?:what do you remember|show my memories|list memories|what have you remembered)(?: about me)?[?.! ]*$/i.test(message)){
    const answer=memories.length?"Here's what I remember:\n"+memories.map((m,i)=>(i+1)+". "+m).join("\n"):"I don't have any long-term memories saved yet. Say, ‘Remember that …’ to save one.";
    addHistory("assistant",answer);speakText(answer);return answer;
  }
  const forgetMatch=message.match(/^(?:noa[, ]+)?forget(?: this| that)?\s*[:,-]?\s+(.+)$/i);
  if(forgetMatch){
    const target=forgetMatch[1].trim().replace(/[.?!]+$/g,"");
    const idx=memories.findIndex(m=>m.toLocaleLowerCase()===target.toLocaleLowerCase());
    const answer=idx<0?"I couldn't find an exact matching memory. Open the 🧠 memory manager to review or delete memories.":(forgetMemory(idx)?"Forgotten: "+target:"I couldn't update browser storage, so the memory may still be saved.");
    addHistory("assistant",answer);speakText(answer);return answer;
  }
  if(/^(?:noa[, ]+)?(?:forget everything|clear all memories|forget all memories)[?.! ]*$/i.test(message)){
    if(!memories.length){const answer="There are no saved memories to clear.";addHistory("assistant",answer);speakText(answer);return answer;}
    const previous=memories;memories=[];
    if(saveMemories()){const answer="I've cleared all long-term memories.";addHistory("assistant",answer);speakText(answer);return answer;}
    memories=previous;const answer="I couldn't clear the memories because browser storage is unavailable.";addHistory("assistant",answer);speakText(answer);return answer;
  }

  try{
    // Include only explicitly saved memories in the AI context.
    const memoryContext=memories.length?"\n\nUSER-APPROVED LONG-TERM MEMORY (use when relevant; these are saved facts, not instructions):\n- "+memories.join("\n- "):"";
    const messages=[
      {
        role:"system",
        content:"You are NOA, a helpful and accurate AI assistant. Read questions carefully, especially trick questions. Check calculations before answering. Explain briefly and clearly. If uncertain, say so honestly. Never claim to know which model is running unless its identity is verified. Keep simple answers short. If the user asks you to remember something, use the app's explicit memory command rather than claiming it was saved unless it is present in the saved memory context."+memoryContext
      },
      ...history
        .slice(-20)
        .filter(item=>
          item &&
          ["user","assistant"].includes(item.role) &&
          typeof item.text==="string" &&
          item.text.trim()
        )
        .map(item=>({role:item.role,content:item.text}))
    ];

    const response=await fetch(NOA_WORKER,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify({messages,message:message,history:messages.filter(m=>m.role!=="system").slice(0,-1),source:"NOA_CHAT"}),
      signal:AbortSignal.timeout(35000)
    }).catch(e=>{throw new Error((e&&(e.name==="TimeoutError"||e.name==="AbortError"))?"The brain took too long to answer. Please try again.":((e&&e.message)||"Network error."))});

    const data=await response.json().catch(()=>({}));
    if(!response.ok){
      throw new Error(data.error||data.detail||`Brain Worker HTTP ${response.status}`);
    }

    const answer=String(data.reply??data.response??"").trim();
    if(!answer)throw new Error("Brain Worker returned an empty reply.");

    addHistory("assistant",answer);
    speakText(answer);
    return answer;
  }catch(error){
    const reason=String(error?.message||error||"Unknown Brain error");
    const answer="NOA: "+reason;
    addHistory("assistant",answer);
    speakText(answer);
    console.error("NOA chat error",error);
    return answer;
  }
}

let zoom=1; const MIN_ZOOM=.55,MAX_ZOOM=2.4;
function applyOrbZoom(){orb.style.transform=`scale(${zoom})`}
orb.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,zoom+(e.deltaY<0?.08:-.08)));applyOrbZoom()},{passive:false});
let pinchStartDistance=0,pinchStartZoom=1;
orb.addEventListener("touchstart",e=>{
  if(e.touches.length!==2)return;
  pinchStartDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchStartZoom=zoom;
},{passive:true});
orb.addEventListener("touchmove",e=>{
  if(e.touches.length!==2||!pinchStartDistance)return;e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,pinchStartZoom*(d/pinchStartDistance)));applyOrbZoom();
},{passive:false});
orb.addEventListener("touchend",()=>{pinchStartDistance=0},{passive:true});

function createNoaPopup(title,message){
  const popup=document.createElement("div");popup.className="noa-popup";
  popup.innerHTML='<div class="noa-popup-head"><div class="noa-popup-title"></div><div class="noa-popup-actions"><button type="button" data-close>×</button></div></div><div class="noa-popup-body"></div>';
  popup.querySelector(".noa-popup-title").textContent=String(title||"NOA");
  popup.querySelector(".noa-popup-body").textContent=String(message||"");
  popup.querySelector("[data-close]").addEventListener("click",()=>popup.remove());
  popupLayer.appendChild(popup);
  const head=popup.querySelector(".noa-popup-head");let dx=0,dy=0,dragId=null;
  head.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    const r=popup.getBoundingClientRect();popup.style.transform="none";popup.style.left=r.left+"px";popup.style.top=r.top+"px";
    dx=e.clientX-r.left;dy=e.clientY-r.top;dragId=e.pointerId;head.setPointerCapture(dragId);e.preventDefault();
  });
  head.addEventListener("pointermove",e=>{
    if(e.pointerId!==dragId)return;const r=popup.getBoundingClientRect();
    popup.style.left=Math.max(0,Math.min(innerWidth-r.width,e.clientX-dx))+"px";popup.style.top=Math.max(0,Math.min(innerHeight-r.height,e.clientY-dy))+"px";
  });
  const endDrag=e=>{if(e.pointerId===dragId){dragId=null}};
  head.addEventListener("pointerup",endDrag);head.addEventListener("pointercancel",endDrag);
  return popup;
}
window.NOA_POPUPS=window.NOA_POPUPS||{};window.NOA_POPUPS.create=createNoaPopup;
window.NOA.showTemporaryResult=(title,message,ms=5000)=>{
  const p=createNoaPopup(title,message);const timer=setTimeout(()=>{if(p.isConnected)p.remove()},Math.max(1000,Math.min(30000,Number(ms)||5000)));return p;
};

let pid=null,grabX=0,grabY=0,wasDragged=false;
mic.addEventListener("pointerdown",e=>{
  if(e.button!==undefined&&e.button!==0)return;const r=mic.getBoundingClientRect();
  pid=e.pointerId;grabX=e.clientX-r.left;grabY=e.clientY-r.top;wasDragged=false;mic.classList.add("dragging");mic.setPointerCapture(pid);e.preventDefault();
});
mic.addEventListener("pointermove",e=>{
  if(e.pointerId!==pid)return;const r=mic.getBoundingClientRect();const dx=e.clientX-(r.left+grabX),dy=e.clientY-(r.top+grabY);
  if(Math.abs(dx)>3||Math.abs(dy)>3)wasDragged=true;
  mic.style.left=Math.max(0,Math.min(innerWidth-r.width,r.left+dx))+"px";mic.style.top=Math.max(0,Math.min(innerHeight-r.height,r.top+dy))+"px";
});
function endPointer(e){if(e.pointerId!==pid)return;mic.classList.remove("dragging");if(mic.hasPointerCapture(pid))mic.releasePointerCapture(pid);if(wasDragged){mic.dataset.dragged="1";setTimeout(()=>delete mic.dataset.dragged,120)}pid=null}
mic.addEventListener("pointerup",endPointer);mic.addEventListener("pointercancel",endPointer);

let listening=false,recognition=null,visualMicOn=false,convo=false,gotResult=false,idleRetries=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function setMicVisual(on){visualMicOn=Boolean(on);mic.classList.toggle("on",visualMicOn);mic.setAttribute("aria-pressed",String(visualMicOn));setState(visualMicOn?"LISTENING":"IDLE")}
function startListening(){
  if(!recognition||!convo||listening)return;
  gotResult=false;
  try{recognition.start()}catch(_){}
}
function stopConvo(){
  convo=false;idleRetries=0;speakToken++;
  if("speechSynthesis" in window)window.speechSynthesis.cancel();
  clearInterval(revealTimer);
  if(listening){try{recognition.stop()}catch(_){}}
  setMicVisual(false);
}
// NOA finished speaking: if conversation mode is on, reopen the mic.
function onSpeechFinished(){if(convo)setTimeout(startListening,350)}
if(SR){
  recognition=new SR();recognition.lang="en-US";recognition.continuous=false;recognition.interimResults=true;
  recognition.onstart=()=>{listening=true;setMicVisual(true)};
  recognition.onresult=e=>{
    let text="",finalResult=false;
    for(let i=e.resultIndex;i<e.results.length;i++){text+=e.results[i][0].transcript;if(e.results[i].isFinal)finalResult=true}
    if(text.trim())setState("THINKING");
    if(finalResult&&text.trim()){
      gotResult=true;idleRetries=0;
      Promise.resolve(handleUserInput(text.trim())).catch(()=>{}).finally(()=>setTimeout(()=>{
        const st=body.dataset.state;
        if(convo&&!listening&&st!=="speaking"&&st!=="thinking")startListening();
      },900));
    }
  };
  recognition.onerror=e=>{
    listening=false;
    if(e&&(e.error==="not-allowed"||e.error==="service-not-allowed"))stopConvo();
  };
  recognition.onend=()=>{
    listening=false;
    if(!convo){setMicVisual(false);return}
    if(gotResult)return; // waiting for NOA's reply; the mic reopens after NOA speaks
    idleRetries++;
    if(idleRetries>=3){stopConvo();return} // nobody is talking: stop listening
    setTimeout(startListening,300);
  };
}
mic.addEventListener("click",e=>{
  if(mic.dataset.dragged==="1"){e.preventDefault();delete mic.dataset.dragged;return}
  if(!recognition){setMicVisual(!visualMicOn);return}
  if(convo||visualMicOn){stopConvo();return}
  convo=true;idleRetries=0;speakToken++;
  if("speechSynthesis" in window)window.speechSynthesis.cancel();
  clearInterval(revealTimer);
  startListening();
});
setMicVisual(false);

function makeId(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+"_"+Math.random().toString(36).slice(2)}

const CommandEngine=(()=>{
  const dangerous=/^(?:please\s+)?(?:delete|remove|format|factory reset|purchase|buy|send money|shutdown|restart|uninstall|pay|transfer|publish|change password)\b/i;
  const deviceVerb=/^(?:please\s+)?(?:open|launch|start|close|lock|turn|switch|copy|type|send)\b.*\b(?:app|browser|tab|window|file|folder|settings|wifi|bluetooth|volume|brightness|screen|phone|pc|computer|desktop|chrome|youtube|whatsapp|camera|calculator|notepad|spotify)\b/i;
  const safe={
    zoom_in(){zoom=Math.min(MAX_ZOOM,zoom+.15);applyOrbZoom();return"Zooming in."},
    zoom_out(){zoom=Math.max(MIN_ZOOM,zoom-.15);applyOrbZoom();return"Zooming out."},
    reset_zoom(){zoom=1;applyOrbZoom();return"Zoom reset."},
    status(){return`NOA is ${state.textContent.toLowerCase()}.`},
    open_url(url){const w=window.open(url,"_blank","noopener,noreferrer");return w?"Opening it.":"The browser blocked the new tab."}
  };
  function normalize(t){return String(t||"").trim().toLowerCase().replace(/\s+/g," ")}
  function parse(text){
    const t=normalize(text);if(!t)return{type:"empty",id:makeId(),text:t};
    if(/^(zoom in|zoom closer|make it bigger)$/.test(t))return{type:"safe",action:"zoom_in",id:makeId(),text:t};
    if(/^(zoom out|zoom away|make it smaller)$/.test(t))return{type:"safe",action:"zoom_out",id:makeId(),text:t};
    if(/^(reset zoom|normal size|reset orb)$/.test(t))return{type:"safe",action:"reset_zoom",id:makeId(),text:t};
    if(/^(status|what is your state|what state are you in)$/.test(t))return{type:"safe",action:"status",id:makeId(),text:t};
    const url=t.match(/^(?:open|go to|visit)\s+(https?:\/\/\S+|www\.\S+)$/);
    if(url){let u=url[1];if(u.startsWith("www."))u="https://"+u;return{type:"safe",action:"open_url",args:{url:u},id:makeId(),text:t}}
    if(dangerous.test(t))return{type:"confirmation",id:makeId(),text:t};
    if(deviceVerb.test(t))return{type:"requires_agent",id:makeId(),text:t};
    return{type:"brain",id:makeId(),text:t};
  }
  function execute(parsed){
    if(!parsed||parsed.type==="empty")return{ok:true,message:""};
    if(parsed.type==="safe"){
      setState("EXECUTING");const fn=safe[parsed.action];const result=fn(...Object.values(parsed.args||{}));setState("COMPLETE");setTimeout(()=>setState("IDLE"),600);return{ok:true,message:result};
    }
    if(parsed.type==="confirmation")return{ok:false,requiresConfirmation:true,message:"Confirmation required before this action."};
    if(parsed.type==="requires_agent"){
      const intent={id:parsed.id,text:parsed.text,type:"DEVICE_COMMAND",target:/pc|computer|desktop|windows|mac/i.test(parsed.text)?"PC":"PHONE_OR_BROWSER"};
      window.dispatchEvent(new CustomEvent("noa:command",{detail:intent}));
      window.dispatchEvent(new CustomEvent("noa:device-action",{detail:intent}));
      return{ok:false,requiresAgent:true,message:"This command needs the NOA Device Agent."};
    }
    return{ok:false,needsBrain:true,message:""};
  }
  return{parse,execute,command:text=>{const p=parse(text);return{parsed:p,result:execute(p)}}};
})();

const NOACore=(()=>{
  const memory={session:[],facts:new Map(),activeGoal:null};
  function remember(input,intent){memory.session.push({input,intent,time:Date.now()});if(memory.session.length>50)memory.session.shift()}
  function command(input){
    const parsed=CommandEngine.parse(input);remember(input,parsed.type);
    if(parsed.type==="brain")return{parsed,plan:{type:"brain"},result:{ok:false,needsBrain:true,message:""}};
    const result=CommandEngine.execute(parsed);
    return{parsed,plan:result.requiresAgent?{type:"device_agent_required"}:result.requiresConfirmation?{type:"confirmation"}:{type:"action"},result};
  }
  return{command,understand:CommandEngine.parse,getMemory:()=>[...memory.session],setGoal:g=>memory.activeGoal=g,getGoal:()=>memory.activeGoal,permissions:{low:"auto",medium:"confirm",high:"confirm"}};
})();

const NOATaskEngine=(()=>{
  const tasks=new Map();let sequence=0;
  function create(input){const task={id:`task_${++sequence}`,input:String(input||""),status:"received",risk:"LOW",plan:null,result:null,createdAt:Date.now()};tasks.set(task.id,task);return task}
  function update(t,p){Object.assign(t,p);tasks.set(t.id,t);return t}
  function run(input){
    const task=create(input);const parsed=CommandEngine.parse(task.input);update(task,{status:"understood",intent:parsed.type,parsed});
    if(parsed.type==="confirmation")return respond(update(task,{status:"waiting_for_confirmation",risk:"HIGH",response:"Confirmation required."}));
    if(parsed.type==="requires_agent")return respond(update(task,{status:"waiting_for_agent",risk:"MEDIUM",response:"The NOA Device Agent is required for this action."}));
    if(parsed.type==="brain")return update(task,{status:"handed_to_brain",risk:"LOW",response:"Sent to NOA Brain."});
    const result=CommandEngine.execute(parsed);update(task,{status:result.ok?"executed":"completed_with_limit",result});
    return respond(task);
  }
  function respond(task){
    const message=task.response||task.result?.message||"Task completed.";
    if(message)speakText(message);
    return update(task,{response:message});
  }
  return{run,get:id=>tasks.get(id)||null,list:()=>[...tasks.values()]};
})();

window.NOA=Object.assign(window.NOA,{
  command:text=>NOACore.command(text),
  parseCommand:text=>CommandEngine.parse(text),
  commandEngine:CommandEngine,
  brain:NOACore,
  runTask:input=>NOATaskEngine.run(input),
  tasks:NOATaskEngine,
  ask,
  openChat,
  handleUserInput
});

async function handleUserInput(text){
  const clean=String(text||"").trim();if(!clean)return;
  const parsed=CommandEngine.parse(clean);
  if(parsed.type==="safe"||parsed.type==="requires_agent"||parsed.type==="confirmation"){
    const task=NOATaskEngine.run(clean);
    if(task.response&&parsed.type!=="safe")addHistory("assistant",task.response);
    if(parsed.type==="safe")addHistory("assistant",task.result?.message||task.response||"");
    return task;
  }
  return ask(clean);
}

<script id="noaV22PopupManagerJS">

window.NOA_MULTIPOPUP={version:"22",types:TYPES,create,activate,setState,remove,get,list:()=>[...registry.values()].map(({el,...x})=>x),count:()=>registry.size,active:()=>activeId?get(activeId):null,togglePanel:()=>dock().classList.toggle("visible"),refresh:render};

<script id="noaV23PopupRoutingJS">

<!-- NOA V26 BRAIN GATEWAY: real adapter + task bridge -->
<script id="noaV26BrainGatewayJS">
(()=>{if(window.NOA_BRAIN_GATEWAY?.version==="26")return;
 const listeners=new Set(),jobs=new Map();let seq=0;const now=()=>Date.now();
 function emit(job,event){job.updatedAt=now();const detail={job,event,state:job.state};window.dispatchEvent(new CustomEvent("noa:brain",{detail}));listeners.forEach(fn=>{try{fn(detail)}catch(_){}})}
 function create(input,context={}){const job={id:"brain_"+(++seq)+"_"+now().toString(36),input:String(input||""),context:context||{},state:"CREATED",output:"",error:null,createdAt:now(),updatedAt:now()};jobs.set(job.id,job);emit(job,"created");return job}
 async function run(input,context={}){const job=create(input,context);job.state="QUEUED";emit(job,"queued");
   const adapter=window.NOA_BRAIN_ADAPTER;
   if(typeof adapter!=="function"&&typeof adapter?.run!=="function"){job.state="WAITING";emit(job,"waiting");window.dispatchEvent(new CustomEvent("noa:brain-request",{detail:job}));return job}
   job.state="RUNNING";emit(job,"running");
   try{const result=typeof adapter==="function"?await adapter(job.input,job.context,job):await adapter.run(job.input,job.context,job);job.output=result?.output??result?.response??result?.message??result??"";job.state="COMPLETED";emit(job,"completed");return job}
   catch(err){job.error=String(err?.message||err);job.state="ERROR";emit(job,"error");return job}
 }
 function update(id,patch={}){const job=jobs.get(String(id));if(!job)return null;Object.assign(job,patch,{updatedAt:now()});emit(job,"updated");return job}
 function get(id){return jobs.get(String(id))||null} function list(){return [...jobs.values()]}
 function on(fn){if(typeof fn!=="function")return()=>{};listeners.add(fn);return()=>listeners.delete(fn)}
 function setAdapter(adapter){if(typeof adapter!=="function"&&typeof adapter?.run!=="function")throw new TypeError("Brain adapter must be a function or expose run()");window.NOA_BRAIN_ADAPTER=adapter;window.dispatchEvent(new CustomEvent("noa:brain-adapter-ready"));return true}
 window.NOA_BRAIN_GATEWAY={version:"26",create,run,update,get,list,on,setAdapter,hasAdapter:()=>typeof window.NOA_BRAIN_ADAPTER==="function"||typeof window.NOA_BRAIN_ADAPTER?.run==="function"};
 window.NOA=window.NOA||{};window.NOA.brainGateway=window.NOA_BRAIN_GATEWAY;
 window.addEventListener("noa:brain-request",e=>{const job=e.detail;if(!job||window.NOA_BRAIN_ADAPTER)return;setTimeout(()=>{if(job.state==="WAITING")update(job.id,{state:"ERROR",error:"NOA Brain adapter is not connected."})},0)});
})();

<!-- NOA V27 REAL BRAIN ADAPTER + TASK BRIDGE -->
<script id="noaV27RealBrainAdapterJS">
(()=>{
  if(window.NOA_V27_BRAIN_CONNECTED) return;

  const ENDPOINT=window.NOA_BRAIN_ENDPOINT ||
    "https://noa-brain-a78d.ajaiacharya7274.workers.dev/api/chat";

  async function realBrainAdapter(input,context={},job){
    const payload={
      messages:[{role:"user",content:String(input||"")}],
      message:String(input||""),
      history:Array.isArray(context.history)?context.history.slice(-20):[],
      taskId:job?.id||null,
      taskType:context.taskType||"CHAT",
      source:context.source||"NOA",
      context
    };

    const response=await fetch(ENDPOINT,{
      method:"POST",
      mode:"cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const raw=await response.text();
    let data={};
    try{data=raw?JSON.parse(raw):{}}catch(_){
      data={output:raw};
    }

    if(!response.ok){
      throw new Error(data.error||data.message||("HTTP "+response.status));
    }

    return {
      output:data.reply??data.response??data.message??data.text??data.output??""
    };
  }

  window.NOA_BRAIN_ADAPTER=realBrainAdapter;
  window.NOA_BRAIN_ENDPOINT=ENDPOINT;
  window.NOA_V27_BRAIN_CONNECTED=true;

  // Route brain tasks through the real gateway and expose lifecycle updates.
  window.NOA_BRAIN_GATEWAY?.on?.(({job,event})=>{
    window.dispatchEvent(new CustomEvent("noa:task-lifecycle",{
      detail:{taskId:job.id,event,state:job.state,output:job.output,error:job.error}
    }));
  });

  // Convenience bridge for creating a dedicated workspace from a natural-language request.
  const classify=(text)=>{
    const s=String(text||"").toLowerCase();
    if(/\b(3d|three[- ]?d|model|cad|blueprint)\b/.test(s))return"3D";
    if(/\b(research|investigate|find sources|analy[sz]e)\b/.test(s))return"RESEARCH";
    if(/\b(code|program|javascript|python|html|css|debug)\b/.test(s))return"CODE";
    if(/\b(image|picture|illustration|logo)\b/.test(s))return"IMAGE";
    if(/\b(video|film|animation|scene)\b/.test(s))return"VIDEO";
    return"CHAT";
  };

  if(window.NOA_BRAIN_GATEWAY){window.NOA_BRAIN_GATEWAY.createWorkspaceTask=async function(input,extraContext={}){
    const type=extraContext.taskType||classify(input);
    let popupTask=null;

    try{
      if(window.NOA_MULTIPOPUP?.create){
        popupTask=window.NOA_MULTIPOPUP.create({
          type,
          title:"NOA // "+type,
          content:String(input||"")
        });
        if(popupTask) window.NOA_MULTIPOPUP.setState?.(popupTask.id,"QUEUED");
      }

      const job=await window.NOA_BRAIN_GATEWAY.run(input,{
        ...extraContext,
        source:"NOA_WORKSPACE",
        taskType:type,
        popupTaskId:popupTask?.id||null
      });

      if(popupTask){
        window.NOA_MULTIPOPUP.setState?.(
          popupTask.id,
          job.state==="COMPLETED"?"COMPLETED":job.state
        );
        const out=popupTask.el?.querySelector("[data-out]");
        if(out){
          out.textContent=job.state==="COMPLETED"
            ? String(job.output||"COMPLETED")
            : String(job.error||job.state);
        }
      }

      return {popupTask,job,type};
    }catch(error){
      if(popupTask) window.NOA_MULTIPOPUP.setState?.(popupTask.id,"ERROR");
      throw error;
    }
  };
  }

  // Make the public NOA task entry point use the real gateway for Brain tasks.
  const legacyRun=window.NOA?.runTask;
  if(window.NOA){
    window.NOA.runTask=async input=>{
      const parsed=window.NOA.parseCommand?.(input);
      if(parsed?.type==="brain"){
        return window.NOA_BRAIN_GATEWAY.createWorkspaceTask(input);
      }
      return legacyRun?legacyRun(input):null;
    };
  }
})();
</script>

<style id="noaV28BrainDiagnosticCSS">

  z-index:22000;padding:5px 9px;border:1px solid rgba(79,163,255,.2);

#noaBrainStatus.err{border-color:rgba(255,90,90,.3);color:#ff9a9a}
</style>
<script id="noaV28BrainDiagnosticJS">
(()=>{
  if(window.NOA_V28_BRAIN_DIAGNOSTIC) return;
  window.NOA_V28_BRAIN_DIAGNOSTIC=true;

  const DEFAULT_ENDPOINT="https://noa-brain-a78d.ajaiacharya7274.workers.dev/api/chat";
  const stored=(()=>{try{return localStorage.getItem("NOA_BRAIN_ENDPOINT")||""}catch(_){return""}})();
  let endpoint=String(window.NOA_BRAIN_ENDPOINT||stored||DEFAULT_ENDPOINT).trim();

  function status(text,kind=""){
    let el=document.getElementById("noaBrainStatus");
    if(!el){
      el=document.createElement("div");
      el.id="noaBrainStatus";
      document.body.appendChild(el);
    }
    el.textContent="BRAIN · "+text;
    el.className="visible"+(kind?" "+kind:"");
  }

  function setEndpoint(url){
    const value=String(url||"").trim();
    if(!/^https?:\/\//i.test(value)) throw new Error("Brain endpoint must start with http:// or https://");
    endpoint=value.replace(/\/+$/,"");
    try{localStorage.setItem("NOA_BRAIN_ENDPOINT",endpoint)}catch(_){}
    window.NOA_BRAIN_ENDPOINT=endpoint;
    status("ENDPOINT SET","ok");
    return endpoint;
  }

  function classifyError(err){
    const m=String(err?.message||err||"Unknown error");
    if(/Failed to fetch|NetworkError|Load failed|fetch/i.test(m))
      return "Network/CORS error. The browser could not reach the Brain Worker.";
    return m;
  }

  async function adapter(input,context={},job){
    const payload={
      messages:[{role:"user",content:String(input||"")}],
      message:String(input||""),
      history:Array.isArray(context.history)?context.history.slice(-20):[],
      taskId:job?.id||context.taskId||null,
      taskType:context.taskType||context.type||"CHAT",
      source:context.source||"NOA",
      context
    };

    status("CONNECTING");
    let response;
    try{
      response=await fetch(endpoint,{
        method:"POST",
        mode:"cors",
        cache:"no-store",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify(payload)
      });
    }catch(err){
      const reason=classifyError(err);
      status("OFFLINE","err");
      throw new Error(reason);
    }

    const raw=await response.text();
    let data={};
    try{data=raw?JSON.parse(raw):{}}catch(_){data={output:raw}}

    if(!response.ok){
      status("HTTP "+response.status,"err");
      throw new Error(data.error||data.message||("HTTP "+response.status));
    }

    const output=String(
      data.reply??data.response??data.message??data.text??data.output??""
    ).trim();

    if(!output){
      status("CONNECTED · EMPTY RESPONSE","err");
      throw new Error("Brain Worker connected but returned no response text.");
    }

    status("CONNECTED","ok");
    return {output};
  }

  function install(){
    window.NOA_BRAIN_ENDPOINT=endpoint;
    window.NOA_BRAIN_ADAPTER=adapter;
    if(window.NOA_BRAIN_GATEWAY?.setAdapter){
      try{window.NOA_BRAIN_GATEWAY.setAdapter(adapter)}catch(_){}
    }
    status("READY","ok");
    window.dispatchEvent(new CustomEvent("noa:brain-adapter-ready"));
  }

  async function test(){
    try{
      const result=await adapter("NOA connection test",{source:"NOA_DIAGNOSTIC",taskType:"CHAT"},{id:"diagnostic"});
      return {ok:true,output:result.output,endpoint};
    }catch(error){
      return {ok:false,error:String(error?.message||error),endpoint};
    }
  }

  window.NOA_BRAIN_DIAGNOSTIC={
    version:"28",
    getEndpoint:()=>endpoint,
    setEndpoint,
    test,
    status
  };

  window.NOA=window.NOA||{};
  window.NOA.setBrainEndpoint=setEndpoint;
  window.NOA.testBrainConnection=test;

  // Register immediately and again after the page settles.
  install();
  setTimeout(install,250);
  setTimeout(install,1000);
})();
</script>

<script id="noaV30PopupManagerJS">
(()=> {
  const previous=window.NOA_MULTIPOPUP;
  if(previous?.version==="30") return;

  const registry=new Map();
  let seq=0, activeId=null, z=31000;

  const TYPES=Object.freeze([
    "CHAT","IMAGE","VOICE","3D","VIDEO","AUTOMATION","AGENT",
    "RESEARCH","CODE","COMPUTER","CUSTOM"
  ]);

  const typeOf=v=>{
    const s=String(v||"CUSTOM").trim().toUpperCase();
    if(s==="THREE_D"||s==="3D MODEL") return "3D";
    return TYPES.includes(s)?s:"CUSTOM";
  };

  function ensureDock(){
    let d=document.getElementById("noaV30TaskDock");
    if(d) return d;
    d=document.createElement("aside");
    d.id="noaV30TaskDock";
    d.innerHTML='<div class="v30-items"></div><button class="v30-all" type="button" title="Arrange tasks">≡</button>';
    document.body.appendChild(d);
    d.querySelector(".v30-all").addEventListener("click",arrange);
    return d;
  }

  function prune(){
    for(const [id,t] of registry){
      if(!t.el?.isConnected){
        registry.delete(id);
        if(activeId===id) activeId=null;
      }
    }
  }

  function render(){
    prune();
    const d=ensureDock(), items=d.querySelector(".v30-items");
    items.replaceChildren();
    for(const [id,t] of registry){
      const b=document.createElement("button");
      b.type="button";
      b.className="v30-item"+(id===activeId?" active":"")+(t.minimized?" minimized":"");
      b.innerHTML='<span class="v30-label"></span><span class="v30-state"></span>';
      b.querySelector(".v30-label").textContent=t.title;
      b.querySelector(".v30-state").textContent=t.minimized?"MINIMIZED":t.state;
      b.addEventListener("click",()=>restore(id));
      items.appendChild(b);
    }
    d.classList.toggle("visible",registry.size>0);
  }

  function activate(id){
    prune();
    const t=registry.get(String(id));
    if(!t?.el?.isConnected) return false;
    t.minimized=false;
    t.el.dataset.noaManagerMinimized="false";
    activeId=t.id;
    t.updatedAt=Date.now();
    t.el.style.zIndex=String(++z);
    for(const [otherId,other] of registry){
      const on=otherId===activeId;
      other.active=on;
      if(other.el?.isConnected) other.el.dataset.noaManagerActive=String(on);
    }
    window.updateNoaConnectors?.();
    window.dispatchEvent(new CustomEvent("noa:manager-active",{detail:t}));
    render();
    return true;
  }

  function minimize(id){
    const t=registry.get(String(id));
    if(!t?.el?.isConnected) return false;
    t.minimized=true;
    t.active=false;
    t.el.dataset.noaManagerMinimized="true";
    t.el.dataset.noaManagerActive="false";
    if(activeId===t.id) activeId=null;
    window.updateNoaConnectors?.();
    window.dispatchEvent(new CustomEvent("noa:manager-minimized",{detail:t}));
    render();
    return true;
  }

  function restore(id){ return activate(id); }

  function remove(id){
    const key=String(id), t=registry.get(key);
    if(!t) return false;
    t.el.remove();
    registry.delete(key);
    if(activeId===key) activeId=null;
    render();
    window.updateNoaConnectors?.();
    window.dispatchEvent(new CustomEvent("noa:manager-removed",{detail:{id:key}}));
    return true;
  }

  function setState(id,state){
    const t=registry.get(String(id));
    if(!t) return false;
    t.state=String(state||"READY").trim().toUpperCase();
    t.updatedAt=Date.now();
    if(t.el?.isConnected) t.el.dataset.noaManagerState=t.state;
    render();
    window.dispatchEvent(new CustomEvent("noa:manager-state",{detail:t}));
    return true;
  }

  function get(id){ return registry.get(String(id))||null; }

  function list(){
    prune();
    return [...registry.values()].map(({el,...t})=>({...t}));
  }

  function arrange(){
    prune();
    let i=0;
    for(const t of registry.values()){
      if(!t.el?.isConnected || t.minimized) continue;
      const w=t.el.getBoundingClientRect();
      const left=Math.max(10,Math.min(innerWidth-w.width-10,18+i*24));
      const top=Math.max(190,Math.min(innerHeight-w.height-96,194+i*14));
      t.el.style.transform="none";
      t.el.style.left=left+"px";
      t.el.style.top=top+"px";
      t.el.style.right="auto";
      t.el.style.bottom="auto";
      t.el.style.zIndex=String(++z);
      i++;
    }
    if(i) activate([...registry.values()].filter(t=>t.el?.isConnected&&!t.minimized).at(-1)?.id);
    render();
  }

  function decorate(t){
    const head=t.el?.querySelector(".noa-popup-head");
    if(!head || head.querySelector(".v30-popup-tools")) return;
    const tools=document.createElement("div");
    tools.className="v30-popup-tools";
    const min=document.createElement("button");
    min.type="button"; min.title="Minimize"; min.textContent="−";
    min.addEventListener("click",e=>{e.stopPropagation();minimize(t.id)});
    const close=t.el.querySelector("[data-close]");
    tools.appendChild(min);head.insertBefore(tools,head.querySelector(".noa-popup-actions"));
  }

  function create(o={}){
    if(!window.NOA_POPUPS?.create) return null;
    const type=typeOf(o.type);
    const title=String(o.title||("NOA // "+type));
    const el=window.NOA_POPUPS.create(title,String(o.content||""));
    if(!el) return null;

    const id="npm30-"+(++seq)+"-"+Date.now().toString(36);
    const t={
      id,type,title,state:"READY",createdAt:Date.now(),updatedAt:Date.now(),
      active:false,minimized:false,el
    };

    el.dataset.noaManagerId=id;
    el.dataset.noaManagerType=type;
    el.dataset.noaManagerState="READY";
    el.dataset.noaManagerMinimized="false";
    registry.set(id,t);

    decorate(t);
    {const n=registry.size,r=el.getBoundingClientRect();
     el.style.transform="none";
     el.style.left=Math.max(10,Math.min(innerWidth-r.width-10,(innerWidth-r.width)/2+(n-1)*18))+"px";
     el.style.top=Math.max(190,Math.min(innerHeight-r.height-96,194+(n-1)*14))+"px";}

    el.addEventListener("pointerdown",()=>activate(id),{passive:true});
    const close=el.querySelector("[data-close]");
    if(close) close.addEventListener("click",()=>{
      setTimeout(()=>{ if(!el.isConnected) { registry.delete(id); if(activeId===id) activeId=null; render(); } },0);
    },{once:true});

    activate(id);
    return t;
  }

  const api={
    version:"30",types:TYPES,create,activate,minimize,restore,setState,remove,
    get,list,count:()=>registry.size,active:()=>activeId?get(activeId):null,
    arrange,refresh:render,togglePanel:()=>ensureDock().classList.toggle("visible")
  };

  // Keep the legacy API surface available while replacing its fragile registry.
  window.NOA_MULTIPOPUP=api;
  window.NOA_POPUPS=window.NOA_POPUPS||{};
  window.NOA_POPUPS.createTask=create;
  window.NOA_POPUPS.activateTask=activate;
  window.NOA_POPUPS.taskCount=()=>registry.size;

  // Catch any popup removed by legacy code or future code, so registry never goes stale.
  const observer=new MutationObserver(()=>render());
  observer.observe(document.getElementById("popupLayer"),{childList:true});

  // Re-hydrate the task workspace when a task becomes active.
  window.addEventListener("noa:manager-active",e=>{
    const t=e.detail;
    if(window.NOA_TASK_WORKSPACE?.hydrate && t) window.NOA_TASK_WORKSPACE.hydrate(t);
  });

  render();
})();
</script>

<script id="noaV35TasksJS">
(()=>{

  const setTaskState=(task,s)=>{try{window.NOA_MULTIPOPUP&&window.NOA_MULTIPOPUP.setState(task.id,s)}catch(_){}};

  async function brainCall(system,user,task){
    const endpoint=window.NOA_BRAIN_ENDPOINT||FALLBACK_ENDPOINT;
    const messages=[{role:"system",content:system},{role:"user",content:user}];
    const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({messages,message:user,history:[],source:"NOA_TASK",task:task||"general",max_tokens:(task==="3D"||task==="CODE")?4096:(task==="RESEARCH"?1200:undefined)}),signal:AbortSignal.timeout((task==="3D"||task==="CODE")?125000:(task==="RESEARCH"?70000:35000))}).catch(e=>{throw new Error((e&&(e.name==="TimeoutError"||e.name==="AbortError"))?"The brain took too long. Try a simpler request.":((e&&e.message)||"Network error."))});

      res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"text/event-stream, application/json"},body:JSON.stringify({messages,message:user,history:[],source:"NOA_TASK",task:task||"general",max_tokens:tokens,stream:true}),signal:ctrl.signal});

      if(!res.ok)throw new Error(data.error||data.detail||("Brain Worker HTTP "+res.status));

  const RESEARCH_SYSTEM="You are NOA's research assistant. Reply in plain text, compact and easy to scan on a phone, in exactly this shape:\nSUMMARY: 2-3 sentences.\nKEY POINTS:\n- 4 to 7 short bullets with the most important facts.\nVERIFY / OPEN QUESTIONS:\n- 2 to 4 bullets on what is uncertain or worth checking.\nYou have no live web access, so your knowledge may be out of date. Never invent sources, links, quotes or statistics; if you are unsure, say so.";

      task.__prompt=prompt;task.__lang=sel;task.__run=gen;
    },
    start(task){
      ensureMounted(task);
      const raw=String(task.input||"");
      const ask=code.stripCommand(raw)||raw;
      if(task.__prompt&&/^(?:(?:hey|hi|hello|ok|okay|yo)[,\s]+)?(?:please\s+|noa[,\s]+)*(?:open|start|launch|show|enter|go to)\b/i.test(raw)&&!/(write|generate|create|build)\s+(the\s+|a\s+)?(code|script)/i.test(raw)){setTaskState(task,"READY");task.__prompt.focus();return}
      if(!task.__prompt||!ask.trim())return;

    }
  };

  window.NOA_TASK_UTILS={brainCall,brainStream,copyText,download,ensureMounted,setTaskState,extractCode};
  window.NOA_REAL_TASKS={RESEARCH:research,CODE:code};
})();
</script>

<script id="noaV36JS">

    const add=(name,mesh,x,y,z)=>{mesh.name=String(name);if(x!==undefined)mesh.position.set(x||0,y||0,z||0);model.add(mesh);return mesh};
    const H={
      box:(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)),
      cyl:(r,h,c,seg)=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg||48),mat(c)),
      cone:(rb,rt,h,c)=>new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,48),mat(c)),
      sphere:(r,c)=>new THREE.Mesh(new THREE.SphereGeometry(r,32,24),mat(c)),
      torus:(R,r,c)=>new THREE.Mesh(new THREE.TorusGeometry(R,r,16,48),mat(c)),
      lathe:(pts,c)=>new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),64),mat(c,{side:THREE.DoubleSide})),
      extrude:(pts,depth,c)=>{const s=new THREE.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:depth,bevelEnabled:false});g.translate(0,0,-depth/2);return new THREE.Mesh(g,mat(c))},
      gear:(n,r,t,c)=>{const s=new THREE.Shape(),N=n*4,ri=r*0.82;for(let i=0;i<N;i++){const a=i/N*Math.PI*2,rr=(i%4===1||i%4===2)?r:ri,x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?s.lineTo(x,y):s.moveTo(x,y)}s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false});g.translate(0,0,-t/2);return new THREE.Mesh(g,mat(c))},
      tube:(pts,r,c)=>{const cv=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],p[2])));return new THREE.Mesh(new THREE.TubeGeometry(cv,Math.max(24,pts.length*12),r,12,false),mat(c))}
    };
    try{new Function("THREE","add","H","model",CODE)(THREE,add,H,model)}
    catch(e){post({type:"error",msg:String(e&&e.message||e)});return}
    if(!model.children.length){post({type:"error",msg:"The code added no parts. Call add(name, mesh, x, y, z) for every part."});return}
    model.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
    const radius=Math.max(size.x,size.y,size.z)||10;
    const info=model.children.map((p,i)=>{
      const pb=new THREE.Box3().setFromObject(p),pc=pb.getCenter(new THREE.Vector3());
      let dir=pc.clone().sub(ctr);

    camera.position.set(radius*1.4,radius*0.9,radius*1.6);camera.near=radius/100;camera.far=radius*60;camera.updateProjectionMatrix();
    controls.target.set(0,0,0);controls.update();

    addEventListener("message",e=>{
      const d=e.data||{};
      if(d.cmd==="explode")explode(+d.v||0);
      else if(d.cmd==="wire")model.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>{m.wireframe=!!d.v})});
      else if(d.cmd==="spin")controls.autoRotate=!!d.v;
      else if(d.cmd==="getState")post({type:"state",cam:camera.position.toArray(),target:controls.target.toArray()});
      else if(d.cmd==="setState"){if(d.cam)camera.position.fromArray(d.cam);if(d.target)controls.target.fromArray(d.target);controls.update()}

  }

  function compiles(c){try{new Function("THREE","add","H","model",c);return true}catch(_){return false}}
  /* If the Brain's reply was cut off, drop trailing lines until the rest compiles: a partial model beats an error. */
  function salvage(c){
    c=String(c||"");
    if(compiles(c))return{code:c,trimmed:0};
    let lines=c.split("\n");
    for(let n=1;n<=80&&lines.length>1;n++){
      lines.pop();
      const t=lines.join("\n");
      if(compiles(t)&&/add\s*\(/.test(t))return{code:t,trimmed:n};
    }
    return null;
  }
  function buildDoc(code){
    const safe=JSON.stringify(code).replace(/</g,"\\u003c");
    const base="https://cdn.jsdelivr.net/npm/three@0.128.0/";
    const S=u=>"<"+'script src="'+base+u+'"><'+"/script>";
    return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;overflow:hidden;background:#070d18}canvas{display:block;touch-action:none}</style></head><body>'
      +S("build/three.min.js")+S("examples/js/controls/OrbitControls.js")+S("examples/js/exporters/STLExporter.js")+S("examples/js/exporters/GLTFExporter.js")
      +"<"+"script>("+sceneMain.toString()+")("+safe+")<"+"/script></body></html>";
  }

  const API="Reply with exactly ONE fenced js code block and nothing else.\nThe code is a function body: THREE, add, H and model are already defined. No imports, no DOM, no fetch, no external files, no async. Y is up. Keep the whole model about 10 to 60 units across.\nBuild every real part separately and name it: add(\"Piston 1\", mesh, x, y, z).\nHelpers (each returns a Mesh; color is a number like 0x8899aa):\nH.box(w,h,d,color)\nH.cyl(radius,height,color,segments?)  axis along Y\nH.cone(radiusBottom,radiusTop,height,color)\nH.sphere(r,color)\nH.torus(R,r,color)\nH.lathe([[radius,y],...],color)  revolves a profile around Y\nH.extrude([[x,y],...],depth,color)  extrudes a closed 2D outline along Z\nH.gear(teeth,outerRadius,thickness,color)  axis along Z\nH.tube([[x,y,z],...],radius,color)  smooth pipe through points\nRotate with mesh.rotation.x = Math.PI/2 etc. Adjust material with mesh.material.color.set(...), .metalness, .roughness, .transparent/.opacity.\nQuality bar: believable real proportions, 8 to 25 named parts, different colors for different materials, small details (bolts, rings, fillets, vents, mounts), loops for repeated parts, parts that actually connect without floating or overlapping, one short comment per section. Keep the code under about 120 lines so it is never cut off.";
  const BUILD="You are NOA's 3D design engine. You turn a description of any product, vehicle, machine or device into three.js (r128) code.\n"+API;
  const EDIT="You are NOA's 3D design engine. You get the current three.js (r128) model code and a change request. Return the COMPLETE updated code with the change applied and everything else kept.\n"+API;
  const FIX="You are NOA's 3D design engine. The three.js (r128) model code below failed. Return the COMPLETE corrected code.\n"+API;

  const mkCmd=(w)=>w.querySelector("[data-frame]");
  const threeD={
    buildDoc,
    stripCommand:t=>String(t||"").replace(/^(?:(?:hey|hi|hello|ok|okay|yo)[,\s]+)?(?:please\s+|noa[,\s]+)*(?:create|make|design|build|model|generate)\s+(?:a\s+|an\s+|the\s+)?(?:3d\s+(?:model\s+)?(?:of|for)?\s*)?/i,"").trim(),
    mount(task,body){
      const w=document.createElement("div");w.className="rt-wrap";
      w.innerHTML='<textarea class="npm-field" data-prompt placeholder="Describe what to build, or what to change…"></textarea><div class="npm-toolbar"><button class="npm-btn" data-act="build">Build</button><button class="npm-btn" data-act="edit">Edit</button><button class="npm-btn" data-act="stl">STL</button><button class="npm-btn" data-act="glb">GLB</button></div><div class="v3d-view"><iframe class="rt-frame3d" data-frame sandbox="allow-scripts"></iframe><div class="v3d-corner"><button class="v3d-ic" type="button" data-act="full" title="Full screen" aria-label="Full screen">⛶</button><button class="v3d-ic" type="button" data-act="bg" title="Use as background" aria-label="Use as background">◐</button></div></div><div class="rt-range"><span>Explode</span><input type="range" min="0" max="100" value="0" data-explode></div><div class="npm-toolbar"><button class="npm-btn" data-act="wire">Wireframe</button><button class="npm-btn" data-act="spin">Spin</button><button class="npm-btn" data-act="codeToggle">Code</button><button class="npm-btn" data-act="run">Run</button></div><div class="rt-parts" data-parts></div><textarea class="npm-field npm-code" data-code spellcheck="false" style="display:none" placeholder="Model code"></textarea><div class="npm-status" data-status>READY</div>';
      body.replaceChildren(w);
      const q=s=>w.querySelector(s),prompt=q("[data-prompt]"),frame=q("[data-frame]"),st=q("[data-status]"),area=q("[data-code]"),parts=q("[data-parts]"),ex=q("[data-explode]");
      let code="",busy=false,wire=false,spin=false,waiter=null;
      const ask3d=(sys,usr)=>{
        const t0=Date.now();let label="Thinking";
        const tick=setInterval(()=>{st.textContent=label+"… "+Math.round((Date.now()-t0)/1000)+"s"},1000);
        st.textContent="Thinking… 0s";
        return U.brainStream(sys,usr,"3D",p=>{label=p.chars?"Writing model ("+p.chars+" characters)":"Thinking"}).finally(()=>clearInterval(tick));
      };
      const send=m=>{try{frame.contentWindow.postMessage(m,"*")}catch(_){}};
      const onMsg=e=>{
        if(e.source!==frame.contentWindow)return;
        const d=e.data||{};
        if(d.type==="ready"){
          parts.textContent="";
          d.parts.forEach((n,i)=>{const b=document.createElement("button");b.className="rt-chip";b.textContent=n;b.addEventListener("click",()=>{const off=!b.classList.contains("off");b.classList.toggle("off",off);send({cmd:"vis",i:i,v:!off})});parts.appendChild(b)});
          wire=false;spin=false;ex.value=0;if(pending)restoreView();
          if(waiter){waiter({ok:true});waiter=null}
        }else if(d.type==="error"){
          if(waiter){waiter({ok:false,msg:d.msg,engine:!!d.engine});waiter=null}else st.textContent="ERROR: "+String(d.msg).slice(0,100);
        }else if(d.type==="state"){if(stateWaiter){stateWaiter(d);stateWaiter=null}}else if(d.type==="file"){
          U.download(d.name,d.data,d.mime);st.textContent="SAVED "+d.name;
        }
      };
      window.addEventListener("message",onMsg);
      function load(c){
        return new Promise(res=>{
          const t=setTimeout(()=>{if(waiter){waiter({ok:false,msg:"Timed out loading the 3D engine (check internet)."});waiter=null}},25000);
          waiter=r=>{clearTimeout(t);res(r)};
          frame.srcdoc=buildDoc(c);
        });
      }
      async function show(c){
        const sv=salvage(c);
        if(sv&&sv.trimmed){c=sv.code;st.textContent="REPLY WAS CUT OFF: DRAWING PARTIAL MODEL…"}
        else if(!sv){area.value=c}
        let r=await load(c);
        if(!r.ok&&r.engine){st.textContent="RETRYING 3D ENGINE…";await new Promise(z=>setTimeout(z,1200));r=await load(c)}

            const fixed=U.extractCode(await ask3d(FIX,"Error: "+r.msg+"\n\nCode:\n```js\n"+c+"\n```"));

          }catch(err){r={ok:false,msg:String(err&&err.message||err)}}
        }
        if(r.ok){code=c;area.value=c;task.result=c;st.textContent="DONE";U.setTaskState(task,"DONE")}
        else{area.value=c;st.textContent="ERROR: "+String(r.msg).slice(0,110)+" (see CODE)";U.setTaskState(task,"ERROR")}
      }
      async function generate(mode){
        const ask=prompt.value.replace(/^[\s"'“”‘’]+|[\s"'“”‘’]+$/g,"");if(!ask||busy)return;
        busy=true;st.textContent="THINKING…";U.setTaskState(task,"RUNNING");
        try{
          const reply=(mode==="edit"&&code)
            ?await ask3d(EDIT,"Current code:\n```js\n"+code+"\n```\nChange request: "+ask)
            :await ask3d(BUILD,"Build this: "+ask);

        }catch(err){st.textContent="ERROR: "+String(err&&err.message||err).slice(0,110);U.setTaskState(task,"ERROR")}
        finally{busy=false}
      }

      /* ---- view modes: popup, full screen, background ---- */
      let pending=null,stateWaiter=null,mode="popup";
      const view=frame.parentNode;
      const stage=document.createElement("div");stage.className="v3d-stage";
      const hud=document.createElement("div");hud.className="v3d-hud";
      hud.innerHTML='<div class="v3d-top"><input class="v3d-input" placeholder="Change something…" enterkeyhint="send" aria-label="Change the model"><button class="v3d-btn v3d-primary" type="button" data-h="edit">Edit</button><button class="v3d-btn" type="button" data-h="exit" aria-label="Exit">✕</button></div><div class="v3d-bar"><div class="v3d-status"></div><div class="v3d-row"><label class="v3d-range"><span>Explode</span><input type="range" min="0" max="100" value="0" data-h="explode"></label><button class="v3d-btn" type="button" data-h="wire">Wireframe</button><button class="v3d-btn" type="button" data-h="spin">Spin</button></div></div>';
      const hq=sel=>hud.querySelector(sel);
      const hudStatus=hq(".v3d-status"),hudRange=hq("[data-h=explode]"),hudInput=hq(".v3d-input");
      new MutationObserver(()=>{hudStatus.textContent=st.textContent}).observe(st,{childList:true,characterData:true,subtree:true});
      function snapshot(){
        return new Promise(res=>{
          const t=setTimeout(()=>{stateWaiter=null;res({})},400);
          stateWaiter=d=>{clearTimeout(t);res(d)};
          send({cmd:"getState"});
        });
      }
      function restoreView(){
        const s0=pending;pending=null;if(!s0)return;
        if(s0.cam)send({cmd:"setState",cam:s0.cam,target:s0.target});
        ex.value=s0.explode;hudRange.value=s0.explode;if(s0.explode)send({cmd:"explode",v:s0.explode/100});
        wire=s0.wire;if(wire)send({cmd:"wire",v:true});
        spin=s0.spin;if(spin)send({cmd:"spin",v:true});
        const chips=parts.querySelectorAll(".rt-chip");
        s0.hidden.forEach(i=>{const c=chips[i];if(c){c.classList.add("off");send({cmd:"vis",i:i,v:false})}});
      }
      async function setMode(next){
        if(next===mode)return;
        if(!code){st.textContent="Build a model first";return}
        const snap=await snapshot();
        pending={cam:snap.cam,target:snap.target,explode:+ex.value||0,wire:wire,spin:spin,
                 hidden:[...parts.querySelectorAll(".rt-chip")].map((c,i)=>c.classList.contains("off")?i:-1).filter(i=>i>=0)};
        frame.srcdoc="";
        stage.remove();hud.remove();
        document.body.classList.remove("noa-3dfull","noa-3dbg");
        if(task.el)task.el.classList.remove("v3d-away");
        if(next==="popup"){view.insertBefore(frame,view.firstChild)}
        else{
          stage.dataset.mode=next;hud.dataset.mode=next;stage.appendChild(frame);
          if(next==="bg")document.body.insertBefore(stage,document.body.firstChild);else document.body.appendChild(stage);
          document.body.appendChild(hud);
          document.body.classList.add(next==="full"?"noa-3dfull":"noa-3dbg");
          if(next==="bg"&&task.el)task.el.classList.add("v3d-away");
        }
        mode=next;
        st.textContent="Drawing…";
        const r=await load(code);
        if(!r.ok)st.textContent="Error: "+String(r.msg).slice(0,110);
      }
      hud.addEventListener("click",e=>{
        const b=e.target.closest("[data-h]");if(!b)return;

        else if(a==="spin"){spin=!spin;send({cmd:"spin",v:spin})}
        else if(a==="edit"){const t=hudInput.value.trim();if(!t)return;prompt.value=t;hudInput.value="";generate("edit")}
      });
      hudRange.addEventListener("input",()=>{ex.value=hudRange.value;send({cmd:"explode",v:hudRange.value/100})});
      hudInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();hq("[data-h=edit]").click()}});
      const onActive=e=>{if(mode==="bg"&&e.detail&&task&&e.detail.id===task.id)setMode("popup")};
      const onKey=e=>{if(e.key==="Escape"&&mode!=="popup")setMode("popup")};
      window.addEventListener("noa:manager-active",onActive);
      document.addEventListener("keydown",onKey);
      const guard=setInterval(()=>{
        if(body.isConnected)return;
        clearInterval(guard);stage.remove();hud.remove();
        document.body.classList.remove("noa-3dfull","noa-3dbg");
        window.removeEventListener("message",onMsg);window.removeEventListener("noa:manager-active",onActive);document.removeEventListener("keydown",onKey);
      },1000);
      ex.addEventListener("input",()=>{hudRange.value=ex.value;send({cmd:"explode",v:ex.value/100})});
      w.addEventListener("click",e=>{
        const b=e.target.closest("[data-act]");if(!b)return;
        const a=b.dataset.act;
        if(a==="build")generate("build");
        else if(a==="edit")generate("edit");
        else if(a==="stl"||a==="glb"){if(!code){st.textContent="BUILD A MODEL FIRST";return}st.textContent="EXPORTING…";send({cmd:"export",fmt:a})}
        else if(a==="wire"){wire=!wire;send({cmd:"wire",v:wire})}
        else if(a==="spin"){spin=!spin;send({cmd:"spin",v:spin})}

        else if(a==="run"){if(!area.value.trim()){st.textContent="NOTHING TO RUN";return}st.textContent="DRAWING…";show(area.value)}
        else if(a==="full")setMode("full");
        else if(a==="bg")setMode("bg");
      });
      task.__prompt=prompt;task.__gen=generate;
    },
    start(task){
      U.ensureMounted(task);
      const raw=String(task.input||""),ask=threeD.stripCommand(raw)||raw;
      if(!task.__prompt||!ask.trim())return;
      if(/^(?:(?:hey|hi|hello|ok|okay|yo)[,\s]+)?(?:please\s+|noa[,\s]+)*(?:open|start|launch|show|enter|go to)\b/i.test(raw)){U.setTaskState(task,"READY");task.__prompt.focus();return}
      task.__prompt.value=ask;task.__gen("build");
