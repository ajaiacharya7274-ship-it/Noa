<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NOA</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

body{
  font-family:Inter,Arial,sans-serif;
  color:#4fa3ff;
  touch-action:none;
}

#app{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   ORB
========================= */

#orb{
  position:relative;
  width:420px;
  height:420px;
  transform-origin:center;
  will-change:transform;
  user-select:none;
  -webkit-user-select:none;
}

#orbGlow{
  position:absolute;
  inset:-75px;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(30,110,255,.38) 0%,
      rgba(20,80,220,.18) 38%,
      rgba(10,40,120,.08) 58%,
      transparent 75%
    );

  filter:blur(22px);

  animation:breathe 4.5s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{
    opacity:.68;
    transform:scale(.98);
  }

  50%{
    opacity:1;
    transform:scale(1.06);
  }
}

#orb svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

.r1{
  animation:r1 22s linear infinite;
  transform-origin:210px 210px;
}

.r2{
  animation:r2 17s linear infinite;
  transform-origin:210px 210px;
}

.r3{
  animation:r3 13s linear infinite;
  transform-origin:210px 210px;
}

.r4{
  animation:r1 27s linear infinite;
  transform-origin:210px 210px;
}

@keyframes r1{
  to{
    transform:rotate(360deg);
  }
}

@keyframes r2{
  from{
    transform:rotate(360deg);
  }

  to{
    transform:rotate(0);
  }
}

@keyframes r3{
  to{
    transform:rotate(-360deg);
  }
}

/* =========================
   CENTER
========================= */

#center{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

#wave{
  position:absolute;
  left:50%;
  top:50%;

  width:250px;
  height:55px;

  transform:translate(-50%,-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:4px;
}

#wave i{
  display:block;
  width:3px;

  border-radius:4px;

  background:#4fa3ff;

  box-shadow:
    0 0 6px rgba(79,163,255,.75),
    0 0 14px rgba(79,163,255,.28);

  animation:
    wave 1s ease-in-out infinite alternate;
}

@keyframes wave{
  from{
    transform:scaleY(.25);
    opacity:.35;
  }

  to{
    transform:scaleY(1);
    opacity:1;
  }
}

#state{
  position:absolute;
  left:50%;
  top:calc(50% + 43px);

  transform:translateX(-50%);

  font-size:14px;
  line-height:1;

  letter-spacing:5px;

  text-transform:uppercase;

  color:#4fa3ff;

  text-shadow:
    0 0 8px rgba(79,163,255,.9),
    0 0 18px rgba(79,163,255,.35);

  white-space:nowrap;
}

/* =========================
   SPOKEN TEXT
========================= */

#spokenText{
  position:absolute;

  left:50%;
  top:calc(50% + 72px);

  transform:translateX(-50%);

  width:260px;

  text-align:center;

  color:#4fa3ff;

  font-size:12px;
  line-height:1.45;

  letter-spacing:.4px;

  text-shadow:
    0 0 7px rgba(79,163,255,.85),
    0 0 14px rgba(79,163,255,.45);

  opacity:0;

  transition:opacity .15s ease;

  z-index:10;
}

body[data-state="speaking"] #state{
  opacity:0;
}

body[data-state="speaking"] #spokenText{
  opacity:1;
}

body[data-state="idle"] #spokenText,
body[data-state="listening"] #spokenText,
body[data-state="thinking"] #spokenText,
body[data-state="executing"] #spokenText,
body[data-state="complete"] #spokenText{
  opacity:0;
}

/* =========================
   MIC
========================= */

#mic{
  position:fixed;

  right:48px;
  bottom:48px;

  width:64px;
  height:64px;

  border-radius:50%;

  z-index:50;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #4fa3ff;

  background:rgba(79,163,255,.10);

  color:#4fa3ff;

  box-shadow:
    0 0 22px rgba(79,163,255,.25),
    inset 0 0 10px rgba(79,163,255,.08);

  font-size:23px;

  user-select:none;
  touch-action:none;

  cursor:grab;

  -webkit-tap-highlight-color:transparent;

  transition:
    border-color .2s ease,
    color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

#mic.dragging{
  cursor:grabbing;
}

#mic.on{
  border-color:#35e887;
  color:#35e887;
  background:rgba(53,232,135,.14);

  box-shadow:
    0 0 30px rgba(53,232,135,.45),
    0 0 55px rgba(53,232,135,.16),
    inset 0 0 14px rgba(53,232,135,.12);
}

/* =========================
   CHAT OVERLAY
========================= */

#chatOverlay{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.58);

  backdrop-filter:blur(6px);

  opacity:0;
  pointer-events:none;

  transition:opacity .2s ease;
}

#chatOverlay.open{
  opacity:1;
  pointer-events:auto;
}

#chatBox{
  width:min(430px,92vw);
  height:min(650px,80vh);

  display:flex;
  flex-direction:column;

  border:1px solid rgba(79,163,255,.45);
  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      rgba(5,13,28,.98),
      rgba(1,5,12,.98)
    );

  box-shadow:
    0 0 45px rgba(25,105,220,.22),
    inset 0 0 30px rgba(79,163,255,.035);

  overflow:hidden;

  transform:scale(.94);
  transition:transform .2s ease;
}

#chatOverlay.open #chatBox{
  transform:scale(1);
}

#chatHeader{
  height:54px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px 0 18px;

  border-bottom:
    1px solid rgba(120,180,255,.13);
}

#chatTitle{
  color:#7dbdff;

  font-size:11px;

  letter-spacing:3px;

  text-transform:uppercase;
}

#chatActions{
  display:flex;
  gap:7px;
}

.chatAction{
  width:34px;
  height:34px;

  border:
    1px solid rgba(79,163,255,.25);

  border-radius:9px;

  background:
    rgba(79,163,255,.07);

  color:#9dccff;

  cursor:pointer;

  font-size:15px;

  padding:0;

  font-weight:700;

  -webkit-tap-highlight-color:transparent;
}

#chatHistory{
  flex:1;

  overflow-y:auto;

  padding:14px;

  display:flex;
  flex-direction:column;

  gap:10px;

  scrollbar-width:thin;
}

.message{
  max-width:88%;

  padding:10px 12px;

  border-radius:13px;

  font-size:13px;
  line-height:1.5;

  white-space:pre-wrap;
  word-break:break-word;
}

.message.user{
  align-self:flex-end;

  color:#dff0ff;

  background:
    rgba(79,163,255,.12);

  border:
    1px solid rgba(79,163,255,.22);

  border-bottom-right-radius:4px;
}

.message.noa{
  align-self:flex-start;

  color:#dcecff;

  background:
    rgba(8,18,35,.9);

  border:
    1px solid rgba(79,163,255,.17);

  border-bottom-left-radius:4px;

  box-shadow:
    0 0 15px rgba(25,105,220,.08);
}

.messageLabel{
  display:block;

  margin-bottom:4px;

  font-size:8px;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#6dafff;

  opacity:.7;
}

#chatInputArea{
  display:flex;

  gap:7px;

  padding:10px;

  border-top:
    1px solid rgba(120,180,255,.13);
}

#chatInput{
  flex:1;

  min-width:0;

  height:42px;

  border:
    1px solid rgba(79,163,255,.22);

  border-radius:11px;

  outline:none;

  background:
    rgba(79,163,255,.05);

  color:#dcecff;

  padding:0 12px;

  font-size:13px;
}

#chatInput::placeholder{
  color:#6684a5;
}

#sendChat{
  width:44px;
  height:42px;

  border:
    1px solid rgba(79,163,255,.35);

  border-radius:11px;

  background:
    rgba(79,163,255,.10);

  color:#8fc8ff;

  cursor:pointer;

  font-size:17px;

  padding:0;
}

#chatStatus{
  min-height:0;

  padding:0 12px 8px;

  text-align:center;

  color:#50708f;

  font-size:9px;
}

/* =========================
   STATES
========================= */

body[data-state="thinking"] #orbGlow{
  animation:breathe 1.6s ease-in-out infinite;
}

body[data-state="executing"] #orbGlow{
  animation:breathe .75s ease-in-out infinite;
}

body[data-state="speaking"] #wave i{
  animation-duration:.45s;
}

body[data-state="executing"] #wave i{
  animation-duration:.30s;
}

body[data-state="complete"] #orbGlow{
  animation:pulse .7s ease-out 1;
}

@keyframes pulse{
  50%{
    transform:scale(1.2);
    opacity:1;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  #orb{
    width:420px;
    height:420px;
  }

  #mic{
    width:56px;
    height:56px;

    right:20px;
    bottom:20px;

    left:auto;
    top:auto;
  }

  #wave{
    width:220px;
    height:50px;
  }

  #state{
    font-size:12px;
    letter-spacing:4px;
  }

  #spokenText{
    width:220px;
    font-size:11px;
  }

  #chatBox{
    width:92vw;
    height:78vh;
    border-radius:18px;
  }
}
</style>
</head>

<body data-state="idle">

<div id="app">

  <div id="orb">

    <div id="orbGlow"></div>

    <svg viewBox="0 0 420 420" aria-hidden="true">

      <defs>

        <filter
          id="glow"
          x="-80%"
          y="-80%"
          width="260%"
          height="260%"
        >
          <feGaussianBlur
            stdDeviation="6"

          />

          />
        </linearGradient>

        <linearGradient id="gradB">

          <ellipse

</div>


<button

<!-- =========================
     CHAT POPUP
========================= -->

<div id="chatOverlay">

  <div id="chatBox">

    <div id="chatHeader">

      <div id="chatActions">

        <button
          class="chatAction"

          ⌫

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const body =
  document.body;

const orb =
  document.getElementById("orb");

const wave =
  document.getElementById("wave");

const state =
  document.getElementById("state");

const spokenText =
  document.getElementById("spokenText");

const mic =
  document.getElementById("mic");

const chatOverlay =
  document.getElementById("chatOverlay");

const chatHistory =
  document.getElementById("chatHistory");

const chatInput =
  document.getElementById("chatInput");

const sendChat =
  document.getElementById("sendChat");

const closeChat =
  document.getElementById("closeChat");

const clearChat =
  document.getElementById("clearChat");

const chatStatus =
  document.getElementById("chatStatus");


/* =========================================================
   NOA WORKER
========================================================= */

const NOA_WORKER =
  "https://noa-brain-a78d.ajaiacharya7274.workers.dev/api/chat";


/* =========================================================
   WAVEFORM
========================================================= */

[
  5,8,12,18,11,23,16,29,19,
  24,14,9,6,10,16,22,15,20,
  27,17,10,14,20,25,15,9,5
].forEach(
  (height,index)=>{

    const bar =
      document.createElement("i");

    bar.style.height =
      height + "px";

    bar.style.animationDelay =
      (index * .04) + "s";

    wave.appendChild(bar);

  }
);


/* =========================================================
   STATE
========================================================= */

function setState(value){

  const next =
    String(value || "IDLE")
      .toUpperCase();

  body.dataset.state =
    next.toLowerCase();

  state.textContent =
    next;

}

window.NOA = {
  setState,

  getState(){
    return state.textContent;
  }
};


/* =========================================================
   ORB ZOOM
========================================================= */

let zoom = 1;

const MIN_ZOOM = .55;
const MAX_ZOOM = 2.4;

function applyZoom(){

  orb.style.transform =
    "scale(" + zoom + ")";

}

orb.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    zoom +=
      event.deltaY < 0
        ? .08
        : -.08;

    zoom =
      Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          zoom
        )
      );

    applyZoom();

  },
  {
    passive:false
  }
);


/* =========================================================
   PINCH ZOOM
========================================================= */

let pinchDistance = 0;
let pinchZoom = 1;

orb.addEventListener(
  "touchstart",
  event=>{

    if(
      event.touches.length !== 2
    ){
      return;
    }

    const dx =
      event.touches[0].clientX -
      event.touches[1].clientX;

    const dy =
      event.touches[0].clientY -
      event.touches[1].clientY;

    pinchDistance =
      Math.hypot(dx,dy);

    pinchZoom =
      zoom;

  },
  {
    passive:true
  }
);

orb.addEventListener(
  "touchmove",
  event=>{

    if(
      event.touches.length !== 2 ||
      !pinchDistance
    ){
      return;
    }

    event.preventDefault();

    const dx =
      event.touches[0].clientX -
      event.touches[1].clientX;

    const dy =
      event.touches[0].clientY -
      event.touches[1].clientY;

    const distance =
      Math.hypot(dx,dy);

    zoom =
      pinchZoom *
      (distance / pinchDistance);

    zoom =
      Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          zoom
        )
      );

    applyZoom();

  },
  {
    passive:false
  }
);

orb.addEventListener(
  "touchend",
  ()=>{
    pinchDistance = 0;
  },
  {
    passive:true
  }
);


/* =========================================================
   CHAT HISTORY
========================================================= */

const STORAGE_KEY =
  "NOA_CHAT_HISTORY_V2";

let history = [];

try{

  const stored =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(stored){

    const parsed =
      JSON.parse(stored);

    if(Array.isArray(parsed)){
      history = parsed;
    }

  }

}catch(error){

  console.warn(
    "History load failed",
    error
  );

}


function saveHistory(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );

  }catch(error){

    console.warn(
      "History save failed",
      error
    );

  }

}


function renderHistory(){

  chatHistory.innerHTML = "";

  history.forEach(
    item=>{

      addMessageElement(
        item.role,
        item.text
      );

    }
  );

  scrollChat();

}


function addMessageElement(
  role,
  text
){

  const bubble =
    document.createElement("div");

  bubble.className =
    "message " +
    (
      role === "user"
        ? "user"
        : "noa"
    );

  const label =
    document.createElement("span");

  label.className =
    "messageLabel";

  label.textContent =
    role === "user"
      ? "YOU"
      : "NOA";

  const content =
    document.createElement("span");

  content.textContent =
    String(text);

  bubble.appendChild(label);
  bubble.appendChild(content);

  chatHistory.appendChild(
    bubble
  );

}


function addHistory(
  role,
  text
){

  history.push({
    role,
    text:String(text)
  });

  if(history.length > 100){

    history =
      history.slice(
        history.length - 100
      );

  }

  saveHistory();

  renderHistory();

}


function scrollChat(){

  chatHistory.scrollTop =
    chatHistory.scrollHeight;

}


/* =========================================================
   CHAT OPEN / CLOSE
========================================================= */

function openChat(){

  chatOverlay.classList.add(
    "open"
  );

  renderHistory();

  setTimeout(
    ()=>{
      chatInput.focus();
    },
    120
  );

}


function closeChatPopup(){

  chatOverlay.classList.remove(
    "open"
  );

}


closeChat.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    closeChatPopup();

  }
);


chatOverlay.addEventListener(
  "click",
  event=>{

    if(
      event.target ===
      chatOverlay
    ){

      closeChatPopup();

    }

  }
);


clearChat.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    history = [];

    saveHistory();

    renderHistory();

  }
);


/* ==================================================
