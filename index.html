<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NOA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,Arial,sans-serif;color:#4fa3ff;touch-action:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:visible}

#orb{
  position:relative;
  width:280px;height:280px;
  transform-origin:center;
  will-change:transform;
}
#orbGlow{
  position:absolute;inset:-55px;border-radius:50%;
  background:radial-gradient(circle,rgba(30,110,255,.34),rgba(20,80,220,.10) 42%,transparent 72%);
  filter:blur(18px);
  animation:breathe 4.5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

#orb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r1{animation:r1 22s linear infinite;transform-origin:210px 210px}
.r2{animation:r2 17s linear infinite;transform-origin:210px 210px}
.r3{animation:r3 13s linear infinite;transform-origin:210px 210px}
.r4{animation:r1 27s linear infinite;transform-origin:210px 210px}
@keyframes r1{to{transform:rotate(360deg)}}
@keyframes r2{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes r3{to{transform:rotate(-360deg)}}

/* THIS is the actual center layer: waveform + state, centered over the orb */
#center{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}
#wave{
  position:absolute;
  left:50%;
  top:50%;
  width:150px;
  height:30px;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
}
#wave i{
  display:block;width:2px;border-radius:3px;
  background:#4fa3ff;
  box-shadow:0 0 7px rgba(79,163,255,.7);
  animation:wave 1s ease-in-out infinite alternate;
}
@keyframes wave{from{transform:scaleY(.28);opacity:.38}to{transform:scaleY(1);opacity:1}}
#state{
  position:absolute;
  left:50%;
  top:calc(50% + 27px);
  transform:translateX(-50%);
  font-size:10px;
  line-height:1;
  letter-spacing:3px;
  text-transform:uppercase;
  text-shadow:0 0 10px rgba(79,163,255,.75);
}

/* Floating mic: one element only */
#mic{
  position:fixed;
  right:28px;
  bottom:28px;
  width:48px;height:48px;
  border-radius:50%;
  z-index:20;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(79,163,255,.65);
  background:rgba(79,163,255,.10);
  color:#4fa3ff;
  box-shadow:0 0 20px rgba(79,163,255,.16);
  font-size:18px;
  user-select:none;
  touch-action:none;
  cursor:grab;
  -webkit-tap-highlight-color:transparent;
}
#mic.dragging{cursor:grabbing}
#mic[style*="left"]{right:auto!important;bottom:auto!important}
#mic.on{
  border:2px solid #35e887;
  color:#35e887;
  background:rgba(53,232,135,.16);
  box-shadow:0 0 30px rgba(53,232,135,.42), inset 0 0 12px rgba(53,232,135,.12);
}
#mic.off{
  border:2px solid #4fa3ff;
  color:#4fa3ff;
  background:rgba(79,163,255,.12);
  box-shadow:0 0 22px rgba(79,163,255,.25), inset 0 0 10px rgba(79,163,255,.08);
}


#popupLayer{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  overflow:visible;
}
.noa-popup{
  position:absolute;
  left:50%;
  top:50%;
  width:min(360px,72vw);
  min-height:150px;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:center;
  pointer-events:auto;
  border:1px solid rgba(79,163,255,.42);
  border-radius:18px;
  background:rgba(3,8,18,.92);
  box-shadow:0 0 35px rgba(25,105,220,.18);
  color:#dcecff;
  overflow:hidden;
  user-select:none;
  touch-action:none;
}
.noa-popup.active{border-color:rgba(79,163,255,.8)}
.noa-popup.dragging{cursor:grabbing}
.noa-popup-head{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px 0 16px;
  border-bottom:1px solid rgba(120,180,255,.12);
  cursor:grab;
  touch-action:none;
}
.noa-popup-title{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#7dbdff;
}
.noa-popup-actions{display:flex;gap:6px}
.noa-popup-actions button{
  width:30px;height:30px;border:0;border-radius:8px;
  background:rgba(79,163,255,.08);
  color:#8fc8ff;font-size:15px;cursor:pointer;
}
.noa-popup-body{
  padding:16px;
  font-size:13px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow:auto;
  max-height:300px;
  user-select:text;
  touch-action:pan-y;
}
.noa-popup-tools{
  display:flex;
  gap:6px;
  padding:0 16px 14px;
}
.noa-popup-tools button{
  min-width:44px;height:36px;border:1px solid rgba(79,163,255,.25);
  border-radius:9px;background:rgba(79,163,255,.07);
  color:#9dccff;cursor:pointer;
}

#spokenText{
  position:absolute;
  left:50%;
  top:calc(50% + 48px);
  transform:translateX(-50%);
  width:205px;
  text-align:center;
  color:#4fa3ff;
  font-size:11px;
  line-height:1.45;
  letter-spacing:.4px;
  text-shadow:0 0 7px rgba(79,163,255,.85),0 0 14px rgba(79,163,255,.45);
  opacity:0;
  transition:opacity .15s ease;
  z-index:10;
}
body[data-state="speaking"] #state{opacity:0}
body[data-state="speaking"] #spokenText{opacity:1}

/* state behavior */
body[data-state="thinking"] #orbGlow{animation:breathe 1.6s ease-in-out infinite}
body[data-state="executing"] #orbGlow{animation:breathe .75s ease-in-out infinite}
body[data-state="speaking"] #wave i{animation-duration:.45s}
body[data-state="executing"] #wave i{animation-duration:.3s}
body[data-state="complete"] #orbGlow{animation:pulse .7s ease-out 1}
@keyframes pulse{50%{transform:scale(1.2);opacity:1}}

/* =========================================================
   CHAT
========================================================= */
#chatOverlay{position:fixed;inset:0;z-index:100;display:block;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;opacity:0;pointer-events:none;transition:opacity .2s ease}
#chatOverlay.open{opacity:1;pointer-events:none}
#chatBox{position:absolute;left:50%;top:50%;width:min(360px,88vw);height:min(480px,72vh);min-width:280px;min-height:220px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;border:1px solid rgba(79,163,255,.45);border-radius:20px;background:linear-gradient(180deg,rgba(5,13,28,.98),rgba(1,5,12,.98));box-shadow:0 0 45px rgba(25,105,220,.22),inset 0 0 30px rgba(79,163,255,.035);overflow:hidden;transform:translate(-50%,-50%) scale(.94);transition:transform .2s ease;will-change:left,top,width,height;touch-action:none;pointer-events:auto!important}
#chatOverlay.open #chatBox{transform:translate(-50%,-50%) scale(1)}
#chatOverlay.open #chatBox.chat-moved{transform:none}
#chatHeader{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;border-bottom:1px solid rgba(120,180,255,.13);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#chatBox.dragging #chatHeader{cursor:grabbing}
#chatResize{position:absolute;right:0;bottom:0;width:34px;height:34px;z-index:10000;pointer-events:auto;cursor:nwse-resize;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:linear-gradient(135deg,transparent 0 50%,rgba(79,163,255,.16) 51% 57%,transparent 58% 66%,rgba(79,163,255,.55) 67% 73%,transparent 74%);border-radius:10px;display:flex;align-items:flex-end;justify-content:flex-end;color:#8fc8ff;font:700 14px Inter,Arial,sans-serif;padding:5px;box-shadow:0 0 14px rgba(79,163,255,.12)}
#chatResize::after{content:"↗";text-shadow:0 0 8px rgba(79,163,255,.8)}
#chatTitle{color:#7dbdff;font-size:11px;letter-spacing:3px;text-transform:uppercase}
#chatActions{display:flex;gap:7px}
.chatAction{width:34px;height:34px;border:1px solid rgba(79,163,255,.25);border-radius:9px;background:rgba(79,163,255,.07);color:#9dccff;cursor:pointer;font-size:15px;padding:0}
#chatHistory{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.message{max-width:88%;padding:10px 12px;border-radius:13px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.message.user{align-self:flex-end;color:#2f8cff;background:rgba(79,163,255,.12);border:1px solid rgba(79,163,255,.22);border-bottom-right-radius:4px}
.message.noa{align-self:flex-start;color:#2f8cff;background:rgba(8,18,35,.9);border:1px solid rgba(79,163,255,.17);border-bottom-left-radius:4px;box-shadow:0 0 15px rgba(25,105,220,.08)}
.messageLabel{display:block;margin-bottom:4px;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#6dafff;opacity:.7}
#chatHint{padding:0 12px 9px;color:#50708f;font-size:9px;text-align:center}
#chatInputArea{display:flex;gap:3px;padding:10px;border-top:1px solid rgba(120,180,255,.13);position:relative;z-index:40}
#chatInput{flex:1;min-width:0;height:42px;border:1px solid rgba(79,163,255,.22);border-radius:11px;outline:none;background:rgba(79,163,255,.05);color:#2f8cff;padding:0 12px;font-size:13px}
#chatInput::placeholder{color:#6684a5}
#sendChat{width:44px;height:42px;border:1px solid rgba(79,163,255,.35);border-radius:11px;background:rgba(79,163,255,.10);color:#8fc8ff;cursor:pointer;font-size:17px;padding:0;position:relative;z-index:41;pointer-events:auto}

@media(max-width:500px){
  #orb{width:280px;height:280px}
  #mic{right:20px;bottom:20px;left:auto;top:auto}
}

@media(max-height:650px){
  #orb{width:260px;height:260px}
}
</style>

<style id="noaMultiPopupCSS">
#popupCanvas{position:fixed;inset:0;z-index:90;overflow:visible;pointer-events:none}
.noaPopupWindow{
  position:absolute;width:360px;height:520px;min-width:240px;min-height:180px;
  max-width:90vw;max-height:85vh;display:flex;flex-direction:column;
  pointer-events:auto;border:1px solid rgba(79,163,255,.45);border-radius:20px;
  background:linear-gradient(180deg,rgba(5,13,28,.98),rgba(1,5,12,.98));
  box-shadow:0 0 45px rgba(25,105,220,.22),inset 0 0 30px rgba(79,163,255,.035);
  overflow:hidden
}
.noaPopupHeader{
  height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px 0 18px;border-bottom:1px solid rgba(120,180,255,.13);
  cursor:grab;touch-action:none
}
.noaPopupHeader:active{cursor:grabbing}
.noaPopupBody{flex:1;min-height:0;overflow:auto;padding:14px;color:#dcecff;font-size:13px;line-height:1.5}
.noaPopupResize{
  position:absolute;right:0;bottom:0;width:56px;height:56px;
  cursor:nwse-resize;touch-action:none
}
.noaPopupResize:after{
  content:"";position:absolute;right:8px;bottom:8px;width:22px;height:22px;
  border-right:3px solid rgba(79,163,255,.8);border-bottom:3px solid rgba(79,163,255,.8);
  transform:skew(-12deg)
}
#chatOverlay.multiCanvasMode{
  pointer-events:none;background:transparent;backdrop-filter:none;
  -webkit-backdrop-filter:none;opacity:0
}
#chatOverlay.multiCanvasMode.open{opacity:1}
#chatOverlay.multiCanvasMode #chatBox{display:flex;pointer-events:auto}
</style>


<style id="noaBackgroundDragCSS">
#app{cursor:grab;will-change:transform}
#app:active{cursor:grabbing}
#popupCanvas{will-change:transform}

#noaBackgroundReset{
  position:fixed;top:18px;right:18px;z-index:120;
  display:none;align-items:center;justify-content:center;
  min-width:44px;height:40px;padding:0 13px;
  border:1px solid rgba(79,163,255,.55);border-radius:10px;
  background:rgba(5,13,28,.88);color:#8fc8ff;
  box-shadow:0 0 22px rgba(25,105,220,.20);
  font:600 11px Inter,Arial,sans-serif;letter-spacing:1.5px;
  cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#noaBackgroundReset.visible{display:flex}
#noaConnectorLayer{
  position:fixed;inset:0;z-index:89;pointer-events:none;overflow:visible;
}
#noaConnectorLayer path.cableGlow{fill:none;stroke:rgba(79,163,255,.22);stroke-width:10;stroke-linecap:round;opacity:.72;filter:drop-shadow(0 0 9px rgba(79,163,255,.65));}
#noaConnectorLayer path.cable{fill:none;stroke:#4fa3ff;stroke-width:4;stroke-linecap:round;opacity:.94;filter:drop-shadow(0 0 5px rgba(79,163,255,.9));}
#noaConnectorLayer path.cableCore{fill:none;stroke:#bfe0ff;stroke-width:1.2;stroke-linecap:round;opacity:.72;}
#noaConnectorLayer circle{fill:#4fa3ff;stroke:#bfe0ff;stroke-width:1.2;filter:drop-shadow(0 0 6px rgba(79,163,255,.9));}
</style>


<style id="noaMainChatZoomFix">
#chatBox.chat-moved{
  transform:scale(var(--noaMainChatZoom,1)) !important;
  transform-origin:center center;
}
</style>


<style id="noaChatFullscreenFix">
#chatBox.chat-fullscreen{
  position:absolute !important;
  left:0 !important;
  top:0 !important;
  width:100vw !important;
  height:100dvh !important;
  min-width:0 !important;
  min-height:0 !important;
  max-width:none !important;
  max-height:none !important;
  transform:none !important;
  transform-origin:center center !important;
  border-radius:0 !important;
  transition:none !important;
  z-index:10001 !important;
}
#chatBox.chat-fullscreen #chatResize{
  display:none !important;
}
</style>

</head>
<body data-state="idle">
<div id="popupLayer" aria-live="polite"></div>
<div id="app">

  <div id="orb">
    <div id="orbGlow"></div>

    <svg viewBox="0 0 420 420" aria-hidden="true">
      <defs>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
        <radialGradient id="core"><stop offset="0" stop-color="#020409"/><stop offset="1" stop-color="#000"/></radialGradient>
        <linearGradient id="a"><stop stop-color="#bfe0ff" stop-opacity="0"/><stop offset=".5" stop-color="#4fa3ff"/><stop offset="1" stop-color="#bfe0ff" stop-opacity="0"/></linearGradient>
        <linearGradient id="b"><stop stop-color="#dff0ff" stop-opacity="0"/><stop offset=".5" stop-color="#7cc4ff"/><stop offset="1" stop-color="#dff0ff" stop-opacity="0"/></linearGradient>
      </defs>

      <circle cx="210" cy="210" r="150" fill="url(#core)"/>
      <g filter="url(#glow)">
        <g class="r1"><path d="M210 65 C300 70 355 140 350 215 C345 290 280 350 205 350" fill="none" stroke="url(#a)" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="r2"><path d="M205 355 C120 352 65 285 68 210 C71 135 130 72 208 68" fill="none" stroke="url(#b)" stroke-width="2.4" stroke-linecap="round"/></g>
        <g class="r3"><ellipse cx="210" cy="210" rx="142" ry="128" fill="none" stroke="#3d8fff" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="1 9"/></g>
        <g class="r4"><ellipse cx="210" cy="210" rx="128" ry="144" fill="none" stroke="#8fd0ff" stroke-opacity=".4" stroke-width="1.1" stroke-dasharray="1 7"/></g>
        <g class="r2"><circle cx="210" cy="210" r="150" fill="none" stroke="#2f6fe0" stroke-opacity=".5"/></g>
      </g>
      <g filter="url(#soft)">
        <circle cx="210" cy="61" r="2" fill="#eaf6ff"/>
        <circle cx="358" cy="150" r="1.6" fill="#cfe8ff"/>
        <circle cx="360" cy="270" r="1.8" fill="#eaf6ff"/>
        <circle cx="205" cy="359" r="2" fill="#cfe8ff"/>
        <circle cx="62" cy="255" r="1.6" fill="#eaf6ff"/>
        <circle cx="65" cy="145" r="1.8" fill="#cfe8ff"/>
      </g>
    </svg>

    <div id="center">
      <div id="wave"></div>
      <div id="state">IDLE</div>
    </div>
  </div>
</div>
<div id="popupCanvas" aria-label="NOA popup workspace"></div>


<button id="mic" aria-label="Microphone">🎙</button>

<div id="chatOverlay">
  <div id="chatBox">
    <div id="chatHeader">
      <div id="chatTitle">NOA // CHAT</div>
      <div id="chatActions">
        <button class="chatAction" id="clearChat" title="Clear history">⌫</button>
        <button class="chatAction" id="closeChat" title="Close">×</button>
      </div>
    </div>
    <div id="chatResize" aria-label="Resize chat"></div>
    <div id="chatHistory"></div>
    <div id="chatHint">Double-tap the orb to open chat</div>
    <div id="chatInputArea">
      <input id="chatInput" type="text" autocomplete="off" placeholder="Talk to NOA..."/>
      <button id="sendChat" aria-label="Send">➤</button>
    </div>
  </div>
</div>
<button id="noaBackgroundReset" type="button" aria-label="Reset background position">RESET</button>
<svg id="noaConnectorLayer" aria-hidden="true" width="100%" height="100%" preserveAspectRatio="none"></svg>



<script>
/* =========================
   NOA BACKGROUND WORKSPACE FREE PAN
   Empty background drag = move the whole workspace
   freely in BOTH X and Y directions.
========================= */
(function(){
  const workspace=document.getElementById("app");
  const orbEl=document.getElementById("orb");
  const popupLayer=document.getElementById("popupCanvas");
  const resetBtn=document.getElementById("noaBackgroundReset");
  if(!workspace || !orbEl || !popupLayer) return;

  window.NOAPanX=0;
  window.NOAPanY=0;
  let startX=0,startY=0,startPanX=0,startPanY=0,dragging=false;

  function updateResetButton(){
    if(!resetBtn) return;
    const moved=Math.abs(window.NOAPanX)>0.5 || Math.abs(window.NOAPanY)>0.5;
    resetBtn.classList.toggle("visible",moved);
  }

  function syncWorkspaceObjects(){
    const px=window.NOAPanX||0, py=window.NOAPanY||0;
    const chatBoxEl=document.getElementById("chatBox");
    if(chatBoxEl && window.NOALayoutChatOpen && chatBoxEl.classList.contains("chat-moved") &&
       Number.isFinite(window.NOAMainChatWorldLeft) &&
       !Number.isFinite(window.NOAMainChatOrbOffsetX)){
      chatBoxEl.style.left=(window.NOAMainChatWorldLeft+px)+"px";
      chatBoxEl.style.top=(window.NOAMainChatWorldTop+py)+"px";
    }
    popupLayer.style.transform="translate3d("+px+"px,"+py+"px,0)";
  }

  function applyFreePan(){
    const z=typeof zoom==="number" ? zoom : 1;
    const chatOpen=!!window.NOALayoutChatOpen;
    const chatScale=chatOpen ? 0.58 : 1;

    /* Main chat popup follows the same global zoom as the orb/workspace. */
    const mainChatZoom=document.getElementById("chatBox");
    if(mainChatZoom) mainChatZoom.style.setProperty("--noaMainChatZoom",String(popupWorldScale(z)*chatScale));

    /* The main chat popup is a workspace object too. Its world position is
       stored separately so background panning moves it together with the orb
       and all generated popups instead of leaving it fixed at the top. */
    const chatBoxEl=document.getElementById("chatBox");
    if(chatBoxEl && chatOpen && chatBoxEl.classList.contains("chat-moved")){
      if(!Number.isFinite(window.NOAMainChatWorldLeft)){
        const r=chatBoxEl.getBoundingClientRect();
        window.NOAMainChatWorldLeft=r.left-window.NOAPanX;
        window.NOAMainChatWorldTop=r.top-window.NOAPanY;
      }
      syncWorkspaceObjects();
    }

    /* World panning is intentionally unrestricted here.
       When a zoomed popup is outside the viewport, the user can pan the
       background toward it; the orb must travel with the world instead of
       being screen-locked. */

    orbEl.style.transform="translate3d("+window.NOAPanX+"px,"+window.NOAPanY+"px,0) scale("+(z*chatScale)+")";
    applyMainChatOrbDistance();
    popupLayer.style.transform="translate3d("+window.NOAPanX+"px,"+window.NOAPanY+"px,0) scale("+z+")";
    popupLayer.style.transformOrigin="center center";
    updateResetButton();
    if(window.updateNoaConnectors) requestAnimationFrame(window.updateNoaConnectors);
  }
  window.applyFreePan=applyFreePan;

  function resetBackground(){
    window.NOAPanX=0;
    window.NOAPanY=0;
    applyFreePan();
  }
  window.resetNoaBackground=resetBackground;
  resetBtn?.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();resetBackground();});

  function isProtectedTarget(t){
    return !!(t.closest && (
      t.closest("#orb")||t.closest("#mic")||t.closest(".noaPopupWindow")||
      t.closest("#chatOverlay")||t.closest("#noaBackgroundReset")||
      t.closest("#noaConnectorLayer")||t.closest("button")||
      t.closest("input")||t.closest("textarea")
    ));
  }

  workspace.addEventListener("pointerdown",function(e){
    if(e.button!==undefined && e.button!==0) return;
    if(isProtectedTarget(e.target)) return;
    dragging=true; startX=e.clientX; startY=e.clientY;
    startPanX=window.NOAPanX; startPanY=window.NOAPanY;
    workspace.setPointerCapture?.(e.pointerId); e.preventDefault();
  },{passive:false});

  workspace.addEventListener("pointermove",function(e){
    if(!dragging) return;
    window.NOAPanX=startPanX+(e.clientX-startX);
    window.NOAPanY=startPanY+(e.clientY-startY);
    applyFreePan();
    /* Do not clamp the main chat popup during workspace panning.
       It must travel with the world so scrolling can reveal other popups. */
    e.preventDefault();
  },{passive:false});

  function stopPan(e){
    if(!dragging) return; dragging=false;
    try{workspace.releasePointerCapture?.(e.pointerId)}catch(_){}
    updateResetButton();
  }
  workspace.addEventListener("pointerup",stopPan);
  workspace.addEventListener("pointercancel",stopPan);
  workspace.addEventListener("lostpointercapture",function(){dragging=false;});

  /* World zoom: empty main background can zoom from anywhere.
     Protected UI controls keep their original behavior. */
  workspace.addEventListener("wheel",function(e){
    if(isProtectedTarget(e.target)) return;
    e.preventDefault();
    zoom=Math.max(
      MIN_ZOOM,
      Math.min(MAX_ZOOM,zoom+(e.deltaY<0?0.08:-0.08))
    );
    applyOrbZoom();
    applyFreePan();
  },{passive:false});

  let worldPinchDistance=0;
  let worldPinchZoom=1;

  workspace.addEventListener("touchstart",function(e){
    if(e.touches.length!==2) return;
    if(isProtectedTarget(e.target)) return;
    worldPinchDistance=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    worldPinchZoom=zoom;
    dragging=false;
  },{passive:true});

  workspace.addEventListener("touchmove",function(e){
    if(e.touches.length!==2 || !worldPinchDistance) return;
    if(isProtectedTarget(e.target)) return;
    e.preventDefault();

    const distance=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );

    zoom=Math.max(
      MIN_ZOOM,
      Math.min(MAX_ZOOM,worldPinchZoom*(distance/worldPinchDistance))
    );
    applyOrbZoom();
    applyFreePan();
  },{passive:false});

  function stopWorldPinch(){
    worldPinchDistance=0;
  }
  workspace.addEventListener("touchend",stopWorldPinch,{passive:true});
  workspace.addEventListener("touchcancel",stopWorldPinch,{passive:true});

  applyFreePan();
})();</script>

<script>
/* =========================
   NOA POPUP -> ORB CONNECTORS
========================= */
(function(){
  const svg=document.getElementById("noaConnectorLayer");
  if(!svg) return;

  function esc(n){return Number.isFinite(n)?n:0;}

  function centerOf(el){
    if(!el) return null;
    const r=el.getBoundingClientRect();
    return {x:r.left+r.width/2,y:r.top+r.height/2,r};
  }

  function edgePoint(rect,fromX,fromY){
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    const dx=fromX-cx, dy=fromY-cy;
    if(Math.abs(dx)<.001 && Math.abs(dy)<.001) return {x:cx,y:rect.top};
    const tx=Math.abs(dx)>0 ? (rect.width/2)/Math.abs(dx) : Infinity;
    const ty=Math.abs(dy)>0 ? (rect.height/2)/Math.abs(dy) : Infinity;
    const t=Math.min(tx,ty);
    return {x:cx+dx*t,y:cy+dy*t};
  }

  function drawConnector(fromEl,toEl){
    const a=centerOf(fromEl), b=centerOf(toEl);
    if(!a||!b) return;

    /* Start on the ORB RING, never from the orb centre.
       The visible ring is about r=150 in a 420 viewBox,
       so its screen radius is ~35.7% of the orb box. */
    const orbRadius=Math.min(a.r.width,a.r.height)*0.357;
    const vx=b.x-a.x, vy=b.y-a.y;
    const vlen=Math.max(1,Math.hypot(vx,vy));
    const start={
      x:a.x+(vx/vlen)*orbRadius,
      y:a.y+(vy/vlen)*orbRadius
    };

    const end=edgePoint(b.r,start.x,start.y);
    const dx=end.x-start.x, dy=end.y-start.y;
    const len=Math.max(1,Math.hypot(dx,dy));
    const nx=-dy/len, ny=dx/len;
    const bend=Math.min(90,Math.max(35,len*.18));
    const c1x=start.x+dx*.28+nx*bend, c1y=start.y+dy*.28+ny*bend;
    const c2x=start.x+dx*.72+nx*bend, c2y=start.y+dy*.72+ny*bend;
    const d=`M ${esc(start.x)} ${esc(start.y)} C ${esc(c1x)} ${esc(c1y)}, ${esc(c2x)} ${esc(c2y)}, ${esc(end.x)} ${esc(end.y)}`;
    const ns="http://www.w3.org/2000/svg";
    const glow=document.createElementNS(ns,"path");
    glow.setAttribute("d",d);glow.setAttribute("class","cableGlow");
    const cable=document.createElementNS(ns,"path");
    cable.setAttribute("d",d);cable.setAttribute("class","cable");
    const core=document.createElementNS(ns,"path");
    core.setAttribute("d",d);core.setAttribute("class","cableCore");
    const dot=document.createElementNS(ns,"circle");
    dot.setAttribute("cx",esc(start.x));dot.setAttribute("cy",esc(start.y));dot.setAttribute("r","5");
    const endDot=document.createElementNS(ns,"circle");
    endDot.setAttribute("cx",esc(end.x));endDot.setAttribute("cy",esc(end.y));endDot.setAttribute("r","4");
    svg.append(glow,cable,core,dot,endDot);
  }

  window.updateNoaConnectors=function(){
    svg.innerHTML="";
    const orb=document.getElementById("orb");
    if(!orb) return;
    const targets=[];
    const chat=document.getElementById("chatBox");
    if(chat && document.getElementById("chatOverlay")?.classList.contains("open")) targets.push(chat);
    document.querySelectorAll("#popupCanvas .noaPopupWindow").forEach(el=>targets.push(el));
    targets.forEach(el=>drawConnector(orb,el));
  };

  window.addEventListener("resize",()=>requestAnimationFrame(window.updateNoaConnectors));
  requestAnimationFrame(window.updateNoaConnectors);
})();
</script>


<script>
/* =========================
   NOA MULTI-POPUP WORKSPACE
========================= */

const popupCanvas=document.getElementById("popupCanvas");
let noaPopupZ=1000;
let noaPopupCount=0;

function createNoaPopup(title="NOA // TASK",content=""){
  const box=document.createElement("section");
  box.className="noaPopupWindow";
  box.style.zIndex=String(++noaPopupZ);

  const offset=(noaPopupCount%8)*28;

  box.style.left=Math.max(
    8,
    Math.min(innerWidth-368,innerWidth/2-180+offset)
  )+"px";

  box.style.top=Math.max(
    8,
    Math.min(innerHeight-528,innerHeight/2-260+offset)
  )+"px";

  box.innerHTML=`
    <div class="noaPopupHeader">
      <div id="chatTitle">${String(title)}</div>
      <button class="chatAction noaPopupClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="noaPopupBody"></div>
    <div class="noaPopupResize" aria-label="Resize popup"></div>
  `;

  box.querySelector(".noaPopupBody").textContent=String(content);
  popupCanvas.appendChild(box);
  noaPopupCount++;
  requestAnimationFrame(()=>window.updateNoaConnectors?.());

  const header=box.querySelector(".noaPopupHeader");
  const close=box.querySelector(".noaPopupClose");
  const resize=box.querySelector(".noaPopupResize");

  close.addEventListener("click",()=>{box.remove();window.updateNoaConnectors?.();});

  header.addEventListener("pointerdown",e=>{
    e.preventDefault();
    e.stopPropagation();

    box.style.zIndex=String(++noaPopupZ);

    const r=box.getBoundingClientRect();
    const sx=e.clientX,sy=e.clientY;
    const ox=r.left,oy=r.top;

    const move=ev=>{
      box.style.left=Math.max(
        0,Math.min(innerWidth-r.width,ox+ev.clientX-sx)
      )+"px";

      box.style.top=Math.max(
        0,Math.min(innerHeight-r.height,oy+ev.clientY-sy)
      )+"px";
      window.updateNoaConnectors?.();
    };

    const up=()=>{window.removeEventListener("pointermove",move);window.updateNoaConnectors?.();};

    window.addEventListener("pointermove",move,{passive:false});
    window.addEventListener("pointerup",up,{once:true});
  });

  resize.addEventListener("pointerdown",e=>{
    e.preventDefault();
    e.stopPropagation();

    box.style.zIndex=String(++noaPopupZ);

    const r=box.getBoundingClientRect();
    const sx=e.clientX,sy=e.clientY;
    const sw=r.width,sh=r.height;

    const move=ev=>{
      box.style.width=Math.max(
        240,Math.min(innerWidth-16,sw+ev.clientX-sx)
      )+"px";

      box.style.height=Math.max(
        180,Math.min(innerHeight-16,sh+ev.clientY-sy)
      )+"px";
      window.updateNoaConnectors?.();
    };

    const up=()=>window.removeEventListener("pointermove",move);

    window.addEventListener("pointermove",move,{passive:false});
    window.addEventListener("pointerup",up,{once:true});
  });

  return box;
}

window.NOA_POPUPS={
  create:(title,content)=>createNoaPopup(title,content),
  count:()=>popupCanvas.querySelectorAll(".noaPopupWindow").length
};
</script>

<script>
const body=document.body;

const chatBox=document.getElementById("chatBox");
const chatHistory=document.getElementById("chatHistory");
const chatInput=document.getElementById("chatInput");
const sendChat=document.getElementById("sendChat");
const closeChat=document.getElementById("closeChat");
const clearChat=document.getElementById("clearChat");

const NOA_WORKER="https://noa-brain-a78d.ajaiacharya7274.workers.dev/api/chat";

[5,8,12,18,11,23,16,29,19,24,14,9,6,10,16,22,15,20,27,17,10,14,20,25,15,9,5]
.forEach((h,i)=>{

});

function setState(s){

window.NOA={setState,getState:()=>state.textContent};

const STORAGE_KEY="NOA_CHAT_HISTORY_V1";
let history=[];

function loadHistory(){
  try{
    const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
    history=Array.isArray(parsed)?parsed:[];
  }catch(_){ history=[]; }
}
function saveHistory(){
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(history.slice(-100))); }catch(_){}
}
function renderHistory(){
  if(!chatHistory) return;
  chatHistory.innerHTML="";
  history.forEach(item=>{
    if(!item || typeof item.text!=="string") return;
    const bubble=document.createElement("div");
    bubble.className="message "+(item.role==="user"?"user":"noa");
    const label=document.createElement("span");
    label.className="messageLabel";
    label.textContent=item.role==="user"?"YOU":"NOA";
    const content=document.createElement("span");
    content.textContent=item.text;
    bubble.append(label,content);
    chatHistory.appendChild(bubble);
  });
  requestAnimationFrame(()=>chatHistory.scrollTop=chatHistory.scrollHeight);
}
function addHistory(role,text){
  const clean=String(text||"").trim();
  if(!clean) return;
  history.push({role:role==="user"?"user":"assistant",text:clean});
  if(history.length>100) history=history.slice(-100);
  saveHistory();
  renderHistory();
}
/* V12 world-distance fix:
   The main chat popup keeps its own direction and good distance from the orb.
   When the world zoom changes, that distance scales with the orb instead of
   letting the popup visually slide over the orb. */
function captureMainChatOrbOffset(){
  if(!chatBox || !window.NOALayoutChatOpen || !chatBox.classList.contains("chat-moved")) return;
  const orbEl=document.getElementById("orb");
  if(!orbEl) return;

  const or=orbEl.getBoundingClientRect();
  const cr=chatBox.getBoundingClientRect();
  const chatScale=window.NOALayoutChatOpen ? 0.58 : 1;
  const scale=Math.max(.001,popupWorldScale(zoom)*chatScale);

  window.NOAMainChatOrbOffsetX=((cr.left+cr.width/2)-(or.left+or.width/2))/scale;
  window.NOAMainChatOrbOffsetY=((cr.top+cr.height/2)-(or.top+or.height/2))/scale;
}

function applyMainChatOrbDistance(){
  if(!chatBox || !window.NOALayoutChatOpen || !chatBox.classList.contains("chat-moved")) return;
  if(!Number.isFinite(window.NOAMainChatOrbOffsetX) || !Number.isFinite(window.NOAMainChatOrbOffsetY)) return;

  const orbEl=document.getElementById("orb");
  if(!orbEl) return;

  const or=orbEl.getBoundingClientRect();
  const chatScale=window.NOALayoutChatOpen ? 0.58 : 1;
  const scale=popupWorldScale(zoom)*chatScale;

  const targetCenterX=(or.left+or.width/2)+(window.NOAMainChatOrbOffsetX*scale);
  const targetCenterY=(or.top+or.height/2)+(window.NOAMainChatOrbOffsetY*scale);

  /* CSS transform uses the popup center as transform-origin, so left/top
     remain the unscaled box center coordinates. */
  chatBox.style.left=(targetCenterX-(chatBox.offsetWidth/2))+"px";
  chatBox.style.top=(targetCenterY-(chatBox.offsetHeight/2))+"px";

  window.NOAMainChatWorldLeft=parseFloat(chatBox.style.left)-(window.NOAPanX||0);
  window.NOAMainChatWorldTop=parseFloat(chatBox.style.top)-(window.NOAPanY||0);
}

function positionChatAroundOrb(){
  if(!chatBox) return;
  const orbEl=document.getElementById("orb");
  if(!orbEl) return;

  /* On phones keep both the orb and popup visible at the same time.
     The popup remains fully resizable afterwards. */
  if(innerWidth<=600 && !chatBox.classList.contains("chat-user-sized")){
    chatBox.style.width=Math.min(310,innerWidth-32)+"px";
    chatBox.style.height=Math.min(380,Math.max(300,innerHeight*0.48))+"px";
  }

  putChatInPixels();
  const or=orbEl.getBoundingClientRect();
  const w=chatBox.offsetWidth,h=chatBox.offsetHeight,gap=18;
  const candidates=[
    /* Prefer above the orb, then below, then either side. */
    {left:or.left+or.width/2-w/2,top:or.top-h-gap},
    {left:or.left+or.width/2-w/2,top:or.bottom+gap},
    {left:or.right+gap,top:or.top+or.height/2-h/2},
    {left:or.left-w-gap,top:or.top+or.height/2-h/2}
  ];
  const c=candidates.find(v=>v.left>=12&&v.top>=12&&v.left+w<=innerWidth-12&&v.top+h<=innerHeight-12);
  const fallback={
    left:Math.max(12,Math.min(innerWidth-w-12,or.left+or.width/2-w/2)),
    top:Math.max(12,Math.min(innerHeight-h-12,or.top-h-gap))
  };
  const chosen=c||fallback;
  chatBox.style.left=chosen.left+"px";
  chatBox.style.top=chosen.top+"px";
  chatBox.classList.add("chat-moved");
  window.NOAMainChatWorldLeft=chosen.left-(window.NOAPanX||0);
  window.NOAMainChatWorldTop=chosen.top-(window.NOAPanY||0);
  chatCompact=false;
  clampChat();
  captureMainChatOrbOffset();
}
function openChat(){
  chatOverlay.classList.add("open");
  renderHistory();
  /* Make the orb smaller only while Chat is open, so the popup surrounds it instead of covering it. */
  window.NOALayoutChatOpen=true;
  applyOrbZoom();
  requestAnimationFrame(()=>{
    positionChatAroundOrb();
    window.updateNoaConnectors?.();
  });
  setTimeout(()=>chatInput.focus(),120);
}
function closeChatPopup(){
  chatOverlay.classList.remove("open");
  window.NOALayoutChatOpen=false;
  applyOrbZoom();
  requestAnimationFrame(()=>window.updateNoaConnectors?.());
}

/* Chat popup: stable mouse + touch drag and resize. */
let chatDragActive=false;
let chatDragDidMove=false;
let chatResizeActive=false;
let chatResizeDidMove=false;
let chatStartX=0,chatStartY=0;
let chatStartLeft=0,chatStartTop=0;
let chatStartWidth=0,chatStartHeight=0;
let chatInteraction=false;
let chatCompact=false;
let chatSavedWidth=0;
let chatSavedHeight=0;
let chatCompactWidth=0;
let chatCompactHeight=0;

const chatHeader=document.getElementById("chatHeader");
const chatResize=document.getElementById("chatResize");

function pointFromEvent(e){
  if(e.touches && e.touches.length) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches && e.changedTouches.length) return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return {x:e.clientX,y:e.clientY};
}

function putChatInPixels(){
  const r=chatBox.getBoundingClientRect();
  const w=r.width;
  const h=r.height;
  chatBox.style.width=w+"px";
  chatBox.style.height=h+"px";
  chatBox.style.left=r.left+"px";
  chatBox.style.top=r.top+"px";
  chatBox.classList.add("chat-moved");
}

function clampChat(){
  const w=chatBox.offsetWidth;
  const h=chatBox.offsetHeight;
  let left=parseFloat(chatBox.style.left);
  let top=parseFloat(chatBox.style.top);
  if(!Number.isFinite(left)) left=(innerWidth-w)/2;
  if(!Number.isFinite(top)) top=(innerHeight-h)/2;
  const maxLeft=Math.max(12,innerWidth-w-12);
  const maxTop=Math.max(12,innerHeight-h-12);
  chatBox.style.left=Math.max(12,Math.min(maxLeft,left))+"px";
  chatBox.style.top=Math.max(12,Math.min(maxTop,top))+"px";
  requestAnimationFrame(()=>window.updateNoaConnectors?.());
}

window.clampNoaChat=clampChat;

function compactChatPopup(){
  if(chatCompact)return;
  putChatInPixels();
  const r=chatBox.getBoundingClientRect();
  chatSavedWidth=r.width;
  chatSavedHeight=r.height;
  chatCompactWidth=Math.max(260,Math.round(r.width*.72));
  chatCompactHeight=Math.max(220,Math.round(r.height*.72));
  chatBox.style.width=chatCompactWidth+"px";
  chatBox.style.height=chatCompactHeight+"px";
  chatCompact=true;
  requestAnimationFrame(()=>window.updateNoaConnectors?.());
  window.NOAMainChatWorldLeft=parseFloat(chatBox.style.left)-(window.NOAPanX||0);
  window.NOAMainChatWorldTop=parseFloat(chatBox.style.top)-(window.NOAPanY||0);
}

function restoreChatPopup(){
  if(!chatCompact)return;
  chatBox.style.width=Math.max(280,chatSavedWidth)+"px";
  chatBox.style.height=Math.max(220,chatSavedHeight)+"px";
  chatCompact=false;
  window.NOAMainChatWorldLeft=parseFloat(chatBox.style.left)-(window.NOAPanX||0);
  window.NOAMainChatWorldTop=parseFloat(chatBox.style.top)-(window.NOAPanY||0);
  requestAnimationFrame(()=>window.updateNoaConnectors?.());
}

function startChatDrag(e){
  if(chatBox.classList.contains("chat-fullscreen"))return;
  if(e.target.closest("button"))return;
  if(e.pointerType==="mouse" && e.button!==0)return;

  putChatInPixels();
  const p=pointFromEvent(e);
  chatDragActive=true;
  chatDragDidMove=false;
  chatInteraction=true;
  chatStartX=p.x;
  chatStartY=p.y;
  chatStartLeft=parseFloat(chatBox.style.left)||0;
  chatStartTop=parseFloat(chatBox.style.top)||0;
  chatBox.classList.add("dragging");

  try{chatHeader.setPointerCapture?.(e.pointerId)}catch(_){}
  e.preventDefault();
  e.stopPropagation();
}

function moveChatDrag(e){
  if(!chatDragActive)return;
  const p=pointFromEvent(e);
  const dx=p.x-chatStartX,dy=p.y-chatStartY;
  if(Math.hypot(dx,dy)>6 && !chatDragDidMove){
    chatDragDidMove=true;
    window.NOALayoutChatOpen=true;
    applyOrbZoom();
    compactChatPopup();
    chatStartLeft=parseFloat(chatBox.style.left)||chatStartLeft;
    chatStartTop=parseFloat(chatBox.style.top)||chatStartTop;
    chatStartX=p.x;chatStartY=p.y;
  }
  /* Allow the popup to leave the viewport in every direction.
     It remains a world object and can be reached again by background panning. */
  chatBox.style.left=(chatStartLeft+p.x-chatStartX)+"px";
  chatBox.style.top=(chatStartTop+p.y-chatStartY)+"px";
  window.NOAMainChatWorldLeft=parseFloat(chatBox.style.left)-(window.NOAPanX||0);
  window.NOAMainChatWorldTop=parseFloat(chatBox.style.top)-(window.NOAPanY||0);
  captureMainChatOrbOffset();
  window.updateNoaConnectors?.();
  e.preventDefault();
  e.stopPropagation();
}

function stopChatDrag(e){
  if(!chatDragActive)return;
  chatDragActive=false;
  chatBox.classList.remove("dragging");
  try{chatHeader.releasePointerCapture?.(e.pointerId)}catch(_){}
  requestAnimationFrame(()=>window.updateNoaConnectors?.());
  setTimeout(()=>chatInteraction=false,0);
  if(e){e.preventDefault();e.stopPropagation();}
}

function startChatResize(e){
  if(chatBox.classList.contains("chat-fullscreen"))return;
  if(e.pointerType==="mouse" && e.button!==0)return;
  putChatInPixels();
  const p=pointFromEvent(e);
  const r=chatBox.getBoundingClientRect();

  chatResizeActive=true;
  chatResizeDidMove=false;
  chatInteraction=true;
  chatStartX=p.x;
  chatStartY=p.y;
  chatStartWidth=r.width;
  chatStartHeight=r.height;

  try{chatResize.setPointerCapture?.(e.pointerId)}catch(_){}
  e.preventDefault();
  e.stopPropagation();
}

function moveChatResize(e){
  if(!chatResizeActive)return;
  const p=pointFromEvent(e);
  const minW=280,minH=220;
  const maxW=Math.max(minW,innerWidth-24);
  const maxH=Math.max(minH,innerHeight-24);
  const nextW=Math.max(minW,Math.min(maxW,chatStartWidth+p.x-chatStartX));
  const nextH=Math.max(minH,Math.min(maxH,chatStartHeight+p.y-chatStartY));
  if(Math.abs(p.x-chatStartX)>3 || Math.abs(p.y-chatStartY)>3) chatResizeDidMove=true;
  chatBox.style.width=nextW+"px";
  chatBox.style.height=nextH+"px";
  chatBox.classList.add("chat-user-sized","chat-moved");
  clampChat();
  window.NOAMainChatWorldLeft=parseFloat(chatBox.style.left)-(window.NOAPanX||0);
  window.NOAMainChatWorldTop=parseFloat(chatBox.style.top)-(window.NOAPanY||0);
  captureMainChatOrbOffset();
  window.updateNoaConnectors?.();
  e.preventDefault();
  e.stopPropagation();
}

function stopChatResize(e){
  if(!chatResizeActive)return;
  chatResizeActive=false;
  try{chatResize.releasePointerCapture?.(e.pointerId)}catch(_){}
  setTimeout(()=>chatInteraction=false,0);
  if(e){e.preventDefault();e.stopPropagation();}
}

let noaChatFullscreenSnapshot=null;

function toggleNoaChatFullscreen(){
  if(!chatBox) return;

  if(!chatBox.classList.contains("chat-fullscreen")){
    noaChatFullscreenSnapshot={
      left:chatBox.style.left,
      top:chatBox.style.top,
      width:chatBox.style.width,
      height:chatBox.style.height,
      chatMoved:chatBox.classList.contains("chat-moved"),
      userSized:chatBox.classList.contains("chat-user-sized"),
      dragging:chatBox.classList.contains("dragging")
    };

    chatBox.classList.remove("dragging");
    chatDragActive=false;
    chatResizeActive=false;
    chatBox.classList.add("chat-fullscreen");
  }else{
    chatBox.classList.remove("chat-fullscreen");

    const snap=noaChatFullscreenSnapshot;
    if(snap){
      chatBox.style.left=snap.left;
      chatBox.style.top=snap.top;
      chatBox.style.width=snap.width;
      chatBox.style.height=snap.height;
      chatBox.classList.toggle("chat-moved",snap.chatMoved);
      chatBox.classList.toggle("chat-user-sized",snap.userSized);
      chatBox.classList.toggle("dragging",snap.dragging);
    }
    noaChatFullscreenSnapshot=null;
  }

  requestAnimationFrame(()=>{
    window.updateNoaConnectors?.();

async function ask(text){
  const message=String(text||"").trim();
  if(!message) return "";
  addHistory("user",message);
  setState("THINKING");
  try{
    const response=await fetch(NOA_WORKER,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message,history:history.slice(-20)})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||`HTTP ${response.status}`);
    const reply=String(data.reply||data.response||data.message||data.text||data.output||"").trim();
    const answer=reply||"NOA received the request, but the brain returned no text.";
    addHistory("assistant",answer);
    speakText(answer);
    return answer;
  }catch(error){
    const answer="NOA brain connection failed.";
    addHistory("assistant",answer);
    speakText(answer);
    console.error("NOA worker error",error);
    return answer;
  }
}

async function handleUserInput(text){
  const clean=String(text||"").trim();
  if(!clean) return;
  const parsed=window.NOA.parseCommand?window.NOA.parseCommand(clean):null;
  if(parsed && parsed.type==="safe") return window.NOA.commandEngine.command(clean);
  if(parsed && parsed.type==="requires_agent") return window.NOA.commandEngine.command(clean);
  if(parsed && parsed.type==="confirmation") return window.NOA.commandEngine.command(clean);
  return ask(clean);
}

// NOA device-command engine.
// The browser UI only prepares and dispatches safe device intents.
// A future Android/PC agent can subscribe to the same events and execute them.
const NOACommand = (() => {
  const dangerous = [
    "delete", "remove", "format", "factory reset", "purchase",
    "buy", "send money", "shutdown", "restart", "install", "uninstall"
  ];

  const patterns = [
    [/^(open|launch|start)\s+(.+)$/i, "OPEN_APP"],
    [/^(search|google)\s+(.+)$/i, "WEB_SEARCH"],
    [/^(take|capture)\s+(a\s+)?screenshot$/i, "SCREENSHOT"],
    [/^(lock)\s+(my\s+)?(phone|pc|computer|device)$/i, "LOCK_DEVICE"],
    [/^(turn|switch)\s+(on|off)\s+(.+)$/i, "TOGGLE_SETTING"],
    [/^(copy)\s+(.+)$/i, "COPY_TEXT"],
    [/^(type|write)\s+(.+)$/i, "TYPE_TEXT"],
    [/^(send)\s+(.+)$/i, "SEND_MESSAGE"],
  ];

  function parse(text) {
    const clean = String(text || "").trim().replace(/\s+/g, " ");
    if (!clean) return null;

    const lower = clean.toLowerCase();
    const risk = dangerous.some(word => lower.includes(word));

    for (const [regex, type] of patterns) {
      const match = clean.match(regex);
      if (!match) continue;

      const args = match.slice(2);
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        text: clean,
        type,
        args,
        requiresConfirmation: risk || ["SEND_MESSAGE","TYPE_TEXT","COPY_TEXT","TOGGLE_SETTING","LOCK_DEVICE"].includes(type),
        target: /pc|computer|desktop|windows|mac/i.test(clean) ? "PC" : "PHONE_OR_BROWSER"
      };
    }

    return {
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      text: clean,
      type: "UNKNOWN",
      args: [clean],
      requiresConfirmation: false,
      target: "NOA"
    };
  }

  function dispatch(intent) {
    if (!intent) return;
    window.dispatchEvent(new CustomEvent("noa:command", { detail: intent }));
    return intent;
  }

  return { parse, dispatch, execute(text) { return dispatch(parse(text)); } };
})();

window.NOA = window.NOA || {};
window.NOA.executeCommand = NOACommand.execute;

window.addEventListener("noa:command", event => {
  const intent = event.detail;
  if (!intent) return;

  // Temporary status only: nothing is permanently added to the UI.
  if (typeof setState === "function") setState("EXECUTING");

  // Browser-safe actions that can actually execute without an external agent.
  if (intent.type === "WEB_SEARCH") {
    const q = encodeURIComponent(intent.args[0] || "");
    window.open("https://www.google.com/search?q=" + q, "_blank", "noopener");
    setTimeout(() => setState("COMPLETE"), 350);
    return;
  }

  if (intent.type === "OPEN_APP") {
    const app = (intent.args[0] || "").toLowerCase().trim();

    // Common browser destinations. OS-level apps require the future device agent.
    const known = {
      "youtube": "https://www.youtube.com/",
      "google": "https://www.google.com/",
      "gmail": "https://mail.google.com/",
      "whatsapp": "https://web.whatsapp.com/",
      "github": "https://github.com/"
    };

    if (known[app]) {
      window.open(known[app], "_blank", "noopener");
      setTimeout(() => setState("COMPLETE"), 350);
    } else {
      // Dispatch is still available to a connected Android/PC agent.
      window.dispatchEvent(new CustomEvent("noa:device-action", { detail: intent }));
      setTimeout(() => setState("IDLE"), 600);
    }
    return;
  }

  // All OS/device actions are handed to the future device bridge.
  window.dispatchEvent(new CustomEvent("noa:device-action", { detail: intent }));
  setTimeout(() => setState("IDLE"), 700);
});

mic.addEventListener("pointerdown",e=>{

  const r=mic.getBoundingClientRect();

  if(Math.abs(dx)>3||Math.abs(dy)>3){
    wasDragged=true;
    mic.style.right="auto";
    mic.style.bottom="auto";
    mic.style.left=Math.max(0,Math.min(innerWidth-r.width,r.left+dx))+"px";
    mic.style.top=Math.max(0,Math.min(innerHeight-r.height,r.top+dy))+"px";

});

function endMicPointer(e){

  if(wasDragged){
    mic.dataset.dragged="1";
    setTimeout(()=>delete mic.dataset.dragged,180);
  }

  grabX=0;

}

// ============================================================
// NOA COMMAND ENGINE — Phase 1
// Clean UI stays unchanged. Commands are parsed locally.
// ============================================================
const NOACommandEngine = (() => {
  const safeActions = {
    open_url(url) {
      const w = window.open(url, "_blank", "noopener,noreferrer");
      return w ? `Opening ${url}` : "Browser blocked the new tab.";
    },
    zoom_in() {
      zoom = Math.min(MAX_ZOOM, zoom + 0.15);
      applyOrbZoom();
      return "Zooming in.";
    },
    zoom_out() {
      zoom = Math.max(MIN_ZOOM, zoom - 0.15);
      applyOrbZoom();
      return "Zooming out.";
    },
    reset_zoom() {
      zoom = 1;
      applyOrbZoom();
      return "Zoom reset.";
    },
    show_state() {
      return `NOA is ${state.textContent.toLowerCase()}.`;
    }
  };

  function normalize(text) {
    return String(text || "").trim().toLowerCase().replace(/\s+/g, " ");
  }

  function parse(text) {
    const t = normalize(text);

    if (!t) return {type:"empty"};

    if (/^(zoom in|zoom closer|make it bigger)$/.test(t))
      return {type:"safe", action:"zoom_in"};

    if (/^(zoom out|zoom away|make it smaller)$/.test(t))
      return {type:"safe", action:"zoom_out"};

    if (/^(reset zoom|normal size|reset orb)$/.test(t))
      return {type:"safe", action:"reset_zoom"};

    if (/^(what state are you in|what is your state|status)$/.test(t))
      return {type:"safe", action:"show_state"};

    const urlMatch = t.match(/^(?:open|go to|visit)\s+(https?:\/\/\S+|www\.\S+\.\S+)$/);
    if (urlMatch) {
      let url = urlMatch[1];
      if (url.startsWith("www.")) url = "https://" + url;
      return {type:"safe", action:"open_url", args:{url}};
    }

    // Explicitly classify device-control requests instead of pretending
    // the browser can execute them.
    if (/^(open|launch|start)\s+/.test(t))
      return {type:"requires_agent", text};

    if (/(send|delete|remove|buy|pay|transfer|post|publish|install|change password)/.test(t))
      return {type:"confirmation", text};

    return {type:"unknown", text};
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
  }

  function execute(parsed) {
    if (parsed.type === "empty") return;

    if (parsed.type === "safe") {
      setState("THINKING");
      const result = safeActions[parsed.action](...(parsed.args ? Object.values(parsed.args) : []));
      setState("SPEAKING");
      speak(result);
      setTimeout(() => setState("IDLE"), 900);
      return result;
    }

    if (parsed.type === "requires_agent") {
      const result = "This command needs the NOA device agent.";
      setState("THINKING");
      speak(result);
      setTimeout(() => setState("IDLE"), 900);
      return result;
    }

    if (parsed.type === "confirmation") {
      const result = "This action requires confirmation before execution.";
      setState("THINKING");
      speak(result);
      setTimeout(() => setState("IDLE"), 900);
      return result;
    }

    const result = "I understand the command, but I don't have an action for it yet.";
    setState("THINKING");
    speak(result);
    setTimeout(() => setState("IDLE"), 900);
    return result;
  }

  return {
    parse,
    execute,
    command(text) {
      const parsed = parse(text);
      return {parsed, result: execute(parsed)};
    }
  };
})();

window.NOA = window.NOA || {};
window.NOA.command = text => NOACommandEngine.command(text);
window.NOA.parseCommand = text => NOACommandEngine.parse(text);

        return `NOA is ${state.textContent.toLowerCase()}.`;
      }
    },
    open_url: {
      risk: "medium",
      run(url) {
        const w = window.open(url, "_blank", "noopener,noreferrer");
        return w ? "Opening it." : "The browser blocked the new tab.";
      }
    }
  };

  function normalize(input) {
    return String(input || "").trim().toLowerCase().replace(/\s+/g, " ");
  }

  function understand(input) {
    const text = normalize(input);

    if (!text) return {intent:"empty", text};

    if (/^(zoom in|make it bigger|zoom closer)$/.test(text))
      return {intent:"zoom_in", text};

    if (/^(zoom out|make it smaller|zoom away)$/.test(text))
      return {intent:"zoom_out", text};

    if (/^(reset zoom|normal size|reset orb)$/.test(text))
      return {intent:"reset_zoom", text};

    if (/^(status|what is your state|what state are you in)$/.test(text))
      return {intent:"status", text};

    const match = text.match(/^(?:open|go to|visit)\s+(https?:\/\/\S+|www\.\S+)$/);
    if (match) {
      let url = match[1];
      if (url.startsWith("www.")) url = "https://" + url;
      return {intent:"open_url", text, args:{url}};
    }

    if (/(send|delete|remove|pay|purchase|transfer|publish|post|install|change password)/.test(text))
      return {intent:"confirmation_required", text};

    return {intent:"device_action", text};
  }

  function remember(entry) {
    memory.session.push({
      input: entry.input,
      intent: entry.intent,
      time: Date.now()
    });
    if (memory.session.length > 50) memory.session.shift();
  }

  function plan(parsed) {
    if (parsed.intent === "empty") return {type:"noop"};
    if (actions[parsed.intent]) {
      return {
        type: "action",
        action: parsed.intent,
        args: parsed.args || {},
        risk: actions[parsed.intent].risk
      };
    }
    if (parsed.intent === "confirmation_required")
      return {type:"confirmation", reason:"This action can have a real-world consequence."};

    // Device commands are intentionally not faked in the browser.
    return {type:"device_agent_required", command:parsed.text};
  }

  function execute(planResult) {
    if (planResult.type === "noop") return {ok:true, message:""};

    if (planResult.type === "confirmation")
      return {ok:false, requiresConfirmation:true, message:"Confirmation is required before I execute that."};

    if (planResult.type === "device_agent_required")
      return {ok:false, requiresAgent:true, message:"That requires the NOA Device Agent."};

    const action = actions[planResult.action];
    if (!action) return {ok:false, message:"I don't have an action for that yet."};

    setState("THINKING");
    const args = planResult.args || {};
    const result = action.run(...Object.values(args));
    setState("SPEAKING");
    setTimeout(() => setState("IDLE"), 900);
    return {ok:true, message:result};
  }

  function command(input) {
    const parsed = understand(input);
    remember({input, intent:parsed.intent});
    const planResult = plan(parsed);
    const result = execute(planResult);
    return {parsed, plan:planResult, result};
  }

  return {
    command,
    understand,
    getMemory: () => [...memory.session],
    setGoal: goal => memory.activeGoal = goal,
    getGoal: () => memory.activeGoal,
    permissions
  };
})();

window.NOA = window.NOA || {};
window.NOA.command = input => NOACore.command(input);
window.NOA.brain = NOACore;


// ============================================================
// NOA TASK ENGINE v1
// Headless agent lifecycle: perceive -> understand -> plan ->
// permission -> execute -> verify -> respond.
// ============================================================
const NOATaskEngine = (() => {
  const tasks = new Map();
  let sequence = 0;

  const risk = {
    LOW: "LOW",
    MEDIUM: "MEDIUM",
    HIGH: "HIGH"
  };

  function create(input) {
    const id = `task_${++sequence}`;
    const task = {
      id,
      input: String(input || ""),
      status: "received",
      risk: risk.LOW,
      plan: [],
      result: null,
      createdAt: Date.now()
    };
    tasks.set(id, task);
    return task;
  }

  function update(task, patch) {
    Object.assign(task, patch);
    tasks.set(task.id, task);
    return task;
  }

  function perceive(task) {
    return update(task, {
      status: "perceived",
      context: {
        screen: "NOA orb",
        state: document.body.dataset.state || "idle",
        time: new Date().toISOString()
      }
    });
  }

  function understand(task) {
    const parsed = NOACore.understand(task.input);
    return update(task, {
      status: "understood",
      intent: parsed.intent,
      parsed
    });
  }

  function plan(task) {
    const plan = NOACore.command(task.input).plan;

    let taskRisk = risk.LOW;
    if (plan.type === "confirmation") taskRisk = risk.HIGH;
    else if (plan.type === "device_agent_required") taskRisk = risk.MEDIUM;
    else if (plan.action === "open_url") taskRisk = risk.MEDIUM;

    return update(task, {
      status: "planned",
      plan,
      risk: taskRisk
    });
  }

  function permission(task) {
    if (task.risk === risk.HIGH) {
      return update(task, {
        status: "waiting_for_confirmation",
        permission: "confirmation_required"
      });
    }

    if (task.risk === risk.MEDIUM && task.plan.type === "device_agent_required") {
      return update(task, {
        status: "waiting_for_agent",
        permission: "device_agent_required"
      });
    }

    return update(task, {
      status: "authorized",
      permission: "allowed"
    });
  }

  function execute(task) {
    if (task.status !== "authorized") return task;

    setState("EXECUTING");

    let result;
    if (task.plan.type === "action") {
      const action = task.plan.action;
      const args = task.plan.args || {};
      const actionMap = {
        zoom_in: () => {
          zoom = Math.min(MAX_ZOOM, zoom + 0.15);
          applyOrbZoom();
          return "Zoomed in.";
        },
        zoom_out: () => {
          zoom = Math.max(MIN_ZOOM, zoom - 0.15);
          applyOrbZoom();
          return "Zoomed out.";
        },
        reset_zoom: () => {
          zoom = 1;
          applyOrbZoom();
          return "Zoom reset.";
        },
        status: () => `NOA is ${state.textContent.toLowerCase()}.`,
        open_url: () => {
          const w = window.open(args.url, "_blank", "noopener,noreferrer");
          return w ? `Opened ${args.url}` : "The browser blocked the new tab.";
        }
      };

      result = actionMap[action]
        ? actionMap[action]()
        : "Action is not implemented yet.";
    } else {
      result = "No executable action is available.";
    }

    return update(task, {
      status: "executed",
      result
    });
  }

  function verify(task) {
    let verified = false;

    if (task.status === "executed") {
      if (task.plan.action === "zoom_in" || task.plan.action === "zoom_out" ||
          task.plan.action === "reset_zoom") {
        verified = true;
      } else if (task.plan.action === "status") {
        verified = true;
      } else if (task.plan.action === "open_url") {
        // Browser APIs don't expose reliable cross-window verification.
        verified = task.result !== "The browser blocked the new tab.";
      }
    }

    return update(task, {
      status: verified ? "verified" : "completed_with_limit",
      verified
    });
  }

  function respond(task) {
    const message =
      task.status === "waiting_for_confirmation"
        ? "Confirmation required."
        : task.status === "waiting_for_agent"
        ? "The NOA Device Agent is required for this action."
        : task.result || "Task completed.";

    setState("SPEAKING");
    if ("speechSynthesis" in window && message) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(message));
    }
    setTimeout(() => setState("IDLE"), 900);

    return update(task, {
      status: task.status === "verified" ? "responded" : task.status,
      response: message
    });
  }

  function run(input) {
    const task = create(input);
    perceive(task);
    understand(task);
    plan(task);
    permission(task);

    if (task.status === "authorized") {
      execute(task);
      verify(task);
    }

    return respond(task);
  }

  return {
    run,
    get: id => tasks.get(id) || null,
    list: () => [...tasks.values()]
  };
})();

window.NOA = window.NOA || {};
window.NOA.runTask = input => NOATaskEngine.run(input);
window.NOA.tasks = NOATaskEngine;
window.NOA.ask = ask;
window.NOA.openChat = openChat;
window.NOA.handleUserInput = handleUserInput;

</script>
